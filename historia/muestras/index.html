<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coquí · pick a voice</title>
<style>
body{margin:0;background:#0E1A24;color:#F4E9D0;font:16px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:14px 12px 60px}
h1{font-size:20px;margin:6px 0 4px}
p{margin:4px 0 12px;color:#B9C6D2}
.tabs{display:flex;gap:8px;margin:10px 0 12px}
.tabs button{flex:1;padding:10px 6px;border:0;border-radius:8px;background:#24394A;color:#F4E9D0;font:inherit}
.tabs button.on{background:#FFE040;color:#2A1810;font-weight:700}
.v{display:flex;align-items:center;gap:12px;padding:10px;margin:0 0 8px;border-radius:10px;background:#172836}
.v.now{outline:2px solid #FFE040}
.v button{flex:none;width:48px;height:48px;border:0;border-radius:50%;background:#FFE040;font-size:20px;color:#2A1810}
.v b{display:block}
.v span{color:#9FB1C0;font-size:14px}
#none{color:#B9C6D2;padding:20px 0}
</style></head><body><main>
<h1>Pick a voice</h1>
<p id="what">Every Spanish voice reads the same six lines. Tap one to hear it. Tell Claude the name you like.</p>
<div class="tabs"><button data-g="" class="on">All</button><button data-g="Male">Men</button><button data-g="Female">Women</button></div>
<div id="list"></div>
<div id="none" hidden>No samples yet. They appear here once the audio job has run.</div>
</main>
<script>
const list=document.getElementById("list");let voces=[],g="",au=null,cur=null;
function show(){list.innerHTML="";voces.filter(v=>!g||v.genero===g).forEach(v=>{const d=document.createElement("div");d.className="v"+(cur===v.voz?" now":"");
  d.innerHTML='<button aria-label="Play">▶</button><div><b></b><span></span></div>';d.querySelector("b").textContent=v.voz;d.querySelector("span").textContent=[v.lugar,v.genero==="Male"?"man":v.genero==="Female"?"woman":v.genero].filter(Boolean).join(" · ");
  d.querySelector("button").onclick=()=>{if(au)au.pause();au=new Audio(encodeURIComponent(v.voz)+".mp3");au.play();cur=v.voz;show();};list.appendChild(d);});}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{g=b.dataset.g;document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));show();});
fetch("voces.json").then(r=>{if(!r.ok)throw 0;return r.json();}).then(j=>{voces=j.voces||[];document.getElementById("what").textContent=voces.length+" Spanish voices read the same six lines. Tap one to hear it. Tell Claude the name you like.";show();}).catch(()=>{document.getElementById("none").hidden=false;});
</script></body></html>
