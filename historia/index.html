<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0E1A24">
<link rel="icon" href="data:,">
<title>Coquí</title>
<style>
html,body{margin:0;height:100%;background:#0E1A24;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;box-sizing:border-box;padding:8px 0}
#stage{position:relative;line-height:0}
canvas{display:block;image-rendering:crisp-edges;image-rendering:pixelated;touch-action:none;border-radius:8px;box-shadow:0 0 0 3px #2A1810,0 0 0 6px #F4CC88}
.rnd{position:absolute;border:0;border-radius:50%;background:#FFE040;box-shadow:0 0 0 4px #2A1810,0 6px 0 4px #2A1810;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.rnd:active{transform:translateY(4px);box-shadow:0 0 0 4px #2A1810,0 2px 0 4px #2A1810}
#go{left:50%;top:50%;width:104px;height:104px;margin:-52px 0 0 -52px}
#again{left:50%;bottom:22px;width:72px;height:72px;margin-left:-36px;display:none}
#bar{display:flex;gap:8px;align-items:center;height:30px}
.dot{width:12px;height:12px;border-radius:3px;background:#24394A;box-shadow:0 0 0 2px #2A1810}
.dot.on{background:#FFE040}
#snd{margin-left:14px;width:34px;height:30px;border:0;border-radius:6px;background:#24394A;box-shadow:0 0 0 2px #2A1810;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
#snd.off svg .w{display:none}
#snd.off svg .x{display:block}
#snd svg .x{display:none}
</style></head><body>
<div id="wrap">
  <div id="stage">
    <canvas id="cv" width="196" height="216"></canvas>
    <button class="rnd" id="go" aria-label="Start"><svg width="46" height="46" viewBox="0 0 24 24"><path d="M7 4.500v15l12.500-7.500z" fill="#2A1810"/></svg></button>
    <button class="rnd" id="again" aria-label="Again"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#2A1810" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.500-5.800"/><path d="M20 4v5h-5"/></svg></button>
  </div>
  <div id="bar">
    <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
    <button id="snd" aria-label="Sound"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F4CC88" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z" fill="#F4CC88"/><path class="w" d="M15.500 8.500a5 5 0 0 1 0 7"/><path class="w" d="M18.500 5.500a9 9 0 0 1 0 13"/><path class="x" d="m16 9 6 6m0-6-6 6"/></svg></button>
  </div>
</div>
<script src="engine.js?v=9"></script>
<script src="juego.js?v=9"></script>
<script src="escenas/frente.js?v=9"></script>
<script>arranca();</script>
</body></html>
