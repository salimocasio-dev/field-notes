<title>Coquí · La casa de la abuela</title>
<style>
html,body{margin:0;height:100%;background:#0E1A24;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}

#stage{position:relative;line-height:0}
canvas{display:block;image-rendering:crisp-edges;image-rendering:pixelated;touch-action:none;border-radius:8px;box-shadow:0 0 0 3px #2A1810,0 0 0 6px #F4CC88}

.rnd:active{transform:translateY(4px);box-shadow:0 0 0 4px #2A1810,0 2px 0 4px #2A1810}
#go{left:50%;top:50%;width:104px;height:104px;margin:-52px 0 0 -52px}

#snd{margin-left:14px;width:34px;height:30px;border:0;border-radius:6px;background:#24394A;box-shadow:0 0 0 2px #2A1810;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}

</style></head><body>
<div id="wrap">
  <div id="stage">
    <canvas id="cv" width="196" height="216"></canvas>
    <button class="rnd" id="go" aria-label="Start"><svg width="46" height="46" viewBox="0 0 24 24"><path d="M7 4.500v15l12.500-7.500z" fill="#2A1810"/></svg></button>
    <button class="rnd" id="again" aria-label="Again"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#2A1810" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.500-5.800"/><path d="M20 4v5h-5"/></svg></button>
  </div>

    <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>

  </div>
</div>
<script src="engine.js"></script>
<script>
"use strict";
/* ============================================================
   Coquí · story 1 of El frente: "La casa de la abuela"
   Pass "mira": every new thing is pointed at. Pass "busca": no pointer.
   The spoken lines are in lines.json. Until the recordings exist the
   story runs silent, with the same timing.
   ============================================================ */
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const Q=new URLSearchParams(location.search),FAST=+(Q.get("fast")||1),PASS=Q.get("paso")==="busca"?"busca":"mira";
const DW=196,DH=216,SW=240,SH=216,TICK=70;
const cv=$("#cv"),dc=cv.getContext("2d"),sc=document.createElement("canvas");sc.width=SW;sc.height=SH;const c=sc.getContext("2d");

/* ---------- the place: the front of grandma's house ---------- */
function bgFrente(door){const b=new Buf(SW,SH),T=RP.teal,C=RP.cream,Wd=RP.wood,ST=RP.stone;
  sky(b,SW,96);grass(b,96,SW,SH);
  for(let y=119;y<SH;y++){const t=(y-119)/(SH-119),xl=Math.round(142-34*t),xr=Math.round(188+34*t);
    for(let x=xl;x<=xr;x++)b.px(x,y,x===xl||x===xr?ST[0]:(y%6===0||(x+Math.floor(y/6)*7)%13===0)?ST[1]:hs(x,y)<8?ST[4]:ST[3]);}
  b.grad(70,44,144,60,[T[3],T[3],T[2],T[2],T[1]],true);
  for(let y=49;y<104;y+=5)for(let x=70;x<214;x++)b.px(x,y,T[1]);
  for(let y=44;y<51;y++)for(let x=70;x<214;x++)if(bay(x,y)<(51-y)/8)b.px(x,y,T[0]);
  b.rect(69,44,1,60,"#134A4C");b.rect(214,44,1,60,"#134A4C");
  for(let y=16;y<42;y++){const t=(y-16)/25,xl=Math.round(88-30*t),xr=Math.round(196+30*t),k=(y-16)%5,rw=Math.floor((y-16)/5);
    for(let x=xl;x<=xr;x++)b.px(x,y,x===xl||x===xr||y===41?"#4A1210":y===16?RP.red[4]:k===4?RP.red[0]:(x+rw*4)%8===0?RP.red[1]:bay(x,y)<t*.8?RP.red[2]:RP.red[3]);}
  b.rect(58,42,169,3,C[3]);b.rect(58,44,169,1,C[1]);b.frame(57,41,171,4,OUT);
  b.rect(86,58,7,26,"#FFFFFF");b.rect(131,58,7,26,"#FFFFFF");for(let y=60;y<84;y+=3){b.rect(86,y,7,1,ST[2]);b.rect(131,y,7,1,ST[2]);}
  b.frame(85,57,9,28,OUT);b.frame(130,57,9,28,OUT);
  b.rect(94,58,36,26,C[3]);b.grad(97,61,30,20,[RP.blue[4],RP.blue[3],RP.blue[2]]);b.rect(111,61,2,20,C[3]);b.rect(97,70,30,2,C[3]);
  for(let i=0;i<7;i++){b.px(100+i,67-i,"#FFFFFF");b.px(116+i,78-i,"#FFFFFF");}
  b.frame(93,57,38,28,OUT);b.frame(96,60,32,22,C[0]);
  b.rect(90,86,44,5,Wd[2]);b.rect(90,86,44,1,Wd[4]);b.frame(89,85,46,7,OUT);
  for(let i=0;i<9;i++){b.ell(93+i*4.8,83.5,2.2,2.2,[["#FF8FB8","#FFE070","#F4584A"][i%3]]);b.px(93+i*4.8,85,RP.grn[1]);}
  b.rect(150,50,32,54,C[3]);b.frame(149,49,34,56,OUT);
  if(door===1){b.grad(153,53,24,51,["#140A06","#22140C","#32201A"]);b.rect(177,53,4,51,Wd[2]);b.rect(177,53,1,51,Wd[4]);b.frame(152,52,26,53,OUT);}
  else if(door===.5){b.grad(153,53,11,51,["#140A06","#22140C","#32201A"]);b.grad(164,53,15,51,[Wd[3],Wd[2],Wd[1],Wd[0]],true);b.rect(164,53,1,51,Wd[4]);b.frame(152,52,28,53,OUT);b.rect(163,52,1,53,OUT);b.rect(167,77,2,2,RP.yel[2]);}
  else{b.grad(153,53,26,51,[Wd[3],Wd[2],Wd[2],Wd[1]],true);b.frame(152,52,28,53,OUT);
    [[156,57,20,18],[156,80,20,20]].forEach(p=>{b.frame(p[0],p[1],p[2],p[3],Wd[0]);b.rect(p[0]+1,p[1]+1,p[2]-2,1,Wd[4]);b.rect(p[0]+1,p[1]+1,1,p[3]-2,Wd[4]);});
    b.rect(174,77,2,2,RP.yel[2]);}
  b.rect(187,60,4,6,RP.yel[3]);b.frame(186,59,6,8,OUT);b.rect(188,57,2,2,ST[0]);
  b.rect(62,104,160,6,ST[3]);b.rect(62,104,160,1,ST[4]);b.rect(62,109,160,1,ST[1]);b.frame(61,103,162,8,OUT);
  b.rect(146,111,38,4,ST[2]);b.rect(146,111,38,1,ST[4]);b.rect(142,115,46,4,ST[3]);b.rect(142,115,46,1,ST[4]);b.rect(142,118,46,1,ST[0]);b.rect(146,114,38,1,ST[0]);
  b.rect(153,104,24,2,RP.red[1]);
  const out=b.done(),x=b.cx;x.drawImage(spr("palm",mkPalm),30,34);x.drawImage(spr("bush",mkBush),206,92);x.drawImage(spr("pot",mkPot),192,78);x.drawImage(spr("bush",mkBush),44,96);
  return out;}

/* ---------- the world: everything that can change ---------- */
const CAM={wide:[44,0,196,216],door:[117,36,98,108]};
const BOX={casa:[60,17,166,90],puerta:[151,51,30,54],abuela:[151,56,29,49]};
let W,cam=CAM.wide.slice(),camA=null,F=0,pending=null,running=false,runId=0,muted=false;
function fresh(){W={door:0,ab:null,cq:{x:150,y:178,dy:0,talk:0,vis:1,bub:null},glow:null,glow2:null,hand:null,fx:[],heart:0,shake:0};cam=CAM.wide.slice();camA=null;pending=null;}
fresh();

const HAND=["....oo......","...owwo.....","...owwo.....","...owwo.....","...owwooo...","...owwowwoo.","oo.owwowwowo","owoowwwwwwwo","owwowwwwwwwo",".owwwwwwwwwo",".owwwwwwwwwo","..owwwwwwwo.","..owwwwwwwo.","...owwwwwo..","...ooooooo.."];
const HANDAT={casa:[118,27],puerta:[166,74],abuela:[165,80]};   // where the fingertip lands, in scene pixels
function hand(g,x,y,down){const o=down?0:5;HAND.forEach((rw,j)=>{for(let i=0;i<rw.length;i++){const ch=rw[i];if(ch!==".")fr(g,x+i*2,y+j*2+o,2,2,ch==="o"?OUT:"#FFFFFF");}});
  if(down){[[-7,-2],[3,-8],[14,-2]].forEach(p=>{fr(g,x+5+p[0]-1,y+p[1]-1,5,5,OUT);fr(g,x+5+p[0],y+p[1],3,3,"#FFE040");});}}
const HEART=[".##...##.","####.####","#########","#########",".#######.","..#####..","...###...","....#...."];
function heart(g,x,y,s){HEART.forEach((rw,j)=>{for(let i=0;i<rw.length;i++)if(rw[i]==="#"){fr(g,x+i*s-1,y+j*s-1,s+2,s+2,OUT);}});
  HEART.forEach((rw,j)=>{for(let i=0;i<rw.length;i++)if(rw[i]==="#")fr(g,x+i*s,y+j*s,s,s,j<2&&i<3?"#FF9A90":"#E8443C");});}
function star(g,x,y,s,hot){const col=hot?"#FFFFFF":"#FFE040";fr(g,x-1,y-s-1,3,2*s+3,OUT);fr(g,x-s-1,y-1,2*s+3,3,OUT);fr(g,x,y-s,1,2*s+1,col);fr(g,x-s,y,2*s+1,1,col);fr(g,x-1,y-1,3,3,col);}
function burst(g,x,y,k){const r=3+k*2;[[1,0],[-1,0],[0,1],[0,-1],[.7,.7],[-.7,.7],[.7,-.7],[-.7,-.7]].forEach(d=>{fr(g,Math.round(x+d[0]*r)-1,Math.round(y+d[1]*r)-1,3,3,OUT);});
  [[1,0],[-1,0],[0,1],[0,-1],[.7,.7],[-.7,.7],[.7,-.7],[-.7,-.7]].forEach(d=>{fr(g,Math.round(x+d[0]*r),Math.round(y+d[1]*r),1,1,"#FFFFFF");});}

function draw(){const a=F>>1;
  c.drawImage(spr("fr"+W.door,()=>bgFrente(W.door)),0,0);
  if(W.ab){const wv=W.ab.pose==="wave",pose=wv?"wave"+(a%2):"idle",op=W.ab.talk&&a%2?1:0;
    c.drawImage(spr("ab"+pose+op,()=>mkAbuela(pose,op)),135,55);
    if(W.ab.talk)talk(c,155,69,a,-1);
    if(W.ab.heart)heart(c,161,40-(a%2),1);}
  const q=W.cq;if(q.vis){shadow(c,q.x+3,q.y+25,26);c.drawImage(coqui(1,F,q.talk&&a%2),q.x,q.y+Math.round(q.dy));
    if(q.talk)talk(c,q.x+35,q.y+8,a,1);
    if(q.bub)bubble(c,[q.bub],q.x+16,q.y-1,a);}
  W.fx=W.fx.filter(e=>F-e.f0<e.n);
  W.fx.forEach(e=>{const k=F-e.f0;if(e.t==="star")e.pts.forEach((q,i)=>star(c,q[0],q[1],(i+a)%2?4:2,(i+a)%2));else if(e.t==="knock"){if(k%4<3)burst(c,e.x,e.y,k%4);}});
  if(W.heart)heart(c,125,2-(a%2),3);
  if(W.glow)pointer(c,BOX[W.glow],a);
  if(W.glow2)pointer(c,BOX[W.glow2],a);
  if(camA){const t=Math.min(1,(F-camA.f0)/camA.n),e=t*t*(3-2*t);for(let i=0;i<4;i++)cam[i]=camA.a[i]+(camA.b[i]-camA.a[i])*e;if(t>=1){cam=camA.b.slice();const r=camA.res;camA=null;r();}}
  const sx=W.shake>0?(W.shake--%2?1:-1):0;
  dc.imageSmoothingEnabled=false;dc.fillStyle="#0E1A24";dc.fillRect(0,0,DW,DH);
  dc.drawImage(sc,cam[0],cam[1],cam[2],cam[3],sx,0,DW,DH);
  if(W.hand){const p=HANDAT[W.hand],z=DW/cam[2],hx=Math.round((p[0]-cam[0])*z)-8,hy=Math.round((p[1]-cam[1])*z);hand(dc,hx,hy,(F>>2)%2===1);}
}
function loop(){F++;draw();}
setInterval(loop,TICK);draw();

/* ---------- sound: effects now, voices when the recordings exist ---------- */
let AC=null;const ac=()=>AC||(AC=new (window.AudioContext||window.webkitAudioContext)());
function tone(f0,at,dur,type,vol,f1){if(muted)return;try{const A=ac(),t=A.currentTime+at,o=A.createOscillator(),g=A.createGain();o.type=type||"square";o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);o.connect(g);g.connect(A.destination);o.start(t);o.stop(t+dur+.02);}catch(e){}}
function thump(at){if(muted)return;try{const A=ac(),t=A.currentTime+at,n=A.sampleRate*.09|0,bf=A.createBuffer(1,n,A.sampleRate),d=bf.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);
  const s=A.createBufferSource(),f=A.createBiquadFilter(),g=A.createGain();f.type="lowpass";f.frequency.value=420;g.gain.value=.5;s.buffer=bf;s.connect(f);f.connect(g);g.connect(A.destination);s.start(t);tone(150,at,.08,"sine",.25,70);}catch(e){}}
const SFX={chime(){tone(880,0,.12,"square",.04);tone(1320,.1,.2,"square",.04);},knock(){thump(0);thump(.17);},creak(){tone(210,0,.5,"sawtooth",.025,120);tone(330,.05,.4,"sawtooth",.012,170);},
  hop(){tone(320,0,.07,"square",.025,520);},coqui(){tone(1500,0,.11,"sine",.09);tone(2300,.17,.2,"sine",.09,2750);},win(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.11,.2,"square",.04));},no(){tone(240,0,.1,"sine",.06,200);}};
let LINES={},VOICE=false;
fetch("lines.json").then(r=>r.json()).then(j=>{LINES=j.clips||{};return fetch("audio/ready.json")}).then(r=>{VOICE=r.ok;}).catch(()=>{});
const words=id=>((LINES[id]||{}).text||"x x").split(/\s+/).length;
function say(id){const my=runId;return new Promise(res=>{const done=()=>res();
  if(VOICE&&!muted){const au=new Audio("audio/"+id+".mp3");au.onended=()=>setTimeout(done,350/FAST);au.onerror=()=>setTimeout(done,600/FAST);au.play().catch(()=>setTimeout(done,600/FAST));}
  else setTimeout(done,(380*words(id)+420)*.8/FAST);}).then(()=>{if(my!==runId)throw "stop";});}
const wait=ms=>{const my=runId;return sleep(ms/FAST).then(()=>{if(my!==runId)throw "stop";});};

/* ---------- moving things ---------- */
function camGo(k,n){return new Promise(res=>{camA={a:cam.slice(),b:CAM[k].slice(),f0:F,n:n||9,res};});}
async function hopTo(x,y,hops){const q=W.cq,x0=q.x,y0=q.y;for(let h=0;h<hops;h++){SFX.hop();const n=5;for(let i=1;i<=n;i++){const t=(h+i/n)/hops;q.x=Math.round(x0+(x-x0)*t);q.y=Math.round(y0+(y-y0)*t);q.dy=-7*Math.sin(Math.PI*i/n);await wait(TICK);}q.dy=0;await wait(110);}}
function fx(e){e.f0=F;W.fx.push(e);}
function react(what,p){
  if(what==="casa"){SFX.chime();fx({t:"star",n:18,pts:[[72,12],[214,14],[143,7],[64,66],[222,62],[108,34],[180,30],[p.x,p.y-9]]});}
  else if(what==="puerta"){SFX.knock();W.shake=6;fx({t:"knock",n:10,x:p.x,y:p.y});}
  else if(what==="abuela"){SFX.chime();W.ab.pose="wave";W.ab.heart=1;const my=runId;setTimeout(()=>{if(my===runId&&W.ab){W.ab.heart=0;}},1500/FAST);}
  else if(what==="coqui"){SFX.coqui();const q=W.cq;let i=0;const t=setInterval(()=>{i++;q.dy=-6*Math.sin(Math.PI*i/5);if(i>=5){q.dy=0;clearInterval(t);}},TICK);}
  else if(what==="sol"||what==="ventana"||what==="palma"){SFX.hop();fx({t:"star",n:8,pts:[[p.x-7,p.y-4],[p.x+8,p.y+2],[p.x,p.y-10]]});}
}
function hit(x,y){const inb=b=>x>=b[0]&&x<b[0]+b[2]&&y>=b[1]&&y<b[1]+b[3];
  if(W.ab&&inb(BOX.abuela))return "abuela";
  const q=W.cq;if(q.vis&&x>=q.x&&x<q.x+32&&y>=q.y&&y<q.y+27)return "coqui";
  if(inb([149,49,34,56]))return "puerta";
  if(inb([85,57,54,35]))return "ventana";
  if(y>=16&&y<42){const t=(y-16)/25;if(x>=88-30*t&&x<=196+30*t)return "casa";}
  if(inb([57,41,171,70]))return "casa";
  if((x-210)*(x-210)+(y-17)*(y-17)<144)return "sol";
  if(inb([34,36,30,70]))return "palma";
  return null;}

/* ---------- asking, and what happens on a touch ---------- */
function ask(target,line,o){o=o||{};const my=runId;return (async()=>{
  if(o.point)W.glow=target;
  await say(line);
  if(o.hand)W.hand=target;
  const got=new Promise(res=>{pending={target,res,tries:0,loose:!!o.loose};});
  const slow=o.hand?0:setTimeout(()=>{if(pending&&pending.target===target&&my===runId){W.glow=target;W.hand=target;}},6500/FAST);
  await got;clearTimeout(slow);pending=null;W.glow=null;W.glow2=null;W.hand=null;if(my!==runId)throw "stop";})();}
function tap(x,y){let what=hit(x,y);const p={x:Math.round(x),y:Math.round(y)};if(!what)return;
  if(pending){if(pending.loose&&pending.target==="casa"&&(what==="puerta"||what==="ventana"))what="casa";   // before the door has a name, the door is the house
    if(what===pending.target){react(what,p);pending.res();return;}
    if(what==="coqui"){react(what,p);return;}
    react(what,p);pending.tries++;
    if(BOX[what]&&PASS==="busca"){if(pending.tries===1){W.glow=pending.target;W.glow2=what;}else{W.glow=pending.target;W.glow2=null;W.hand=pending.target;}}
    return;}
  if(running)react(what,p);}
cv.addEventListener("pointerdown",e=>{e.preventDefault();const r=cv.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*DW,py=(e.clientY-r.top)/r.height*DH;tap(cam[0]+px/DW*cam[2],cam[1]+py/DH*cam[3]);});

/* ---------- the story ---------- */
const dots=[...document.querySelectorAll(".dot")],step=n=>dots.forEach((d,i)=>d.classList.toggle("on",i<n));
async function story(){const P=PASS==="mira";
  await wait(900);
  // 1. the house, on its own
  step(1);W.glow=P?"casa":null;await say("casa");await wait(350);await say("es_casa");await wait(300);
  await ask("casa","toca_casa",{point:P,hand:P,loose:true});await wait(500);await say("si_casa");await wait(500);
  // 2. the door: walk up, knock, nobody comes yet
  step(2);await hopTo(150,119,4);await wait(200);await camGo("door");
  W.glow=P?"puerta":null;await say("puerta");await wait(350);await say("puerta_casa");await wait(300);
  await ask("puerta","toca_puerta",{point:P,hand:P});await wait(600);await say("si_puerta");
  W.cq.bub="q";await wait(1500);W.cq.bub=null;
  // 3. house and door together: tell them apart, then knock again
  step(3);await camGo("wide");await wait(300);
  await ask("casa","toca_casa",{point:P});await wait(300);await say("si");await wait(300);
  await ask("puerta","toca_puerta",{point:P});await wait(300);await say("si");
  // 4. grandma opens the door
  step(4);await wait(400);await camGo("door");SFX.creak();W.door=.5;await wait(520);W.door=1;W.ab={pose:"idle",talk:0,heart:0};await wait(700);
  W.glow=P?"abuela":null;await say("abuela");await wait(350);W.glow=null;await say("abuela_abre");await wait(250);await say("abuela_abre_puerta");await wait(300);
  await ask("abuela","toca_abuela",{point:P,hand:P});await wait(900);await say("si_abuela");await wait(300);

  step(5);W.ab=null;await wait(450);await hopTo(150,80,2);W.cq.vis=0;await wait(350);SFX.creak();W.door=.5;await wait(420);W.door=0;await wait(400);
  await camGo("wide");W.heart=1;SFX.win();fx({t:"star",n:44,pts:[[66,20],[220,22],[104,8],[186,10],[60,70],[226,66],[84,40],[204,38]]});await say("casa_abuela");await wait(900);
}

  running=false;$("#again").style.display="flex";}
