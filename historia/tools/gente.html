const g=document.getElementById("out").getContext("2d");g.imageSmoothingEnabled=false;
const F_=window.FAMILIA||{};let x=4;
function pon(im,y){g.drawImage(im,x,y-im.height);x+=im.width-4;}
window.pinta=fam=>{g.fillStyle="#34B0B0";g.fillRect(0,0,420,150);g.fillStyle="#E0C690";g.fillRect(0,64,420,6);g.fillRect(0,134,420,6);x=4;
  Object.values(fam).forEach(w=>{pon(KIT.mkPersona(w,"idle",0,0),64);});
  ["wave0","offer","yo","tu","foto","taza","ojos"].forEach(p=>pon(KIT.mkPersona(Object.values(fam)[x%2],p,p==="yo"?1:0,0),64));
  x=4;Object.values(fam).forEach(w=>{pon(KIT.mkPersona(w,"idle",0,1),134);});
  ["idle","clap","llora","come"].forEach(e=>pon(KIT.mkBebe(e,1),134));pon(mkAbuela("idle",0),134);pon(KIT.mkAbuelaS("idle",0),134);pon(mkCoqui(1,0,0),134);pon(mkCoqui(.8,0,0),134);};
</script>
