<style>
/* A hybrid, as Salim's UI plan says: the course map is 16-bit pixel art; everything over it and every other screen
   is a clean modern UI. 8-point spacing, touch targets of 48 px or more, a system sans-serif, colour only for meaning. */
:root{--bg:#F6F5F1;--card:#FFFFFF;--ink:#16181D;--mut:#636A75;--line:#E3E1DA;--line2:#C9C6BB;--tint:#EEF1FF;--ok:#1E9E52;--bad:#D9480F;--info:#3B5BDB;--r:16px;--navh:72px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit}
.tab{display:none;min-height:100%;padding:16px 16px calc(var(--navh) + env(safe-area-inset-bottom) + 68px);max-width:560px;margin:0 auto}   /* the raised Mapa disc never covers content */
.tab.on{display:block}
h1{font-size:24px;line-height:32px;font-weight:600;margin:8px 0 16px}
h2{font-size:18px;line-height:24px;font-weight:500;margin:24px 0 16px}   /* 16 px between targets and cards, 24 px between sections */
.mut{color:var(--mut)}.small{font-size:14px}.lab{font-size:12px;font-weight:500;letter-spacing:.02em;color:var(--mut);text-transform:uppercase}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:0 0 16px;box-shadow:0 1px 2px rgba(0,0,0,.06),0 0 0 1px var(--line)}
.row{display:flex;align-items:center;gap:16px;min-height:56px}.row+.row{border-top:1px solid var(--line)}.grow{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border:1.5px solid transparent;border-radius:12px;background:var(--info);color:#fff;font-weight:600;cursor:pointer}   /* blue: every primary action that does not start learning */
.btn.full{width:100%}.btn.go{background:var(--ok)}   /* green: anything that starts or continues learning */
.btn.out{background:transparent;color:var(--ink);border-color:var(--line2)}   /* the one secondary button */
.btn:disabled{background:#E3E1DA;color:var(--mut);border-color:transparent;cursor:default}
.pb{flex:none;display:flex;align-items:center;justify-content:center;width:48px;height:48px;padding:0;border:0;border-radius:24px;background:var(--ok);color:#fff;cursor:pointer}   /* the one play control: a green 48 px disc, white triangle (stop: a white square) */
.pb svg{width:24px;height:24px}
.li{display:flex;align-items:center;gap:16px;min-height:64px;padding:8px 0}.li.rd{width:100%;border:0;border-radius:0;background:none;text-align:left;cursor:pointer;font-size:16px}.li+.li{border-top:1px solid var(--line)}.okc{color:#14793C;font-weight:600}
.btn:active,.pb:active,.tb:active,.play:active{transform:scale(.98)}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.seg button{min-height:48px;padding:0;border-radius:12px;border:1.5px solid var(--line2);background:transparent;font-weight:600;cursor:pointer}.seg button.on{background:var(--info);color:#fff;border-color:var(--info)}
.sw{position:relative;width:52px;height:48px;padding:0;border:0;background:none;cursor:pointer;flex:none}   /* the button is the 48 px touch target; the visible switch (the track and the knob) is 52 x 32 inside it */
.sw::before{content:"";position:absolute;left:0;top:8px;width:52px;height:32px;border-radius:16px;background:#D5D3CC}.sw i{position:absolute;top:12px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}.sw.on::before{background:var(--ok)}.sw.on i{left:24px}
/* the map tab: chips on top, the map in the space between the chips and the Today card, all over the map's own water pattern */
#t-mapa{position:fixed;left:0;right:0;top:0;bottom:calc(var(--navh) + env(safe-area-inset-bottom));min-height:0;max-width:none;margin:0;padding:0;overflow:hidden;background:#5C94FC}
#t-mapa.on{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"chips" "map" "hoy"}
#fondo{position:absolute;left:0;top:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#topchips{grid-area:chips;position:relative;z-index:2;display:flex;justify-content:center;align-items:center;gap:24px;height:calc(48px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 16px 0;background:#fff;border-bottom:1px solid var(--line);pointer-events:none}   /* flat labels, not buttons: no pill look, no shadow */
.chip{font-size:14px;line-height:20px;font-weight:600;color:var(--ink);white-space:nowrap}

#mapaarea::-webkit-scrollbar{display:none}
#mapw{position:relative;display:block}   /* its size and margins are set by escala(): a whole number of device pixels per map pixel */
#mapa,#ranac{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#mapa{touch-action:manipulation}
#ranac{position:absolute;left:0;top:0;pointer-events:none}   /* the top layer is drawn in device pixels: the frog (whole-number scaled) and the current stop's 4 px white ring, both crisp */
#hoy{grid-area:hoy;position:relative;z-index:2;width:100%;max-width:560px;margin:0 auto;padding:8px 16px 16px}
@media (orientation:landscape) and (max-height:500px){
  :root{--navh:56px}

  #t-mapa.on::after{content:"";grid-area:1/2/-1/3;z-index:0;background:var(--bg)}   /* the right column is a plain panel; the map keeps its water */
  #topchips{height:auto;padding:8px 16px;background:none;border:0}#hoy{padding:8px 16px}}
.play{display:flex;align-items:center;gap:16px;width:100%;min-height:80px;padding:16px;border:0;border-radius:var(--r);background:#fff;text-align:left;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.22)}
.btn svg{width:20px;height:20px}
.play .lab,.play b,.play .sub{display:block}.play .lab{line-height:16px}
.play b{font-size:18px;line-height:24px;font-weight:600;color:var(--ink)}   /* title 18 semibold, subtitle 14 secondary */
.play .sub{font-size:14px;line-height:20px;color:var(--mut)}
/* bottom tab bar: five destinations, the map in the centre */
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:#fff;box-shadow:0 -1px 0 var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .in{display:flex;max-width:560px;margin:0 auto;height:var(--navh);align-items:stretch}
.tb{flex:1;position:relative;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;padding:0 0 10px;font-size:12px;line-height:16px;font-weight:500;color:var(--mut);cursor:pointer}
.tb.on{color:var(--info)}.tb svg{width:24px;height:24px}
.tb.mid .disc{position:absolute;left:50%;top:-14px;margin-left:-28px;width:56px;height:56px;border-radius:28px;background:#fff;border:1.5px solid var(--line2);display:flex;align-items:center;justify-content:center}   /* inactive: white with a 1.5 px ring, the map icon in grey */
.tb.mid .disc svg{width:28px;height:28px;color:var(--mut)}
.tb.mid.on .disc{background:var(--info);border:4px solid #fff;box-shadow:0 4px 12px rgba(59,91,219,.4)}.tb.mid.on .disc svg{color:#fff}   /* active: blue with a white icon */
/* bottom sheet: sits above the tab bar, at most 70% of the screen high; a welcome (modal) covers the tab bar too */
#sheetbg{position:fixed;left:0;right:0;top:0;bottom:calc(var(--navh) + env(safe-area-inset-bottom));background:rgba(0,0,0,.35);z-index:8;display:none}
#sheetbg.modal{bottom:0;z-index:11}
#sheet{position:fixed;left:0;right:0;bottom:calc(var(--navh) + env(safe-area-inset-bottom));z-index:9;max-width:560px;margin:0 auto;background:#fff;border-radius:24px 24px 0 0;display:flex;flex-direction:column;max-height:70vh;overflow:hidden;
  transform:translateY(calc(100% + var(--navh) + env(safe-area-inset-bottom) + 8px));visibility:hidden;pointer-events:none;transition:transform .2s,visibility 0s .2s}
#sheet.on{transform:none;visibility:visible;pointer-events:auto;transition:transform .2s}
#sheet.modal{bottom:0;max-height:85vh;z-index:12}
#shead{position:relative;flex:none;height:56px;touch-action:none}
#shead .grab{position:absolute;left:50%;top:12px;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:#C9C7C0}
#shead .x{position:absolute;right:8px;top:8px;width:48px;height:48px;border:0;border-radius:24px;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
#shead .x svg{width:24px;height:24px}
#shead .st{display:none}   /* the sheet's title in its header row: only on a phone on its side, where the header is one line */
#sbody{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:0 16px 24px;-webkit-mask-image:linear-gradient(#000 calc(100% - 24px),transparent);mask-image:linear-gradient(#000 calc(100% - 24px),transparent)}   /* a line that scrolls out at the bottom fades instead of being cut; at the end of the list the padding takes the fade */
#sheet.modal #sbody{padding-top:24px}
#sfoot{flex:none;padding:8px 16px 16px}
#sheet.modal #sfoot{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
/* word cards */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.wc{position:relative;background:#fff;border-radius:var(--r);overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.06),0 0 0 1px var(--line);cursor:pointer;text-align:left;border:0;padding:0}
.wc .spk{position:absolute;top:8px;right:8px;display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:14px;background:rgba(255,255,255,.92);color:var(--ink)}.wc .spk svg{width:16px;height:16px}   /* the card plays the word: a 16 px speaker at its top right */
.wc canvas{display:block;width:100%;aspect-ratio:196/104;image-rendering:pixelated;background:#222}
.wc .t{padding:8px 12px 12px}.wc .w{font-size:18px;font-weight:600}
.bar{height:6px;border-radius:3px;background:#ECEAE3;margin:8px 0 4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
/* reading */
.ln{display:block;width:100%;min-height:48px;text-align:left;border:0;background:none;padding:10px 12px;border-radius:10px;font-size:18px;line-height:28px;cursor:pointer}
.ln.now{background:#E3F4EA}.ln.tap,.ln:active{background:var(--tint)}   /* the line playing is lit; a touch gives a pressed state for 150 ms */.ln .who{font-size:12px;font-weight:600;color:var(--mut);display:block;line-height:16px}
/* speaking: calls are not open yet, so the mic is a grey, disabled button in the bottom centre */
.call{display:flex;align-items:center;gap:16px;min-height:56px;padding:8px 0;opacity:.6}   /* plain text rows, not buttons. At 60 % only #16181D keeps 4.5:1 (4.53), so every text in them is ink; #636A75 would fall to 2.35 */
/* 32 px under the label: the Mapa disc rises 14 px above the tab bar, so the label stays 18 px clear of it */
#t-hablar{padding-bottom:256px}
.micbar{position:fixed;left:0;right:0;bottom:calc(var(--navh) + env(safe-area-inset-bottom));z-index:3;display:flex;flex-direction:column;align-items:center;gap:4px;padding:24px 0 32px;background:linear-gradient(rgba(246,245,241,0),var(--bg) 24px);pointer-events:none}
.mic{width:72px;height:72px;border-radius:36px;border:0;background:var(--line);display:flex;align-items:center;justify-content:center;cursor:default}
.mic svg{width:32px;height:32px;color:var(--mut)}
body:not(.ready) .tab,body:not(.ready) nav{visibility:hidden}
/* a phone on its side: a lower tab bar, a taller welcome, and the (disabled) mic at the right of the call list instead of over it */
@media (orientation:landscape) and (max-height:500px){
  .tb.mid .disc{top:-18px;margin-left:-22px;width:44px;height:44px;border-radius:22px}.tb.mid.on .disc{border-width:3px}.tb.mid .disc svg{width:24px;height:24px}
  #sheet.modal{max-height:calc(100vh - 16px);max-width:720px}
  #shead .st{display:block;position:absolute;left:16px;right:72px;top:16px;margin:0;font-size:24px;line-height:32px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #shead .grab{top:6px}.plhead{display:none}   /* header: the handle, 'La casa' and the X in one 56 px line, so three rows or more show */
  #t-hablar{max-width:none;margin:0;padding-bottom:88px;padding-right:168px}
  .micbar{left:auto;right:24px;bottom:calc(var(--navh) + env(safe-area-inset-bottom) + 36px);width:120px;padding:0;background:none}}   /* the disc rises 18 px here: 36 px keeps the label 18 px clear of it */
#hide{position:fixed;left:-9999px;top:0;width:10px;height:10px;overflow:hidden}
</style></head><body>

<script>
"use strict";
const db=()=>PAL.db,AJ=()=>db().ajustes,hecho=id=>!!(db().cuentos[id]&&db().cuentos[id].n),veces=id=>(db().cuentos[id]||{}).n||0;
const abierto=l=>AJ().todo||!!(l.cuentos&&l.cuentos.length);
const ir=c=>location.href="index.html?cuento="+c+"&desde=app";
const tick=()=>{try{navigator.vibrate&&navigator.vibrate(8);}catch(e){}};   // a crisp, short haptic on taps (Android); nothing long or buzzy
const SVG=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const IC={libro:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/>',cartas:'<rect x="7" y="4" width="13" height="16" rx="2"/><path d="M4 7v12a2 2 0 0 0 2 2h10"/>',mapa:'<path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/>',
  mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',yo:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',play:'<path d="M8 5v14l11-7z" fill="currentColor"/>',stop:'<rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',vol:'<path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/><path d="M16 9a4 4 0 0 1 0 6"/>'};
const TABS=[["biblioteca","Biblioteca","libro"],["palabras","Palabras","cartas"],["mapa","Mapa","mapa"],["hablar","Hablar","mic"],["yo","Yo","yo"]];
let TAB="mapa";
function tabs(){document.getElementById("tabs").innerHTML=TABS.map(t=>t[0]==="mapa"
  ?`<button class="tb mid ${TAB===t[0]?"on":""}" onclick="ver('${t[0]}')"><span class="disc">${SVG(IC[t[2]])}</span>${t[1]}</button>`
  :`<button class="tb ${TAB===t[0]?"on":""}" onclick="ver('${t[0]}')">${SVG(IC[t[2]])}${t[1]}</button>`).join("");}
let POS={};try{POS=JSON.parse(sessionStorage.getItem("coqui.pos")||"{}")||{};}catch(e){}   // each tab keeps its scroll position, also across a story (the page is loaded again then)
const posActual=()=>TAB==="mapa"?document.getElementById("mapaarea").scrollTop:scrollY;
addEventListener("pagehide",()=>{try{POS[TAB]=posActual();sessionStorage.setItem("coqui.pos",JSON.stringify(POS));}catch(e){}});
function ver(t){tick();cierra();if(t!==TAB)POS[TAB]=posActual();TAB=t;history.replaceState(null,"","?tab="+t);document.querySelectorAll(".tab").forEach(s=>s.classList.toggle("on",s.id==="t-"+t));
  tabs();({mapa:hud,biblioteca,palabras,hablar,yo})[t]();
  if(t==="mapa"){escala();if(POS.mapa!=null)document.getElementById("mapaarea").scrollTop=POS.mapa;pintaFondo();}else scrollTo(0,POS[t]||0);}

/* ---------- MAPA: 16-bit world map, scaled by whole numbers so every pixel stays sharp ---------- */
const MW=240,MH=352,STOP=[[120,326],[56,270],[184,270],[120,218],[56,166],[184,166],[56,114],[184,114],[120,66],[120,20]],
  ROAD=[[0,1],[0,2],[1,3],[2,3],[3,4],[3,5],[4,5],[4,6],[5,7],[6,7],[6,8],[7,8],[8,9]];
const DIG={"0":"111101101101111","1":"010110010010111","2":"111001111100111","3":"111001111001111","4":"101101111001001","5":"111100111001111","6":"111100111101111","7":"111001010010010","8":"111101111101111","9":"111101111001111"};
function digitos(g,t,cx,cy,col){const k=2,w=t.length*4*k-k,x0=Math.round(cx-w/2),y0=Math.round(cy-5*k/2);g.fillStyle=col||"#000";[...t].forEach((ch,j)=>{const d=DIG[ch];for(let r=0;r<5;r++)for(let q=0;q<3;q++)if(d[r*3+q]==="1")g.fillRect(x0+j*4*k+q*k,y0+r*k,k,k);});}
let dibujaMapa=()=>{};
const agua=(x,y)=>(x+y*2)%13===0?"#FFFFFF":((y>>2)+(x>>2))%2?"#3CBCFC":"#5C94FC";   // the map's own water, as drawn at its sides; it repeats every 104 pixels
let KMAP=1,AGUAT=null,CENTRADO=0;
function pintaFondo(){const f=document.getElementById("fondo"),t=document.getElementById("t-mapa"),cv=document.getElementById("mapa"),dpr=window.devicePixelRatio||1,tr=t.getBoundingClientRect(),W=Math.round(tr.width*dpr),H=Math.round(tr.height*dpr);
  if(!W||!H)return;if(f.width!==W)f.width=W;if(f.height!==H)f.height=H;
  const T=104*KMAP,mr=cv.getBoundingClientRect(),ox=Math.round((mr.left-tr.left)*dpr),oy=Math.round((mr.top-tr.top)*dpr),g=f.getContext("2d");
  if(!AGUAT||AGUAT.k!==KMAP){const b=new Buf(104,104);for(let y=0;y<104;y++)for(let x=0;x<104;x++)b.px(x,y,agua(x,y));
    const big=document.createElement("canvas");big.width=big.height=T;const bg=big.getContext("2d");bg.imageSmoothingEnabled=false;bg.drawImage(b.done(),0,0,T,T);AGUAT={k:KMAP,big};}
  g.setTransform(1,0,0,1,((ox%T)+T)%T-T,((oy%T)+T)%T-T);g.fillStyle=g.createPattern(AGUAT.big,"repeat");g.fillRect(0,0,W+2*T,H+2*T);g.setTransform(1,0,0,1,0,0);}
// the map is drawn at a whole number of device pixels per map pixel: the largest that fits its area. On a phone held upright, if even one CSS pixel per map pixel does not fit, it scrolls inside the area;
// on its side the largest whole number whose height fits the viewport minus 72 px is used, so no stop is cut off
const APAISADO=()=>matchMedia("(orientation:landscape) and (max-height:500px)").matches;
function escala(){const cv=document.getElementById("mapa"),w=document.getElementById("mapw"),ar=document.getElementById("mapaarea"),dpr=window.devicePixelRatio||1,aw=ar.clientWidth,ah=ar.clientHeight,land=APAISADO();if(!aw||!ah)return;
  let k=Math.min(Math.floor(Math.min(aw,560)*dpr/MW),Math.floor((land?Math.min(ah,innerHeight-72):ah)*dpr/MH));k=land?Math.max(k,1):Math.max(k,Math.ceil(dpr));
  const wd=MW*k,hd=MH*k;w.style.width=wd/dpr+"px";w.style.height=hd/dpr+"px";
  w.style.marginLeft=Math.max(0,Math.floor((aw*dpr-wd)/2))/dpr+"px";w.style.marginTop=Math.max(0,Math.floor((ah*dpr-hd)/2))/dpr+"px";KMAP=k;
  if(ar.scrollHeight>ar.clientHeight+1){if(!CENTRADO){const y=STOP[aqui()][1]*k/dpr;ar.scrollTop=Math.max(0,Math.min(ar.scrollHeight-ah,y-ah/2));}}   // the current stop in view
  CENTRADO=1;dibujaMapa();pintaFondo();}
function mapa(){const cv=document.getElementById("mapa"),g=cv.getContext("2d"),b=new Buf(MW,MH);
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)b.px(x,y,((x>>3)+(y>>3))%2?"#58D854":"#4CC848");
  for(let i=0;i<260;i++){const x=hs(i,4)*MW/100,y=hs(i,8)*MH/100;b.px(x,y,"#2E9A48");b.px(x+1,y-1,"#B8F8A0");}
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){const e=10+3*Math.sin(y*.09);if(x<e||x>MW-1-e)b.px(x,y,agua(x,y));else if(x<e+2||x>MW-3-e||y<2||y>MH-3)b.px(x,y,"#F8D878");}   // the shore runs round the top and the bottom too, where the island meets the surrounding water
  const seg=(x0,y0,x1,y1)=>{const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0),1);for(let i=0;i<=n;i++){const x=Math.round(x0+(x1-x0)*i/n),y=Math.round(y0+(y1-y0)*i/n),h=x1!==x0;for(let d=-5;d<=5;d++)b.px(h?x:x+d,h?y+d:y,Math.abs(d)===5?((i>>1)%2?"#000000":"#F8D878"):"#FCE0A8");}};
  ROAD.forEach(([a,c])=>{const A=STOP[a],C=STOP[c];if(A[0]===C[0]||A[1]===C[1])seg(A[0],A[1],C[0],C[1]);else{seg(A[0],A[1],A[0],C[1]);seg(A[0],C[1],C[0],C[1]);}});
  [[30,62],[30,92],[210,62],[210,92],[92,140],[150,140],[92,192],[150,192],[92,244],[150,244],[30,296],[210,296]].forEach(p=>{for(let k=0;k<2;k++){b.ell(p[0]+k*12-6,p[1],7,7,["#006800","#00A800","#00A800","#58D854"]);b.px(p[0]+k*12-8,p[1]-3,"#B8F8A0");}});
  b.ell(40,20,22,14,["#006800","#00A800","#58D854"]);b.ell(200,22,24,15,["#006800","#00A800","#58D854"]);
  const im=b.done();
  const capa=document.getElementById("ranac");
  dibujaMapa=()=>{const t=Math.floor(performance.now()/300);g.imageSmoothingEnabled=false;g.drawImage(im,0,0);
    STOP.forEach((s,i)=>{const l=CURSO.lugares[i];landmark(g,l.id,s[0]+(s[0]<120?-22:24),s[1]-2,abierto(l));panel(g,s,i,l);});
    const at=STOP[aqui()],d=window.devicePixelRatio||1,K=KMAP,R=Math.round(4*d),E=Math.round(2*d);   // the top layer: the ring just outside the stop's 18 px tile (4 px white, a 2 px dark edge), then the frog above it
    if(capa.width!==MW*K){capa.width=MW*K;capa.height=MH*K;}const f=capa.getContext("2d");f.imageSmoothingEnabled=false;f.clearRect(0,0,capa.width,capa.height);
    const x=(at[0]-9)*K,y=(at[1]-9)*K,n=18*K;f.fillStyle="#16181D";f.fillRect(x-R-E,y-R-E,n+2*(R+E),n+2*(R+E));f.fillStyle="#FFFFFF";f.fillRect(x-R,y-R,n+2*R,n+2*R);f.clearRect(x,y,n,n);
    const fg=spr("cq.7_0",()=>mkCoqui(.7,0,0));f.drawImage(fg,(at[0]-11)*K,(at[1]-24-(t%2))*K,fg.width*K,fg.height*K);};
  dibujaMapa();setInterval(()=>{if(TAB==="mapa")dibujaMapa();},300);addEventListener("resize",()=>{if(TAB==="mapa"){CENTRADO=0;escala();}});
  document.getElementById("mapaarea").addEventListener("scroll",()=>requestAnimationFrame(pintaFondo),{passive:true});
  cv.onclick=e=>{const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*MW/r.width,y=(e.clientY-r.top)*MH/r.height;let best=-1,bd=Math.max(24,24*MW/r.width);   // a touch lands within 24 px of a stop, however small the map is drawn
    STOP.forEach((s,i)=>{const d=Math.hypot(s[0]-x,s[1]-y);if(d<bd){bd=d;best=i;}});if(best>=0){tick();lugar(best);}};}
const aqui=()=>Math.max(0,CURSO.lugares.findIndex(l=>l.cuentos&&!l.cuentos.every(hecho)));
const CHECKPX=["........XX","......XXX.",".....XXX..","X...XXX...","XX.XXX....",".XXXX.....","..XX......"];
function panel(g,s,i,l){const done=l.cuentos&&l.cuentos.every(hecho),op=abierto(l),x=s[0]-8,y=s[1]-8;   // done: a green tile with a white check; open: a quiet outline; closed: grey (the current stop's ring is plain CSS: see aro())

    g.fillStyle="#FFFFFF";CHECKPX.forEach((r,j)=>{for(let q=0;q<r.length;q++)if(r[q]==="X")g.fillRect(x+3+q,y+5+j,1,1);});return;}
  if(op){g.fillStyle="#F7F7F4";g.fillRect(x,y,16,16);digitos(g,String(l.n),s[0]+1,s[1],"#000");return;}
  g.fillStyle="#7C7C7C";g.fillRect(x,y,16,16);g.fillStyle="#BCBCBC";g.fillRect(x,y,16,2);g.fillRect(x,y,2,16);digitos(g,String(l.n),s[0]+1,s[1],"#3A3A3A");}
function landmark(g,id,x,y,op){g.save();g.globalAlpha=op?1:.55;const R=(a,b,w,h,c)=>{g.fillStyle="#000";g.fillRect(a-1,b-1,w+2,h+2);g.fillStyle=c;g.fillRect(a,b,w,h);};
  if(id==="casa"||id==="casa2"){R(x-8,y-6,16,10,"#5CCCC8");g.fillStyle="#000";g.beginPath();g.moveTo(x-11,y-5);g.lineTo(x,y-15);g.lineTo(x+11,y-5);g.fill();g.fillStyle="#D82800";g.beginPath();g.moveTo(x-9,y-6);g.lineTo(x,y-13);g.lineTo(x+9,y-6);g.fill();R(x+2,y-2,3,6,"#92602E");if(id==="casa2"){g.fillStyle="#FCE0A8";g.beginPath();g.arc(x-10,y-16,3,0,7);g.fill();}}
  else if(id==="parque")g.drawImage(spr("tree",mkTree),x-10,y-22,20,26);
  else if(id==="cocina"){R(x-7,y-7,14,11,"#BCBCBC");R(x-5,y-11,10,3,"#7C7C7C");g.fillStyle="#FFF";g.fillRect(x-3,y-15,1,3);g.fillRect(x+2,y-16,1,3);}
  else if(id==="colmado"){R(x-9,y-6,18,10,"#FCE0A8");for(let j=0;j<5;j++){g.fillStyle=j%2?"#FFF":"#D82800";g.fillRect(x-9+j*4,y-10,4,4);}}
  else if(id==="calle"){R(x-1,y-14,2,18,"#7C7C7C");R(x-5,y-17,10,6,"#3C3CBC");}
  else if(id==="plaza"){R(x-2,y-10,4,14,"#BCBCBC");g.fillStyle="#000";g.beginPath();g.arc(x,y-12,6,0,7);g.fill();g.fillStyle="#FFF";g.beginPath();g.arc(x,y-12,5,0,7);g.fill();g.fillStyle="#000";g.fillRect(x,y-15,1,4);g.fillRect(x,y-12,3,1);}
  else if(id==="playa"){g.fillStyle="#000";g.beginPath();g.arc(x,y-6,10,Math.PI,0);g.fill();g.fillStyle="#D82800";g.beginPath();g.arc(x,y-6,9,Math.PI,0);g.fill();R(x,y-6,1,10,"#6E4220");}
  else if(id==="fonda"){g.fillStyle="#000";g.beginPath();g.ellipse(x,y,11,5,0,0,7);g.fill();g.fillStyle="#FFF";g.beginPath();g.ellipse(x,y,10,4,0,0,7);g.fill();R(x-4,y-6,8,5,"#F89838");}
  else if(id==="fuerte"){R(x-11,y-8,22,12,"#BCBCBC");for(let j=0;j<4;j++)R(x-11+j*6,y-12,3,4,"#BCBCBC");R(x-2,y-3,4,7,"#000");R(x+8,y-24,1,12,"#6E4220");R(x+9,y-24,7,4,"#D82800");}
  g.restore();}

/* today's plan: returns first, then new stories (up to three a day, each twice), then replays, sized to his minutes */
function plan(){const due=PAL.vence("ear").filter(w=>!CU||CU.items.some(it=>it.w===w)),out=[],min=AJ().min;let used=0;
  if(due.length)out.push({t:"¿Cuál?",d:due.length+" word"+(due.length>1?"s":"")+" coming back",m:Math.min(6,2+Math.ceil(due.length/3)),href:"cual.html?desde=app"});
  const cs=CURSO.lugares.flatMap(l=>l.cuentos||[]),hoyD=new Date().toDateString(),nuevosHoy=cs.filter(c=>db().cuentos[c]&&new Date(db().cuentos[c].primera).toDateString()===hoyD).length,
    nuevos=cs.filter(c=>veces(c)<2).slice(0,Math.max(0,3-nuevosHoy+cs.filter(c=>veces(c)===1).length));
  for(const c of nuevos){if(used>=min&&out.length)break;const x=CURSO.cuentos[c],m=x.min*(veces(c)?1:2);out.push({t:x.t,d:veces(c)?"Second play":"New story · play it twice",m,c});used+=m;}
  const otros=cs.filter(c=>veces(c)>=2);let k=0;while(used<min&&otros.length&&k<6){const c=otros[k%otros.length];out.push({t:CURSO.cuentos[c].t,d:"Listen again",m:CURSO.cuentos[c].min,c});used+=CURSO.cuentos[c].min;k++;}
  if(!out.length)out.push({t:"¿Cuál?",d:"All your words",m:3,href:"cual.html?desde=app"});return out;}
const empieza=s=>{tick();s.href?location.href=s.href:ir(s.c);};
function hud(){const p=plan(),r=PAL.racha(),l=CURSO.lugares[aqui()];
  document.getElementById("chipRacha").textContent="🔥 "+r+" day"+(r===1?"":"s");document.getElementById("chipLugar").textContent=l.n+" · "+l.nombre;
  document.getElementById("hoy").innerHTML=`<button class="play" id="hoyBtn"><span class="pb">${SVG(IC.play)}</span><span class="grow"><span class="lab">Today${p.length>1?" · 1 of "+p.length:""}</span><b>${p[0].t}</b><span class="sub">${p[0].d} · ${p[0].m} min</span></span></button>`;
  document.getElementById("hoyBtn").onclick=()=>empieza(p[0]);}
function sheet(html,o){o=o||{};const sh=document.getElementById("sheet"),bg=document.getElementById("sheetbg");   // o.modal: a sheet that must be finished (the welcome); o.foot: a footer that stays in view
  sh.classList.toggle("modal",!!o.modal);bg.classList.toggle("modal",!!o.modal);sh.style.transform="";
  sh.innerHTML=(o.modal?"":`<div id="shead"><div class="grab"></div>${o.title?`<h1 class="st">${o.title}</h1>`:""}<button class="x" aria-label="Close" onclick="cierra()">${SVG(IC.x)}</button></div>`)+`<div id="sbody">${html}</div>`+(o.foot?`<div id="sfoot">${o.foot}</div>`:"");
  sh.classList.add("on");bg.style.display="block";if(!o.modal)arrastra();}
function cierra(){paraLeer();const sh=document.getElementById("sheet");sh.classList.remove("on");sh.style.transform="";document.getElementById("sheetbg").style.display="none";}
function fuera(){if(!document.getElementById("sheet").classList.contains("modal"))cierra();}   // a tap on the map above a sheet closes it; the welcome ignores it
function arrastra(){const h=document.getElementById("shead"),sh=document.getElementById("sheet");let y0=null,dy=0;   // the handle: drag down to close
  h.onpointerdown=e=>{if(e.target.closest(".x"))return;y0=e.clientY;dy=0;sh.style.transition="none";try{h.setPointerCapture(e.pointerId);}catch(x){}};
  h.onpointermove=e=>{if(y0===null)return;dy=Math.max(0,e.clientY-y0);sh.style.transform=dy?`translateY(${dy}px)`:"";};
  const fin=()=>{if(y0===null)return;y0=null;sh.style.transition="";if(dy>72)cierra();else sh.style.transform="";};
  h.onpointerup=fin;h.onpointercancel=fin;}

    (l.cuentos?`<div>${l.cuentos.map(c=>{const h=hecho(c);return `<div class="li"><div class="grow"><b>${CURSO.cuentos[c].t}</b><div class="small mut">${h?'<span class="okc">Played</span>':"New"} · about ${CURSO.cuentos[c].min} min</div></div><button class="pb" aria-label="${h?"Play again":"Play"}: ${CURSO.cuentos[c].t}" onclick="ir('${c}')">${SVG(IC.play)}</button></div>`;}).join("")}</div>`

async function biblioteca(){const cs=CURSO.lugares.flatMap(l=>l.cuentos||[]),done=cs.filter(hecho),oi=db().oidos||{};
  const fila=(c,q,que)=>`<div class="li"><div class="grow"><b>${CURSO.cuentos[c].t}</b><div class="small mut">${que} · ${oi[c]?"Heard "+oi[c]+"× · ":""}about ${CURSO.cuentos[c].min} min</div></div><button class="pb" aria-label="Listen: ${CURSO.cuentos[c].t}" onclick="tick();location.href='index.html?cuento=${c}${q}&desde=app'">${SVG(IC.play)}</button></div>`;
  // only what he can play now is listed, per place; everything still closed is counted in the one grey line at the bottom
  let cerrado=0;
  const lugares=CURSO.lugares.filter(l=>l.cuentos&&l.cuentos.length).map(l=>{const fin=AJ().todo||l.cuentos.every(hecho),jug=l.cuentos.filter(c=>veces(c)),dib=fin?l.dibujos||[]:[],haz=fin?l.haz||[]:[];
    cerrado+=l.cuentos.length-jug.length+(fin?0:(l.dibujos||[]).length+(l.haz||[]).length);
    const rows=jug.map(c=>fila(c,"&oir=1","Otra vez")).join("")+dib.map(c=>fila(c,"","Cuento con dibujos")).join("")+haz.map(c=>fila(c,"","Haz esto")).join("");
    return rows?`<h2>${l.nombre}</h2><div class="card" style="padding:0 16px">${rows}</div>`:"";}).join("");
  document.getElementById("t-biblioteca").innerHTML=`<h1>Biblioteca</h1>${lugares||`<div class="card mut">Play a story on the map. You can hear it again here and read it.</div>`}
  ${done.length?`<h2>Read</h2><p class="small mut" style="margin:0 0 16px">Listen first, then read. Reading is not tracked until A2.</p><div class="card" style="padding:0 16px">${done.map(c=>`<button class="li rd" onclick="leer('${c}')"><b class="grow">${CURSO.cuentos[c].t}</b><span class="mut" aria-hidden="true">›</span></button>`).join("")}</div>`:""}
  ${cerrado?`<p class="small mut" style="margin:24px 0 0">${cerrado} more ${cerrado===1?"opens":"open"} as you play the map</p>`:""}`;}
let LEE=null,LEERT=0,LOOP=0;   // LEERT changes every time a reading opens or closes (a late fetch drops itself); LOOP numbers the one running loop
function paraLeer(){LEERT++;LOOP++;if(LEE)LEE.run=0;hush();}   // closing a sheet, switching tab or opening another text: silence, and no loop left running
async function leer(c){paraLeer();const my=LEERT,T=await (await fetch("cuentos/"+c+".json")).json(),seen=new Set(),out=[];if(my!==LEERT)return;
  const add=id=>{id=id.replace(/\$a|\$c|\$p/g,"puerta").replace(/\$b|\$o/g,"ventana").replace(/\$tipo/g,"palma").replace(/\$tam/g,"grande").replace(/\$resp/g,"si").replace(/\$ave/g,"puerta").replace(/\$x/g,"puerta");if(T.clips[id]&&!seen.has(id)){seen.add(id);out.push(id);}};
  const walk=l=>(l||[]).forEach(st=>{if(typeof st==="string")add(st);else if(st.say)add(st.say);else if(st.ask||st.decide||st.elige){(st.lead||[]).forEach(x=>typeof x==="string"&&add(x));if(st.line)add(st.line);walk(st.after);walk(st.then);walk(st.right);(st.options||[]).forEach(o=>walk(st[o]));}else if(st.if)walk(st.then);});
  if(T.leer)T.leer.forEach(add);else{walk(T.beats);walk(T.final);}   // a story may list its own reading order
  // the story's own recordings, so each line can be heard as it is read
  const prev=S;S=T;LINES=T.clips;await loadVoice();S=prev;if(my!==LEERT)return;
  LEE={T,ids:out,i:-1,run:0};
  sheet(`<div class="lab">Read</div><div class="row" style="border:0;margin-bottom:12px"><h1 class="grow" style="margin:0">${T.title}</h1><button class="pb" id="lplay"></button></div>
    <div>${out.map((id,i)=>{const cl=T.clips[id];return `<button class="ln" data-i="${i}">${cl.who==="tu"?'<span class="who">Coquí</span>':''}${cl.text}</button>`;}).join("")}</div>`);
  const lp=document.getElementById("lplay"),R=LEE,etiqueta=()=>{lp.innerHTML=R.run?SVG(IC.stop):SVG(IC.play);lp.setAttribute("aria-label",R.run?"Stop":"Play");};etiqueta();
  const corta=()=>{LOOP++;R.run=0;hush();etiqueta();};   // one loop at a time: every start first ends the one before
  document.querySelectorAll(".ln").forEach(b=>b.onclick=()=>{b.classList.add("tap");setTimeout(()=>b.classList.remove("tap"),150);corta();linea(+b.dataset.i);});
  lp.onclick=async()=>{if(R.run){corta();return;}try{ac().resume();}catch(e){}corta();const k=++LOOP;R.run=1;etiqueta();
    if(R.i>=R.ids.length-1)R.i=-1;   // after the last line, Play starts again from the top
    for(let i=Math.max(0,R.i);i<R.ids.length&&LOOP===k;i++){await linea(i);if(LOOP!==k)return;await sleep(350);if(LOOP!==k)return;}
    if(LOOP===k){R.run=0;R.i=-1;etiqueta();}};}
async function linea(i){try{ac().resume();}catch(e){}LEE.i=i;document.querySelectorAll(".ln").forEach(b=>b.classList.toggle("now",+b.dataset.i===i));   // karaoke: the line lights while it plays
  const el=document.querySelector(`.ln[data-i="${i}"]`);if(el)el.scrollIntoView({block:"nearest",behavior:"smooth"});hush();await playClip(LEE.ids[i]);}

function hablar(){const open=Object.values(db().palabras).filter(r=>r.ear.etapa>=3).map(r=>r.w);
  document.getElementById("t-hablar").innerHTML=`<h1>Hablar</h1>
  <div>${CURSO.lugares.map(l=>`<div class="call" aria-disabled="true"><div class="grow"><b>Call · ${l.nombre}</b><div class="small">${l.en}</div></div><span class="small">Opens later</span></div>`).join("")}</div>
  <h2>Words open for speaking</h2><p class="mut" style="margin:0">${open.length?open.join(", "):"None yet. A word opens once your ear has held it for a few days."}</p>
  <div class="micbar"><button class="mic" disabled aria-label="Calls open later">${SVG(IC.mic)}</button><div class="small mut">Calls open later</div></div>`;}

/* ---------- YO ---------- */
function yo(){const d=db(),r=PAL.racha(),ws=Object.values(d.palabras),l=CURSO.lugares[aqui()];
  const pl=(n,u,p)=>n===1?u:(p||u+"s"),st=(n,t)=>`<div class="card" style="text-align:center;margin:0"><div style="font-size:24px;font-weight:600">${n}</div><div class="small mut">${t}</div></div>`;
  document.getElementById("t-yo").innerHTML=`<h1>Yo</h1><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:16px">${st("🔥 "+r,"day streak")+st(Math.round(d.minutos||0),pl(Math.round(d.minutos||0),"minute")+" listened")+st(ws.length,pl(ws.length,"word")+" heard")+st(ws.filter(x=>x.ear.etapa>=4).length,pl(ws.filter(x=>x.ear.etapa>=4).length,"word")+" good")}</div>
  <div class="card"><div class="lab">Where you are</div><div style="font-size:18px;line-height:24px;font-weight:500;margin-top:4px">A1 · place ${l.n} of 10 · ${l.nombre}</div></div>
  <h2>Minutes a day</h2><div class="seg">${[15,30,60,120].map(m=>`<button class="${AJ().min===m?"on":""}" onclick="AJ().min=${m};PAL.save();tick();yo()">${m}</button>`).join("")}</div><p class="small mut" style="margin:16px 0">Today's plan is sized to this.</p>
  <div class="card row"><div class="grow"><b>Open every place</b><div class="small mut">To look ahead. Places not built yet stay empty.</div></div><button class="sw ${AJ().todo?"on":""}" onclick="AJ().todo=AJ().todo?0:1;PAL.save();tick();yo()"><i></i></button></div>
  <div class="card row"><div class="grow"><b>Level check</b><div class="small mut">For people who already understand some Spanish. About 3 minutes, touch only. ${db().nivel?"Done: "+db().nivel.historias+" "+pl(db().nivel.historias,"story","stories")+" skipped.":"Covers the stories built so far."}</div></div><button class="btn out" onclick="tick();location.href='nivel.html'">Start</button></div>
  <button class="btn out full" onclick="bienvenida(0)">How it works</button>`;}

/* ---------- welcome, first time only: three short steps in English ---------- */
function bienvenida(k){const dots=`<div style="display:flex;gap:8px;justify-content:center;margin:8px 0 16px">${[0,1,2].map(i=>`<i style="width:8px;height:8px;border-radius:4px;background:${i===k?"var(--info)":"#D5D3CC"}"></i>`).join("")}</div>`;
  const p=[[`<h1 style="margin-top:0">Welcome to Coquí</h1><p>You learn Spanish the way children do: by hearing it, with pictures, in short stories.</p><p>You answer by touching the picture. What you touch changes what happens.</p><p>Words come back just before you would forget them.</p><p class="small mut">English is only in the menus, to help you find your way.</p>`,
      `${dots}<button class="btn full" onclick="bienvenida(1)">Next</button>`],
    [`<h1 style="margin-top:0">How much time a day?</h1><p class="mut">Today's plan is sized to it. You can change it in Yo.</p><div class="seg">${[15,30,60,120].map(m=>`<button class="${AJ().min===m?"on":""}" onclick="AJ().min=${m};PAL.save();bienvenida(1)">${m} min</button>`).join("")}</div>`,
      `${dots}<button class="btn full" onclick="bienvenida(2)">Next</button>`],
    [`<h1 style="margin-top:0">Where do you start?</h1><p class="small mut">The level check takes about 3 minutes. You hear a sentence and touch one of four pictures.</p>`,
      `${dots}<button class="btn full" onclick="listo()">I'm new to Spanish</button> <div style="height:16px"></div><button class="btn out full" onclick="AJ().bienvenida=1;PAL.save();location.href='nivel.html'">I understand some Spanish</button>`]];
  // the first time it is a modal sheet: a tap outside does nothing and it comes back after a reload until it is finished. Opened again from Yo it is an ordinary sheet.
  sheet(p[k][0],{modal:!AJ().bienvenida,foot:p[k][1]});}
function listo(){AJ().bienvenida=1;PAL.save();cierra();hud();}

/* ---------- start ---------- */
(async()=>{CU=await cualCarga();S=CU;E=ESCENAS.frente;SW=E.SW;SH=E.SH;sc.width=SW;sc.height=SH;W=EMPTY();voiceReady=loadVoice();
  mapa();tabs();const t=new URLSearchParams(location.search).get("tab");ver(TABS.some(x=>x[0]===t)?t:"mapa");
  if(!AJ().bienvenida)bienvenida(0);
  document.body.classList.add("ready");window.App={plan,ver,lugar,leer,listo,ready:1};})();
setTimeout(()=>document.body.classList.add("ready"),4000);   // if something fails to load, still show the page
