.hudbox{border:3px solid var(--w);border-radius:2px;padding:6px 8px;box-shadow:inset 0 0 0 3px #000,inset 0 0 0 5px #3C3CBC;background:#000;font-size:17px;line-height:1.35}

.card canvas{width:40px;height:40px;image-rendering:pixelated}
.card:active,.go:active{transform:translateY(3px)}
.go{display:flex;align-items:center;gap:10px;width:100%;border:0;background:var(--org);color:#000;font:700 22px Pix,monospace;padding:12px 14px;cursor:pointer;box-shadow:inset 0 0 0 3px #000,0 5px 0 #A84000;border-radius:4px;text-align:left}
.go small{display:block;font-size:15px;font-weight:400}

.box h2{margin:0 0 6px;font-size:24px;color:var(--sun)}.box p{margin:6px 0;font-weight:400}
.opt{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:var(--w);font:700 20px Pix,monospace;padding:9px 4px;cursor:pointer;text-align:left}
.opt:before{content:"▶";color:#333;font-size:16px}.opt:hover:before,.opt:focus:before,.opt.cur:before{color:var(--sun)}
.opt[disabled]{opacity:.4}.opt i{font-style:normal;font-weight:400;font-size:15px;color:#BCBCBC;margin-left:auto}
.x{float:right;background:none;border:0;color:var(--w);font:700 22px Pix;cursor:pointer}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.wc{background:var(--w);color:#000;border:4px solid #000;border-radius:10px;padding:6px 4px 8px;text-align:center;cursor:pointer;font:700 19px Pix}

.line{padding:3px 0;font-weight:400}.line em{font-style:normal;color:var(--sun)}
input{font:700 18px Pix;width:100%;padding:9px;border:3px solid var(--w);background:#000;color:var(--w);border-radius:3px}
#hide{position:fixed;left:-9999px;top:0;width:10px;height:10px;overflow:hidden}

<div id="hide"><div id="wrap"><div id="stage"><canvas id="cv" width="196" height="216"></canvas><button id="go"></button><button id="again"></button><button id="next"></button><div id="bub"></div></div><div id="cap"></div><div id="bar"><button id="snd"></button></div></div></div>

<script>
"use strict";
/* ============================================================
   Coquí · the app, as a game world (Super Mario Bros. 3 style).
   Home is the world map: the road goes from La casa (1) up to El fuerte (10), with three forks.
   Bonus houses on the map are the practice: Escuchar, Hablar, Leer.
   The status bar: today's next step, streak, minutes, words. Cards open Palabras and Yo.
   Menus are in English so a stuck learner can find his way; Spanish is for listening.
   ============================================================ */
const db=()=>PAL.db,AJ=()=>db().ajustes,hecho=id=>!!(db().cuentos[id]&&db().cuentos[id].n),veces=id=>(db().cuentos[id]||{}).n||0;
const abierto=l=>AJ().todo||!!(l.cuentos&&l.cuentos.length);
const ir=c=>location.href="index.html?cuento="+c+"&desde=app";
const MW=240,MH=352,
  STOP=[[120,326],[56,270],[184,270],[120,218],[56,166],[184,166],[56,114],[184,114],[120,66],[120,20]],
  ROAD=[[0,1],[0,2],[1,3],[2,3],[3,4],[3,5],[4,5],[4,6],[5,7],[6,7],[6,8],[7,8],[8,9]],
  CASAS=[{id:"escuchar",x:200,y:326,techo:"#D82800",dibujo:"nota"},{id:"leer",x:40,y:326,techo:"#00A800",dibujo:"libro"},{id:"hablar",x:200,y:218,techo:"#3C3CBC",dibujo:"tel"}];

/* ---------- the world map ---------- */
let dibujaMapa=()=>{};
function mapa(){const cv=document.getElementById("mapa"),g=cv.getContext("2d"),b=new Buf(MW,MH);
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)b.px(x,y,((x>>3)+(y>>3))%2?"#58D854":"#4CC848");   // grass land, a checker of two greens
  for(let i=0;i<260;i++){const x=hs(i,4)*MW/100,y=hs(i,8)*MH/100;b.px(x,y,"#2E9A48");b.px(x+1,y-1,"#B8F8A0");}
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){const e=10+3*Math.sin(y*.09);   // water down both sides, with a sandy edge
    if(x<e||x>MW-1-e)b.px(x,y,(x+y*2)%13===0?"#FFFFFF":((y>>2)+(x>>2))%2?"#3CBCFC":"#5C94FC");else if(x<e+2||x>MW-3-e)b.px(x,y,"#F8D878");}
  const seg=(x0,y0,x1,y1)=>{const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0),1);for(let i=0;i<=n;i++){const x=Math.round(x0+(x1-x0)*i/n),y=Math.round(y0+(y1-y0)*i/n),h=x1!==x0;
      for(let d=-5;d<=5;d++)b.px(h?x:x+d,h?y+d:y,Math.abs(d)===5?((i>>1)%2?"#000000":"#F8D878"):"#FCE0A8");}};   // roads: straight, with corners and dotted edges
  ROAD.forEach(([a,c])=>{const A=STOP[a],C=STOP[c];if(A[0]===C[0]||A[1]===C[1])seg(A[0],A[1],C[0],C[1]);else{seg(A[0],A[1],A[0],C[1]);seg(A[0],C[1],C[0],C[1]);}});
  CASAS.forEach(h=>{const n=STOP.reduce((m,s)=>Math.hypot(s[0]-h.x,s[1]-h.y)<Math.hypot(m[0]-h.x,m[1]-h.y)?s:m,STOP[0]);seg(n[0],h.y,h.x,h.y);});
  [[30,62],[30,92],[210,62],[210,92],[92,140],[150,140],[92,192],[150,192],[92,244],[150,244],[30,296],[210,296]].forEach(p=>{for(let k=0;k<2;k++){b.ell(p[0]+k*12-6,p[1],7,7,["#006800","#00A800","#00A800","#58D854"]);b.px(p[0]+k*12-8,p[1]-3,"#B8F8A0");}});   // rows of round bushes
  b.ell(40,20,22,14,["#006800","#00A800","#58D854"]);b.ell(200,22,24,15,["#006800","#00A800","#58D854"]);
  const im=b.done();
  dibujaMapa=()=>{const t=Math.floor(performance.now()/250);g.imageSmoothingEnabled=false;g.drawImage(im,0,0);
    CASAS.forEach(h=>casita(g,h));
    STOP.forEach((s,i)=>{const l=CURSO.lugares[i];landmark(g,l.id,s[0]+(s[0]<120?-22:24),s[1]-2,abierto(l));panel(g,s,i,l);});
    const here=Math.max(0,CURSO.lugares.findIndex(l=>l.cuentos&&!l.cuentos.every(hecho))),at=STOP[here];
    g.drawImage(spr("cq.7_0",()=>mkCoqui(.7,0,0)),at[0]-11,at[1]-24-(t%2));};
  dibujaMapa();setInterval(dibujaMapa,250);
  cv.onclick=e=>{const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*MW/r.width,y=(e.clientY-r.top)*MH/r.height;
    const h=CASAS.find(h=>Math.abs(h.x-x)<15&&Math.abs(h.y-6-y)<16);if(h)return casa(h.id);
    let best=-1,bd=26;STOP.forEach((s,i)=>{const d=Math.hypot(s[0]-x,s[1]-y);if(d<bd){bd=d;best=i;}});if(best>=0)lugar(best);};}
function panel(g,s,i,l){const done=l.cuentos&&l.cuentos.every(hecho),op=abierto(l),x=s[0]-8,y=s[1]-8;   // the numbered stop
  g.fillStyle="#000";g.fillRect(x-1,y-1,18,18);g.fillStyle=done?"#F8D030":op?"#F89838":"#7C7C7C";g.fillRect(x,y,16,16);g.fillStyle=done?"#FCE0A8":op?"#FCBC74":"#BCBCBC";g.fillRect(x,y,16,2);g.fillRect(x,y,2,16);
  digitos(g,String(l.n),s[0]+1,s[1]);
  if(done){g.fillStyle="#000";g.fillRect(x+12,y-7,1,9);g.fillStyle="#D82800";g.fillRect(x+13,y-7,5,3);}}   // cleared: a flag
// numbers drawn pixel by pixel (3x5, doubled), so they stay sharp on any phone
const DIG={"0":"111101101101111","1":"010110010010111","2":"111001111100111","3":"111001111001111","4":"101101111001001","5":"111100111001111","6":"111100111101111","7":"111001010010010","8":"111101111101111","9":"111101111001111","*":"010111010101000"};
function digitos(g,t,cx,cy){const k=2,w=t.length*4*k-k,x0=Math.round(cx-w/2),y0=Math.round(cy-5*k/2);g.fillStyle="#000";
  [...t].forEach((ch,j)=>{const d=DIG[ch]||DIG["0"];for(let r=0;r<5;r++)for(let q=0;q<3;q++)if(d[r*3+q]==="1")g.fillRect(x0+j*4*k+q*k,y0+r*k,k,k);});}
function casita(g,h){const x=h.x,y=h.y;g.fillStyle="#000";g.fillRect(x-10,y-9,20,14);g.fillStyle="#FCE0A8";g.fillRect(x-9,y-8,18,12);g.fillStyle="#000";g.fillRect(x-2,y-3,5,7);   // a bonus house
  g.beginPath();g.moveTo(x-13,y-8);g.lineTo(x,y-20);g.lineTo(x+13,y-8);g.fill();g.fillStyle=h.techo;g.beginPath();g.moveTo(x-11,y-9);g.lineTo(x,y-18);g.lineTo(x+11,y-9);g.fill();
  g.fillStyle="#FFF";if(h.dibujo==="nota"){g.fillRect(x+1,y-16,1,6);g.fillRect(x-1,y-11,3,2);g.fillRect(x+1,y-16,3,1);}else if(h.dibujo==="libro"){g.fillRect(x-3,y-15,7,4);g.fillStyle="#000";g.fillRect(x,y-15,1,4);}else{g.fillRect(x-3,y-15,7,2);g.fillRect(x-3,y-15,2,4);g.fillRect(x+2,y-15,2,4);}}
function landmark(g,id,x,y,op){g.save();g.globalAlpha=op?1:.55;const R=(a,b,w,h,c)=>{g.fillStyle="#000";g.fillRect(a-1,b-1,w+2,h+2);g.fillStyle=c;g.fillRect(a,b,w,h);};
  if(id==="casa"||id==="casa2"){R(x-8,y-6,16,10,"#5CCCC8");g.fillStyle="#000";g.beginPath();g.moveTo(x-11,y-5);g.lineTo(x,y-15);g.lineTo(x+11,y-5);g.fill();g.fillStyle="#D82800";g.beginPath();g.moveTo(x-9,y-6);g.lineTo(x,y-13);g.lineTo(x+9,y-6);g.fill();R(x+2,y-2,3,6,"#92602E");if(id==="casa2"){g.fillStyle="#FCE0A8";g.beginPath();g.arc(x-10,y-16,3,0,7);g.fill();}}
  else if(id==="parque")g.drawImage(spr("tree",mkTree),x-10,y-22,20,26);
  else if(id==="cocina"){R(x-7,y-7,14,11,"#BCBCBC");R(x-5,y-11,10,3,"#7C7C7C");g.fillStyle="#FFF";g.fillRect(x-3,y-15,1,3);g.fillRect(x+2,y-16,1,3);}
  else if(id==="colmado"){R(x-9,y-6,18,10,"#FCE0A8");for(let j=0;j<5;j++){g.fillStyle=j%2?"#FFF":"#D82800";g.fillRect(x-9+j*4,y-10,4,4);}}
  else if(id==="calle"){R(x-1,y-14,2,18,"#7C7C7C");R(x-5,y-17,10,6,"#3C3CBC");}
  else if(id==="plaza"){R(x-2,y-10,4,14,"#BCBCBC");g.fillStyle="#000";g.beginPath();g.arc(x,y-12,6,0,7);g.fill();g.fillStyle="#FFF";g.beginPath();g.arc(x,y-12,5,0,7);g.fill();g.fillStyle="#000";g.fillRect(x,y-15,1,4);g.fillRect(x,y-12,3,1);}
  else if(id==="playa"){g.fillStyle="#000";g.beginPath();g.arc(x,y-6,10,Math.PI,0);g.fill();g.fillStyle="#D82800";g.beginPath();g.arc(x,y-6,9,Math.PI,0);g.fill();R(x,y-6,1,10,"#6E4220");}
  else if(id==="fonda"){g.fillStyle="#000";g.beginPath();g.ellipse(x,y,11,5,0,0,7);g.fill();g.fillStyle="#FFF";g.beginPath();g.ellipse(x,y,10,4,0,0,7);g.fill();R(x-4,y-6,8,5,"#F89838");}
  else if(id==="fuerte"){R(x-11,y-8,22,12,"#BCBCBC");for(let j=0;j<4;j++)R(x-11+j*6,y-12,3,4,"#BCBCBC");R(x-2,y-3,4,7,"#000");R(x+8,y-24,1,12,"#6E4220");R(x+9,y-24,7,4,"#D82800");}
  g.restore();}

/* ---------- today's plan: returns first, then new stories (up to three a day, each twice), then replays ---------- */
function plan(){const due=PAL.vence("ear"),out=[],min=AJ().min;let used=0;
  if(due.length)out.push({t:"¿Cuál?",d:due.length+" word"+(due.length>1?"s":"")+" coming back",m:Math.min(6,2+Math.ceil(due.length/3)),href:"cual.html?desde=app"});
  const cs=CURSO.lugares.flatMap(l=>l.cuentos||[]),hoyD=new Date().toDateString(),nuevosHoy=cs.filter(c=>db().cuentos[c]&&new Date(db().cuentos[c].primera).toDateString()===hoyD).length,
    nuevos=cs.filter(c=>veces(c)<2).slice(0,Math.max(0,3-nuevosHoy+cs.filter(c=>veces(c)===1).length));
  for(const c of nuevos){if(used>=min&&out.length)break;const x=CURSO.cuentos[c],m=x.min*(veces(c)?1:2);out.push({t:x.t,d:veces(c)?"second play":"new story · play it twice",m,c});used+=m;}
  const otros=cs.filter(c=>veces(c)>=2);let k=0;while(used<min&&otros.length&&k<6){const c=otros[k%otros.length];out.push({t:CURSO.cuentos[c].t,d:"again",m:CURSO.cuentos[c].min,c});used+=CURSO.cuentos[c].min;k++;}
  if(!out.length)out.push({t:"¿Cuál?",d:"all your words",m:3,href:"cual.html?desde=app"});return out;}
function hud(){const p=plan(),r=PAL.racha(),ws=Object.values(db().palabras);
  document.getElementById("hoyT").textContent="HOY: "+p[0].t;document.getElementById("hoyS").textContent=p[0].d+" · "+p[0].m+" min"+(p.length>1?"  (+"+(p.length-1)+" more)":"");
  document.getElementById("hoy").onclick=()=>{const s=p[0];s.href?location.href=s.href:ir(s.c);};
  document.getElementById("stat").innerHTML=`<b>MUNDO A1</b> · LUGAR ${Math.max(1,CURSO.lugares.findIndex(l=>l.cuentos&&!l.cuentos.every(hecho))+1)}<br>STREAK ${r} · ${Math.round(db().minutos||0)} MIN<br>WORDS ${ws.length} · GOOD ${ws.filter(x=>x.ear.etapa>=4).length}`;}

/* ---------- dialog boxes ---------- */
function dlg(html){document.getElementById("box").innerHTML=`<button class="x" onclick="cierra()">✕</button>`+html;document.getElementById("dlg").style.display="flex";}
function cierra(){document.getElementById("dlg").style.display="none";}
document.getElementById("dlg").onclick=e=>{if(e.target.id==="dlg")cierra();};
function lugar(i){const l=CURSO.lugares[i],op=abierto(l);
  dlg(`<h2>${l.n}. ${l.nombre.toUpperCase()}</h2><p>${l.en}${l.fork?" · a fork: either place first":""}</p>`+(l.cuentos?l.cuentos.map(c=>`<button class="opt" onclick="ir('${c}')">${CURSO.cuentos[c].t}<i>${hecho(c)?"✓ played "+veces(c):"new"}</i></button>`).join("")
    :`<p style="color:#BCBCBC">${op?"Not built yet.":"Locked."}</p><p style="font-size:15px;color:#BCBCBC">${l.escenas.join(" · ")}</p>`));}
function casa(id){const cs=CURSO.lugares[0].cuentos;
  if(id==="escuchar")dlg(`<h2>ESCUCHAR</h2><p>Listen again, or check your words.</p><button class="opt" onclick="location.href='cual.html?desde=app'">¿Cuál?<i>a sentence, two pictures</i></button>`+cs.map(c=>`<button class="opt" ${veces(c)?"":"disabled"} onclick="ir('${c}')">${CURSO.cuentos[c].t}<i>${veces(c)?"again":"play it on the map first"}</i></button>`).join("")+`<p style="font-size:15px;color:#BCBCBC">Picture stories and do-this routines come with each finished place.</p>`);
  else if(id==="hablar"){const open=Object.values(db().palabras).filter(r=>r.ear.etapa>=3).map(r=>r.w);dlg(`<h2>HABLAR</h2><p>A live call with Danny. He hears you.</p><p style="font-size:15px;color:#BCBCBC">Calls use ElevenLabs credits (about $6.50 an hour). Words open for speaking: ${open.length?open.join(", "):"none yet"}.</p><button class="opt" onclick="location.href='../'">Call Danny</button>`);}
  else leer();}

/* ---------- full screens: Palabras (word cards), Yo (status), Leer ---------- */
function pantalla(html){const s=document.getElementById("scr");s.innerHTML=`<button class="back" onclick="mundo()">◀ MAP</button>`+html;s.style.display="block";document.getElementById("mapa").style.display="none";document.getElementById("hud").style.display="none";scrollTo(0,0);}
function mundo(){document.getElementById("scr").style.display="none";document.getElementById("mapa").style.display="block";document.getElementById("hud").style.display="grid";hud();}
const ETQ=["new","heard","found","holding","good"];
function palabras(){const byW={};(CU&&CU.items||[]).forEach(it=>byW[it.w]=it);const ws=Object.values(db().palabras).sort((a,b)=>b.ear.etapa-a.ear.etapa||a.w.localeCompare(b.w)),t=Date.now();
  const when=d=>!d?"":d<=t?"back today":"back in "+Math.max(1,Math.round((d-t)/864e5))+"d";
  pantalla(`<h1>PALABRAS</h1>${ws.length?"":`<div class="panel">Play the first story on the map. Your words show up here as cards.</div>`}<div class="grid">${ws.map(r=>`<div class="wc" data-w="${r.w}">${byW[r.w]?`<canvas width="196" height="104"></canvas>`:""}<div>${r.w}</div><div class="pips">${[1,2,3,4].map(k=>`<i class="${r.ear.etapa>=k?"on":""}"></i>`).join("")}</div><div style="font:400 13px Pix">${ETQ[r.ear.etapa]} · ${when(r.ear.due)}</div></div>`).join("")}</div>
  <div class="panel"><b>ADD A WORD OR A GOAL</b><p>For example: "talk to my 1-year-old around the house". Audio for added words comes later.</p><input id="extra" placeholder="word or goal"><div class="tog"><button onclick="extra()">ADD</button></div>${(db().extra||[]).map(x=>`<p>· ${x}</p>`).join("")}</div>`);
  document.querySelectorAll(".wc").forEach(el=>{const it=byW[el.dataset.w],c=el.querySelector("canvas");if(it&&c)miniatura(c,it.si);
    el.onclick=()=>{if(!it)return;try{ac().resume();}catch(e){}if(VOICE&&CLIPS[it.say])playClip(it.say);};});}   // touch a card: hear its sentence
function extra(){const v=document.getElementById("extra").value.trim();if(!v)return;(db().extra=db().extra||[]).push(v);PAL.save();palabras();}
function miniatura(canvas,spec){const keep=W;W=panelW(spec);E.draw(c,W,0);if(W.resp)respDraw(c,0);W=keep;const g=canvas.getContext("2d");g.imageSmoothingEnabled=false;g.drawImage(sc,spec.cam[0],spec.cam[1],spec.cam[2],spec.cam[3],0,0,196,104);}
function yo(){const d=db(),r=PAL.racha(),ws=Object.values(d.palabras);
  pantalla(`<h1>YO</h1><div class="panel" style="display:flex;gap:14px;align-items:center"><canvas id="yoFrog" width="32" height="27" style="width:96px;image-rendering:pixelated"></canvas><div><b>MUNDO A1</b><br>Streak: ${r} day${r===1?"":"s"}<br>Listening: ${Math.round(d.minutos||0)} min<br>Words: ${ws.length} · holding ${ws.filter(x=>x.ear.etapa===3).length} · good ${ws.filter(x=>x.ear.etapa>=4).length}</div></div>
  <div class="panel"><b>MINUTES A DAY</b><p>Today's plan is sized to this.</p><div class="tog">${[15,30,60,120].map(m=>`<button class="${AJ().min===m?"on":""}" onclick="AJ().min=${m};PAL.save();yo()">${m}</button>`).join("")}</div></div>
  <div class="panel"><b>OPEN EVERY PLACE</b><p>For you, to look ahead. Places not built yet stay empty.</p><div class="tog"><button class="${AJ().todo?"on":""}" onclick="AJ().todo=AJ().todo?0:1;PAL.save();yo()">${AJ().todo?"ON":"OFF"}</button></div></div>
  <div class="panel"><b>LEVEL CHECK</b><p>For people who already know some Spanish. Not built yet; it comes after place 1.</p></div>
  <div class="panel"><div class="tog"><button onclick="bienvenida(0)">HOW IT WORKS</button></div></div>`);
  const g=document.getElementById("yoFrog").getContext("2d");g.imageSmoothingEnabled=false;g.drawImage(spr("cq1_00",()=>mkCoqui(1,0,0)),0,0);}
async function leer(){cierra();pantalla(`<h1>LEER</h1><div class="panel">The words of each story you have finished. Listen first, read after. Reading is not tracked until A2.</div><div id="textos"></div>`);
  for(const c of CURSO.lugares[0].cuentos.filter(hecho)){const T=await (await fetch("cuentos/"+c+".json")).json(),seen=new Set(),out=[];
    const add=id=>{id=id.replace(/\$a|\$c|\$p/g,"puerta").replace(/\$b|\$o/g,"ventana").replace(/\$tipo/g,"palma").replace(/\$tam/g,"grande").replace(/\$resp/g,"si").replace(/\$ave/g,"puerta");const cl=T.clips[id];if(cl&&!seen.has(id)){seen.add(id);out.push(cl);}};
    const walk=l=>(l||[]).forEach(st=>{if(typeof st==="string")add(st);else if(st.say)add(st.say);else if(st.ask||st.decide||st.elige){(st.lead||[]).forEach(x=>typeof x==="string"&&add(x));if(st.line)add(st.line);walk(st.then);walk(st.right);(st.options||[]).forEach(o=>walk(st[o]));}else if(st.if)walk(st.then);});
    walk(T.beats);walk(T.final);const d=document.createElement("div");d.className="panel";d.innerHTML=`<b>${T.title.toUpperCase()}</b>`+out.map(cl=>`<div class="line">${cl.who==="tu"?"<em>Coquí:</em> ":""}${cl.text}</div>`).join("");document.getElementById("textos").appendChild(d);}}

/* ---------- welcome, first time only ---------- */
function bienvenida(k){const pages=[`<h2>COQUÍ</h2><p>You learn Spanish the way children do: by hearing it, with pictures, in little stories.</p><p>You answer by touching the picture. The stories are games: what you touch changes what happens.</p><p>Words come back just before you would forget them.</p><p style="color:#BCBCBC;font-size:15px">English is only in the menus, to help you find your way.</p><button class="opt" onclick="bienvenida(1)">NEXT</button>`,
    `<h2>MINUTES A DAY?</h2><p>Today's plan is sized to it.</p>`+[15,30,60,120].map(m=>`<button class="opt ${AJ().min===m?"cur":""}" onclick="AJ().min=${m};PAL.save();bienvenida(2)">${m} minutes</button>`).join(""),
    `<h2>WHERE DO YOU START?</h2><button class="opt" onclick="listo()">I'm new to Spanish</button><button class="opt" onclick="document.getElementById('lc').style.display='block'">I know some Spanish</button><div id="lc" style="display:none"><p style="color:#BCBCBC;font-size:15px">The level check isn't built yet. You start at place 1 for now.</p><button class="opt" onclick="listo()">OK</button></div>`];
  dlg(pages[k]);}
function listo(){AJ().bienvenida=1;PAL.save();cierra();hud();}

/* ---------- start ---------- */
(async()=>{try{await document.fonts.load("700 12px Pix");}catch(e){}
  CU=await (await fetch("cuentos/cual-frente.json")).json();S=CU;E=ESCENAS.frente;SW=E.SW;SH=E.SH;sc.width=SW;sc.height=SH;W=EMPTY();voiceReady=loadVoice();
  mapa();hud();
  const ic=(id,fn)=>{const g=document.getElementById(id).getContext("2d");g.imageSmoothingEnabled=false;fn(g);};
  ic("icPal",g=>{g.fillStyle="#FFF";g.fillRect(3,1,14,18);g.fillStyle="#F8D030";g.fillRect(6,5,8,8);g.fillStyle="#000";g.fillRect(9,7,2,4);});
  ic("icYo",g=>g.drawImage(spr("cq.6_0",()=>mkCoqui(.6,0,0)),0,2));
  document.getElementById("cPal").onclick=palabras;document.getElementById("cYo").onclick=yo;
  const t=new URLSearchParams(location.search).get("tab");if(t==="palabras")palabras();else if(t==="yo")yo();else if(t==="leer")leer();
  if(!AJ().bienvenida)bienvenida(0);
  window.App={plan,palabras,yo,leer,mundo,lugar,casa,listo,ready:1};})();
</script>
