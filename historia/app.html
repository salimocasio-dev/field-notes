:root{--bg:#F6F5F1;--card:#FFFFFF;--ink:#16181D;--mut:#636A75;--line:#E3E1DA;--line2:#C9C6BB;--tint:#EEF1FF;--ok:#17803F;--bad:#D9480F;--info:#3B5BDB;--r:16px;--navh:72px;--rise:14px}   /* --rise: how far the Mapa disc stands above the tab bar */

button{font:inherit;color:inherit}
.tab{display:none;min-height:100%;padding:16px 16px calc(var(--navh) + env(safe-area-inset-bottom) + 68px);max-width:560px;margin:0 auto}   /* the raised Mapa disc never covers content */

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border:1.5px solid transparent;border-radius:12px;background:var(--info);color:#fff;font-weight:600;cursor:pointer}   /* blue: every primary action that does not start learning */
.btn.full{width:100%}.btn.go{background:var(--ok)}   /* green: anything that starts or continues learning */
.btn.out{background:transparent;color:var(--ink);border-color:var(--line2)}   /* the one secondary button */

.li{display:flex;align-items:center;gap:16px;min-height:64px;padding:8px 0}.li.rd{width:100%;border:0;border-radius:0;background:none;text-align:left;cursor:pointer;font-size:16px}.li+.li{border-top:1px solid var(--line)}.okc{color:var(--ok);font-weight:600}

.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.seg button{min-height:48px;padding:0;border-radius:12px;border:1.5px solid var(--line2);background:transparent;font-weight:600;cursor:pointer}.seg button.on{background:var(--info);color:#fff;border-color:var(--info)}
.sw{position:relative;width:52px;height:48px;padding:0;border:0;background:none;cursor:pointer;flex:none}   /* the button is the 48 px touch target; the visible switch (the track and the knob) is 52 x 32 inside it */
.sw::before{content:"";position:absolute;left:0;top:8px;width:52px;height:32px;border-radius:16px;background:#D5D3CC}.sw i{position:absolute;top:12px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}.sw.on::before{background:var(--ok)}.sw.on i{left:24px}
/* the map tab: chips on top, the map in the space between the chips and the Today card, all over the map's own water pattern */
#t-mapa{position:fixed;left:0;right:0;top:0;bottom:calc(var(--navh) + env(safe-area-inset-bottom));min-height:0;max-width:none;margin:0;padding:0;overflow:hidden;background:#5C94FC}

.tb.mid .disc svg{width:28px;height:28px;color:var(--mut)}

/* bottom sheet: sits above the tab bar, at most 70% of the screen high; a welcome (modal) covers the tab bar too */
#sheetbg{position:fixed;left:0;right:0;top:0;bottom:0;background:rgba(0,0,0,.35);z-index:11;display:none}   /* the scrim dims the page and the tab bar; a sheet sits above the tab bar and the raised Mapa disc */

#shead.sc{box-shadow:0 1px 0 var(--line)}

  <div id="topchips"><span class="chip" id="chipRacha"></span><span class="chip" id="chipLugar"></span></div>

  <div class="fade" id="fadeT"></div><div class="fade" id="fadeB"></div>
  <div id="hoy"></div>
</section>

<section class="tab" id="t-biblioteca"></section>
<!-- PALABRAS: review -->
<section class="tab" id="t-palabras"></section>

<div id="sheetbg" onclick="fuera()"></div><div id="sheet"></div>

<script>
"use strict";
const db=()=>PAL.db,AJ=()=>db().ajustes,hecho=id=>!!(db().cuentos[id]&&db().cuentos[id].n),veces=id=>(db().cuentos[id]||{}).n||0;
const abierto=l=>AJ().todo||!!(l.cuentos&&l.cuentos.length);
const ir=c=>location.href="index.html?cuento="+c+"&desde=app";
const tick=()=>{try{navigator.vibrate&&navigator.vibrate(8);}catch(e){}};   // a crisp, short haptic on taps (Android); nothing long or buzzy
const SVG=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const IC={libro:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/>',cartas:'<rect x="7" y="4" width="13" height="16" rx="2"/><path d="M4 7v12a2 2 0 0 0 2 2h10"/>',mapa:'<path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/>',
  mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',yo:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',play:'<path d="M8 5v14l11-7z" fill="currentColor"/>',stop:'<rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',vol:'<path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/><path d="M16 9a4 4 0 0 1 0 6"/>',phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',leer:'<path d="M12 6c-2-1.5-5-2-8-2v14c3 0 6 .5 8 2 2-1.5 5-2 8-2V4c-3 0-6 .5-8 2z"/><path d="M12 6v14"/>',otra:'<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',izq:'<path d="M15 5l-7 7 7 7"/>',der:'<path d="M9 5l7 7-7 7"/>',ok:'<path d="M5 12.5l4.5 4.5L19 7"/>'};
const TABS=[["biblioteca","Biblioteca","libro"],["palabras","Palabras","cartas"],["mapa","Mapa","mapa"],["hablar","Hablar","mic"],["yo","Yo","yo"]];
let TAB="mapa";

  :`<button class="tb ${TAB===t[0]?"on":""}" onclick="ver('${t[0]}')">${SVG(IC[t[2]])}${t[1]}</button>`).join("");}
let POS={};try{POS=JSON.parse(sessionStorage.getItem("coqui.pos")||"{}")||{};}catch(e){}   // each tab keeps its scroll position, also across a story (the page is loaded again then)
const posActual=()=>TAB==="mapa"?document.getElementById("mapaarea").scrollTop:scrollY;
addEventListener("pagehide",()=>{try{POS[TAB]=posActual();sessionStorage.setItem("coqui.pos",JSON.stringify(POS));}catch(e){}});

addEventListener("scroll",fadeTab,{passive:true});addEventListener("resize",fadeTab);

  tabs();const r=({mapa:hud,biblioteca,palabras,hablar,yo})[t]();
  if(t==="mapa"){escala();if(POS.mapa!=null)document.getElementById("mapaarea").scrollTop=POS.mapa;pintaFondo();}else{scrollTo(0,POS[t]||0);if(r&&r.then)r.then(()=>{if(TAB===t)scrollTo(0,POS[t]||0);fadeTab();});}fadeTab();}   // Biblioteca and Palabras fetch their files first: the scroll comes back once they are drawn

/* ---------- MAPA: 16-bit world map, scaled by whole numbers so every pixel stays sharp ---------- */
const MW=240,MH=352,STOP=[[120,326],[56,270],[184,270],[120,218],[56,166],[184,166],[56,114],[184,114],[120,66],[120,20]],
  ROAD=[[0,1],[0,2],[1,3],[2,3],[3,4],[3,5],[4,5],[4,6],[5,7],[6,7],[6,8],[7,8],[8,9]];
const DIG={"0":"111101101101111","1":"010110010010111","2":"111001111100111","3":"111001111001111","4":"101101111001001","5":"111100111001111","6":"111100111101111","7":"111001010010010","8":"111101111101111","9":"111101111001111"};
function digitos(g,t,cx,cy,col){const k=2,w=t.length*4*k-k,x0=Math.round(cx-w/2),y0=Math.round(cy-5*k/2);g.fillStyle=col||"#000";[...t].forEach((ch,j)=>{const d=DIG[ch];for(let r=0;r<5;r++)for(let q=0;q<3;q++)if(d[r*3+q]==="1")g.fillRect(x0+j*4*k+q*k,y0+r*k,k,k);});}
let dibujaMapa=()=>{};
const agua=(x,y)=>(x+y*2)%13===0?"#FFFFFF":((y>>2)+(x>>2))%2?"#3CBCFC":"#5C94FC";   // the map's own water, as drawn at its sides; it repeats every 104 pixels
let KMAP=1,AGUAT=null,CENTRADO=0;
function pintaFondo(){const f=document.getElementById("fondo"),t=document.getElementById("t-mapa"),cv=document.getElementById("mapa"),dpr=window.devicePixelRatio||1,tr=t.getBoundingClientRect(),W=Math.round(tr.width*dpr),H=Math.round(tr.height*dpr);
  if(!W||!H)return;if(f.width!==W)f.width=W;if(f.height!==H)f.height=H;
  const T=104*KMAP,mr=cv.getBoundingClientRect(),ox=Math.round((mr.left-tr.left)*dpr),oy=Math.round((mr.top-tr.top)*dpr),g=f.getContext("2d");
  if(!AGUAT||AGUAT.k!==KMAP){const b=new Buf(104,104);for(let y=0;y<104;y++)for(let x=0;x<104;x++)b.px(x,y,agua(x,y));
    const big=document.createElement("canvas");big.width=big.height=T;const bg=big.getContext("2d");bg.imageSmoothingEnabled=false;bg.drawImage(b.done(),0,0,T,T);AGUAT={k:KMAP,big};}
  g.setTransform(1,0,0,1,((ox%T)+T)%T-T,((oy%T)+T)%T-T);g.fillStyle=g.createPattern(AGUAT.big,"repeat");g.fillRect(0,0,W+2*T,H+2*T);g.setTransform(1,0,0,1,0,0);}
// the map is drawn at a whole number of device pixels per map pixel: the largest that fits its area, never below 1 CSS pixel per map pixel (a stop's tile stays 16 CSS px, its touch area 48). If even that does not fit the height,
// the map scrolls inside its area with the current stop in view, upright or on its side (on its side the fit is against the viewport minus 72 px, and the column on the right gives way so the map's 240 px always fit across)
const APAISADO=()=>matchMedia("(orientation:landscape) and (max-height:500px)").matches;
function escala(){const cv=document.getElementById("mapa"),w=document.getElementById("mapw"),ar=document.getElementById("mapaarea"),dpr=window.devicePixelRatio||1,aw=ar.clientWidth,ah=ar.clientHeight,land=APAISADO();if(!aw||!ah)return;
  let k=Math.min(Math.floor(Math.min(aw,560)*dpr/MW),Math.floor((land?Math.min(ah,innerHeight-72):ah)*dpr/MH));k=Math.max(k,Math.ceil(dpr));
  const wd=MW*k,hd=MH*k;w.style.width=wd/dpr+"px";w.style.height=hd/dpr+"px";
  w.style.marginLeft=Math.max(0,Math.floor((aw*dpr-wd)/2))/dpr+"px";w.style.marginTop=Math.max(0,Math.floor((ah*dpr-hd)/2))/dpr+"px";KMAP=k;
  if(ar.scrollHeight>ar.clientHeight+1){if(!CENTRADO){const y=STOP[aqui()][1]*k/dpr;ar.scrollTop=Math.max(0,Math.min(ar.scrollHeight-ah,y-ah/2));}}   // the current stop in view
  CENTRADO=1;dibujaMapa();pintaFondo();bordes();}
function bordes(){const ar=document.getElementById("mapaarea");   // the fade shows at the top or the bottom edge when there is more map beyond it
  document.getElementById("fadeT").classList.toggle("on",ar.scrollTop>1);document.getElementById("fadeB").classList.toggle("on",ar.scrollTop+ar.clientHeight<ar.scrollHeight-1);}
function mapa(){const cv=document.getElementById("mapa"),g=cv.getContext("2d"),b=new Buf(MW,MH);
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)b.px(x,y,((x>>3)+(y>>3))%2?"#58D854":"#4CC848");
  for(let i=0;i<260;i++){const x=hs(i,4)*MW/100,y=hs(i,8)*MH/100;b.px(x,y,"#2E9A48");b.px(x+1,y-1,"#B8F8A0");}
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){const e=10+3*Math.sin(y*.09);if(x<e||x>MW-1-e)b.px(x,y,agua(x,y));else if(x<e+2||x>MW-3-e||y<2||y>MH-3)b.px(x,y,"#F8D878");}   // the shore runs round the top and the bottom too, where the island meets the surrounding water
  const seg=(x0,y0,x1,y1)=>{const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0),1);for(let i=0;i<=n;i++){const x=Math.round(x0+(x1-x0)*i/n),y=Math.round(y0+(y1-y0)*i/n),h=x1!==x0;for(let d=-5;d<=5;d++)b.px(h?x:x+d,h?y+d:y,Math.abs(d)===5?((i>>1)%2?"#000000":"#F8D878"):"#FCE0A8");}};
  ROAD.forEach(([a,c])=>{const A=STOP[a],C=STOP[c];if(A[0]===C[0]||A[1]===C[1])seg(A[0],A[1],C[0],C[1]);else{seg(A[0],A[1],A[0],C[1]);seg(A[0],C[1],C[0],C[1]);}});
  [[30,62],[30,92],[210,62],[210,92],[92,140],[150,140],[92,192],[150,192],[92,244],[150,244],[30,296],[210,296]].forEach(p=>{for(let k=0;k<2;k++){b.ell(p[0]+k*12-6,p[1],7,7,["#006800","#00A800","#00A800","#58D854"]);b.px(p[0]+k*12-8,p[1]-3,"#B8F8A0");}});
  b.ell(40,20,22,14,["#006800","#00A800","#58D854"]);b.ell(200,22,24,15,["#006800","#00A800","#58D854"]);
  const im=b.done();
  const capa=document.getElementById("ranac");
  dibujaMapa=()=>{const t=Math.floor(performance.now()/300);g.imageSmoothingEnabled=false;g.drawImage(im,0,0);
    STOP.forEach((s,i)=>{const l=CURSO.lugares[i];landmark(g,l.id,s[0]+(s[0]<120?-22:24),s[1]-2,abierto(l));panel(g,s,i,l);});
    const at=STOP[aqui()],d=window.devicePixelRatio||1,K=KMAP,R=Math.round(4*d);   // the top layer, drawn in device pixels so it stays crisp: the current stop's ring just outside its 18 px tile (4 px, blue), the N/M chip under it, then the frog above
    if(capa.width!==MW*K){capa.width=MW*K;capa.height=MH*K;}const f=capa.getContext("2d");f.imageSmoothingEnabled=false;f.clearRect(0,0,capa.width,capa.height);
    const x=(at[0]-9)*K,y=(at[1]-9)*K,n=18*K;f.fillStyle=AZUL;f.fillRect(x-R,y-R,n+2*R,n+2*R);f.clearRect(x,y,n,n);
    const lc=CURSO.lugares[aqui()];if(lc.cuentos){const tx=jugados(lc)+"/"+lc.cuentos.length,h=Math.round(18*d),r=Math.round(6*d);f.font="500 "+12*d+"px system-ui,-apple-system,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif";
      const w=Math.round(f.measureText(tx).width+16*d),cx=Math.round(at[0]*K-w/2),cy=Math.min(y+n+R+Math.round(2*d),capa.height-h);   // a white rounded chip, 12 px medium, 2 px under the ring (kept inside the picture)
      f.fillStyle="#FFFFFF";f.beginPath();f.roundRect(cx,cy,w,h,r);f.fill();f.fillStyle="#16181D";f.textAlign="center";f.textBaseline="middle";f.fillText(tx,cx+w/2,cy+h/2+Math.round(.5*d));}
    const fg=spr("cq.7_0",()=>mkCoqui(.7,0,0));f.drawImage(fg,(at[0]-11)*K,(at[1]-24-(t%2))*K,fg.width*K,fg.height*K);};
  dibujaMapa();setInterval(()=>{if(TAB==="mapa")dibujaMapa();},300);addEventListener("resize",()=>{if(TAB==="mapa"){CENTRADO=0;escala();}});
  document.getElementById("mapaarea").addEventListener("scroll",()=>{requestAnimationFrame(pintaFondo);bordes();},{passive:true});
  cv.onclick=e=>{const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*MW/r.width,y=(e.clientY-r.top)*MH/r.height;let best=-1,bd=Math.max(24,24*MW/r.width);   // a touch lands within 24 map px of a stop (never under 48 CSS px across, as the map is never drawn below 1 CSS px per map px)
    STOP.forEach((s,i)=>{const d=Math.hypot(s[0]-x,s[1]-y);if(d<bd){bd=d;best=i;}});if(best>=0){tick();lugar(best);}};}
const aqui=()=>Math.max(0,CURSO.lugares.findIndex(l=>l.cuentos&&!l.cuentos.every(hecho)));
const VERDE=getComputedStyle(document.documentElement).getPropertyValue("--ok").trim(),AZUL=getComputedStyle(document.documentElement).getPropertyValue("--info").trim();   // the colour tokens, shared with the map
const jugados=l=>(l.cuentos||[]).filter(hecho).length;   // stories of a place he has played (the word records know: db().cuentos)
const CHECKPX=["........XX","......XXX.",".....XXX..","X...XXX...","XX.XXX....",".XXXX.....","..XX......"];
function panel(g,s,i,l){const done=l.cuentos&&l.cuentos.every(hecho),op=abierto(l),x=s[0]-8,y=s[1]-8;   // done: a green tile with a white check; open: an outline and nothing else; closed: grey (the current stop's ring is drawn on the top layer: see dibujaMapa())
  if(op&&!done){g.fillStyle="#16181D";g.fillRect(x-1,y-1,18,2);g.fillRect(x-1,y+15,18,2);g.fillRect(x-1,y-1,2,18);g.fillRect(x+15,y-1,2,18);digitos(g,String(l.n),s[0]+1,s[1],"#16181D");return;}
  g.fillStyle="#000";g.fillRect(x-1,y-1,18,18);
  if(done){g.fillStyle=VERDE;g.fillRect(x,y,16,16);g.fillStyle="#3FAE6B";g.fillRect(x,y,16,2);g.fillRect(x,y,2,16);g.fillStyle="#0C5A2B";g.fillRect(x+2,y+14,14,2);g.fillRect(x+14,y+2,2,14);
    g.fillStyle="#FFFFFF";CHECKPX.forEach((r,j)=>{for(let q=0;q<r.length;q++)if(r[q]==="X")g.fillRect(x+3+q,y+5+j,1,1);});return;}
  g.fillStyle="#7C7C7C";g.fillRect(x,y,16,16);g.fillStyle="#BCBCBC";g.fillRect(x,y,16,2);g.fillRect(x,y,2,16);digitos(g,String(l.n),s[0]+1,s[1],"#3A3A3A");}
function landmark(g,id,x,y,op){g.save();g.globalAlpha=op?1:.55;const R=(a,b,w,h,c)=>{g.fillStyle="#000";g.fillRect(a-1,b-1,w+2,h+2);g.fillStyle=c;g.fillRect(a,b,w,h);};
  if(id==="casa"||id==="casa2"){R(x-8,y-6,16,10,"#5CCCC8");g.fillStyle="#000";g.beginPath();g.moveTo(x-11,y-5);g.lineTo(x,y-15);g.lineTo(x+11,y-5);g.fill();g.fillStyle="#D82800";g.beginPath();g.moveTo(x-9,y-6);g.lineTo(x,y-13);g.lineTo(x+9,y-6);g.fill();R(x+2,y-2,3,6,"#92602E");if(id==="casa2"){g.fillStyle="#FCE0A8";g.beginPath();g.arc(x-10,y-16,3,0,7);g.fill();}}
  else if(id==="parque")g.drawImage(spr("tree",mkTree),x-10,y-22,20,26);
  else if(id==="cocina"){R(x-7,y-7,14,11,"#BCBCBC");R(x-5,y-11,10,3,"#7C7C7C");g.fillStyle="#FFF";g.fillRect(x-3,y-15,1,3);g.fillRect(x+2,y-16,1,3);}
  else if(id==="colmado"){R(x-9,y-6,18,10,"#FCE0A8");for(let j=0;j<5;j++){g.fillStyle=j%2?"#FFF":"#D82800";g.fillRect(x-9+j*4,y-10,4,4);}}
  else if(id==="calle"){R(x-1,y-14,2,18,"#7C7C7C");R(x-5,y-17,10,6,"#3C3CBC");}
  else if(id==="plaza"){R(x-2,y-10,4,14,"#BCBCBC");g.fillStyle="#000";g.beginPath();g.arc(x,y-12,6,0,7);g.fill();g.fillStyle="#FFF";g.beginPath();g.arc(x,y-12,5,0,7);g.fill();g.fillStyle="#000";g.fillRect(x,y-15,1,4);g.fillRect(x,y-12,3,1);}
  else if(id==="playa"){g.fillStyle="#000";g.beginPath();g.arc(x,y-6,10,Math.PI,0);g.fill();g.fillStyle="#D82800";g.beginPath();g.arc(x,y-6,9,Math.PI,0);g.fill();R(x,y-6,1,10,"#6E4220");}
  else if(id==="fonda"){g.fillStyle="#000";g.beginPath();g.ellipse(x,y,11,5,0,0,7);g.fill();g.fillStyle="#FFF";g.beginPath();g.ellipse(x,y,10,4,0,0,7);g.fill();R(x-4,y-6,8,5,"#F89838");}
  else if(id==="fuerte"){R(x-11,y-8,22,12,"#BCBCBC");for(let j=0;j<4;j++)R(x-11+j*6,y-12,3,4,"#BCBCBC");R(x-2,y-3,4,7,"#000");R(x+8,y-24,1,12,"#6E4220");R(x+9,y-24,7,4,"#D82800");}
  g.restore();}

/* today's plan: returns first, then new stories (up to three a day, each twice), then replays, sized to his minutes */
function plan(){const due=PAL.vence("ear").filter(w=>!CU||CU.items.some(it=>it.w===w)),out=[],min=AJ().min;let used=0;
  if(due.length){const nd=Math.min(due.length,10);out.push({t:"¿Cuál?",d:nd+" word"+(nd>1?"s":"")+" coming back",m:Math.min(6,2+Math.ceil(nd/3)),href:"cual.html?desde=app"});}   // a session is at most 10 words; the rest wait, and no backlog count is shown
  const cs=CURSO.lugares.flatMap(l=>l.cuentos||[]),hoyD=new Date().toDateString(),nuevosHoy=cs.filter(c=>db().cuentos[c]&&new Date(db().cuentos[c].primera).toDateString()===hoyD).length,
    nuevos=cs.filter(c=>veces(c)<2).slice(0,Math.max(0,3-nuevosHoy+cs.filter(c=>veces(c)===1).length));
  for(const c of nuevos){if(used>=min&&out.length)break;const x=CURSO.cuentos[c],m=x.min*(veces(c)?1:2);out.push({t:x.t,d:veces(c)?"Second play":"New story · play it twice",m,c});used+=m;}
  const otros=cs.filter(c=>veces(c)>=2);let k=0;while(used<min&&otros.length&&k<6){const c=otros[k%otros.length];out.push({t:CURSO.cuentos[c].t,d:"Listen again",m:CURSO.cuentos[c].min,c});used+=CURSO.cuentos[c].min;k++;}
  if(!out.length)out.push({t:"¿Cuál?",d:"All your words",m:3,href:"cual.html?desde=app"});return out;}
const empieza=s=>{tick();s.href?location.href=s.href:ir(s.c);};
function hud(){const p=plan(),r=PAL.racha(),l=CURSO.lugares[aqui()];
  document.getElementById("chipRacha").textContent="🔥 "+r+" day"+(r===1?"":"s");document.getElementById("chipLugar").textContent=l.n+" · "+l.nombre;
  document.getElementById("hoy").innerHTML=`<button class="play" id="hoyBtn"><span class="pb">${SVG(IC.play)}</span><span class="grow"><span class="lab">Today${p.length>1?" · 1 of "+p.length:""}</span><b>${p[0].t}</b><span class="sub">${p[0].d} · ${p[0].m} min</span></span></button>`;
  document.getElementById("hoyBtn").onclick=()=>empieza(p[0]);}
function sheet(html,o){o=o||{};const sh=document.getElementById("sheet"),bg=document.getElementById("sheetbg");   // o.modal: a sheet that must be finished (the welcome); o.foot: a footer that stays in view
  sh.classList.toggle("modal",!!o.modal);bg.classList.toggle("modal",!!o.modal);sh.style.transform="";
  sh.innerHTML=(o.modal?"":`<div id="shead"${o.title?' class="t"':""}><div class="grab"></div>${o.title?`<h1 class="st">${o.title}</h1>`:""}<button class="x" aria-label="Close" onclick="cierra()">${SVG(IC.x)}</button></div>`)+`<div id="sbody">${html}</div>`+(o.foot?`<div id="sfoot">${o.foot}</div>`:"");
  const hd=document.getElementById("shead"),sb=document.getElementById("sbody");if(hd)sb.onscroll=()=>hd.classList.toggle("sc",sb.scrollTop>0);
  sh.classList.add("on");bg.style.display="block";if(!o.modal)arrastra();}
function cierra(){paraLeer();const sh=document.getElementById("sheet");sh.classList.remove("on");sh.style.transform="";document.getElementById("sheetbg").style.display="none";}
function fuera(){if(!document.getElementById("sheet").classList.contains("modal"))cierra();}   // a tap on the map above a sheet closes it; the welcome ignores it
function arrastra(){const h=document.getElementById("shead"),sh=document.getElementById("sheet");let y0=null,dy=0;   // the handle: drag down to close
  h.onpointerdown=e=>{if(e.target.closest(".x"))return;y0=e.clientY;dy=0;sh.style.transition="none";try{h.setPointerCapture(e.pointerId);}catch(x){}};
  h.onpointermove=e=>{if(y0===null)return;dy=Math.max(0,e.clientY-y0);sh.style.transform=dy?`translateY(${dy}px)`:"";};
  const fin=()=>{if(y0===null)return;y0=null;sh.style.transition="";if(dy>72)cierra();else sh.style.transform="";};
  h.onpointerup=fin;h.onpointercancel=fin;}
function lugar(i){const l=CURSO.lugares[i],op=abierto(l),prox=(l.cuentos||[]).find(c=>!hecho(c));   // the title is in the header bar; a solid green disc only on the first story not yet played, an outline disc on every other row
  sheet(`<p class="small mut plhead" style="margin:0 0 8px">Place ${l.n} · ${l.en}${l.fork?" · a fork: either place first":""}</p>`+
    (l.cuentos?`<div>${l.cuentos.map(c=>{const h=hecho(c);return `<div class="li"><div class="grow"><b>${CURSO.cuentos[c].t}</b><div class="small mut">${h?'<span class="okc">Played</span>':"New"} · about ${CURSO.cuentos[c].min} min</div></div><button class="pb${c===prox?"":" o"}" aria-label="${h?"Play again":"Play"}: ${CURSO.cuentos[c].t}" onclick="ir('${c}')">${SVG(IC.play)}</button></div>`;}).join("")}</div>`
    :`<p class="mut">${op?"Not built yet.":"Locked until the places before it are done."}</p><p class="small mut">Scenes: ${l.escenas.join(" · ")}</p>`),{title:l.nombre});}

/* ---------- the files the shelf, the book and the word sheet read: each fetched once, when first needed ---------- */
const BV="?v=40";   // the books and their pictures are fetched at run time: the tag keeps a phone from showing an old copy
const STO={},STOV={},BOOKS={};   // STO: promises of the story files (STOV: the ones that arrived); BOOKS: promises of libros/<id>.json (null when a story has no book)
const cuentoJ=c=>STO[c]||(STO[c]=fetch("cuentos/"+c+".json").then(r=>r.ok?r.json():null).catch(()=>null).then(T=>{if(T)STOV[c]=T;return T;}));
const libro=c=>BOOKS[c]||(BOOKS[c]=fetch("libros/"+c+".json"+BV).then(r=>r.ok?r.json():null).catch(()=>null));
let READYP=null,HAVE=null;   // audio/ready.json, read once: HAVE is the set of clips that have a recording
const audioListo=()=>READYP||(READYP=fetch("audio/ready.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null).then(j=>{if(j)HAVE=new Set(j.clips||[]);return j;}));
const PEND={},EXTRA=new Set();   // recordings a book or a word sheet loaded (EXTRA) and those still on their way (PEND). The engine's own loader decodes a whole story; a book loads one page at a time
async function cargaClips(ids){const j=await audioListo();if(!j||!HAVE)return;let A;try{A=ac();}catch(e){return;}   // the engine's loading (fetch, decode, trim), for the clips asked for only
  await Promise.all(ids.filter(id=>HAVE.has(id)).map(id=>CLIPS[id]?0:(PEND[id]||(PEND[id]=(async()=>{try{const b=await (await fetch("audio/"+id+".mp3?v="+(j.v||0))).arrayBuffer();CLIPS[id]=trim(await new Promise((ok,no)=>A.decodeAudioData(b,ok,no)));EXTRA.add(id);}catch(e){}delete PEND[id];})()))));
  VOICE=true;}   // a clip without a recording is read in its own time (dur), so the engine's player is always on here
function soltarClips(keep){for(const id of [...EXTRA])if(!keep.has(id)){delete CLIPS[id];EXTRA.delete(id);}}
const pnow=()=>window.__PAL_NOW||Date.now();   // the palabras clock (a fixed one for the machine checks)
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
let PW=null;   // the words that have a picture pair: PW.m maps the word to its ¿Cuál? item; PW.L lists them with their normalised tokens, longest phrase first
function pares(){if(PW)return PW;const m=new Map();CU.items.forEach(it=>m.set(it.w,it));
  const L=[...m.values()].map(it=>({w:it.w,it,t:PAL.norm(it.w).trim().split(" ")})).sort((a,b)=>b.t.length-a.t.length);return PW={m,L};}

/* ---------- BIBLIOTECA: the shelf. One row per story he has played: its cover, the title, Listen and Read ---------- */
let BIBT=0;
async function biblioteca(){const my=++BIBT,oi=db().oidos||{},rd=db().leidos||{};
  // only what he can play now is listed, per place; everything still closed is counted in the one grey line at the bottom
  let cerrado=0;
  const lugares=CURSO.lugares.filter(l=>l.cuentos&&l.cuentos.length).map(l=>{const fin=AJ().todo||l.cuentos.every(hecho),jug=l.cuentos.filter(c=>veces(c)),dib=fin?l.dibujos||[]:[],haz=fin?l.haz||[]:[];
    cerrado+=l.cuentos.length-jug.length+(fin?0:(l.dibujos||[]).length+(l.haz||[]).length);
    return {l,rows:[...jug.map(c=>[c,"&oir=1",""]),...dib.map(c=>[c,"","Cuento con dibujos"]),...haz.map(c=>[c,"","Haz esto",1])]};}).filter(x=>x.rows.length);   // a routine (Haz esto) has no book: Listen only, and no request for a book
  const bk={};await Promise.all(lugares.flatMap(x=>x.rows.map(r=>r[3]?0:libro(r[0]).then(b=>{bk[r[0]]=b;}))));if(my!==BIBT)return;
  const fila=([c,q,kind])=>{const b=bk[c],t=CURSO.cuentos[c],p=b&&b.lee===true&&b.pages&&b.pages[0],leido=!!rd[c];   // Read and the cover only when the book's own verdict says it reads well ("lee": true)
    return `<div class="bk" data-c="${c}"><div class="cov">${p?`<img src="libros/${p.img}${BV}" alt="" onerror="this.remove()">`:""}</div>
      <div class="grow"><b>${t.t}</b><div class="small mut">${kind?kind+" · ":""}${oi[c]?"Heard "+oi[c]+"× · ":""}about ${t.min} min</div>
      <div class="acts"><button class="btn go" aria-label="Listen: ${t.t}" onclick="tick();location.href='index.html?cuento=${c}${q}&desde=app'">${SVG(IC.play)}Listen</button>${p?`<button class="btn out" aria-label="Read${leido?" again":""}: ${t.t}" onclick="tick();leer('${c}')">${SVG(IC.leer)}Read${leido?' <span class="okc" aria-hidden="true">✓</span>':""}</button>`:""}</div></div></div>`;};
  document.getElementById("t-biblioteca").innerHTML=`<h1>Biblioteca</h1>${lugares.map(x=>`<h2>${x.l.nombre}</h2><div class="card" style="padding:0 16px">${x.rows.map(fila).join("")}</div>`).join("")||`<div class="card mut">Play a story on the map. You can hear it again here and read it.</div>`}
  ${cerrado?`<p class="small mut" style="margin:24px 0 0">${cerrado} more ${cerrado===1?"opens":"open"} as you play the map</p>`:""}`;}

/* ---------- LEER: the book of a story. A full-screen frame, one page at a time ---------- */
let LEE=null,LEERT=0,LOOP=0,SWIPED=0,UWT=0;   // LEE: the open book; LEERT changes every time a book opens or closes (a late fetch drops itself); LOOP numbers the one running line sequence
const lbTam=()=>{try{return localStorage.getItem("coqui.leer.tam")==="24"?24:20;}catch(e){return 20;}};
const lbGuarda=v=>{try{localStorage.setItem("coqui.leer.tam",String(v));}catch(e){}};
function paraLeer(){LEERT++;LOOP++;hush();}   // closing a sheet or a book, changing page, switching tab or starting another text: silence, and no sequence left running
const corta=()=>{LOOP++;hush();};
const idsPag=(L,i)=>L.B.pages[i]?L.B.pages[i].clips.filter(id=>L.T.clips[id]):[];
async function leer(c){paraLeer();cierraLibro();const my=LEERT;try{ac().resume();}catch(e){}
  const [B,T]=await Promise.all([libro(c),cuentoJ(c)]);if(my!==LEERT||!B||!B.pages||!B.pages.length||!T)return;
  LINES=Object.assign({},LINES,T.clips);LEE={id:c,B,T,i:0,ids:[]};
  const lb=document.getElementById("libro");lb.classList.add("on");lb.classList.toggle("big",lbTam()===24);document.getElementById("lbaa").setAttribute("aria-pressed",lbTam()===24);document.body.classList.add("lib");
  try{history.pushState({libro:c},"");}catch(e){}   // the system back button closes the book, not the app page
  reservaTxt();pinta();arranca();}
function cierraLibro(){if(!LEE)return;LEERT++;LOOP++;hush();LEE=null;cierraTarjeta();quitaUw();document.getElementById("libro").classList.remove("on");document.body.classList.remove("lib");soltarClips(new Set());
  if(history.state&&history.state.libro){BACKS++;try{history.back();}catch(e){BACKS--;}}
  if(TAB==="biblioteca")biblioteca();}   // the shelf shows the read check
let BACKS=0;addEventListener("popstate",()=>{if(BACKS>0){BACKS--;return;}cierraLibro();});   // the system back button closes the book
function pinta(){const L=LEE,B=L.B,p=B.pages[L.i],n=B.pages.length,img=document.getElementById("lbimg"),bar=document.getElementById("lbbar");
  document.getElementById("lbcnt").textContent=(L.i+1)+" / "+n;bar.firstElementChild.style.width=(L.i+1)/n*100+"%";bar.setAttribute("aria-valuenow",L.i+1);bar.setAttribute("aria-valuemax",n);bar.setAttribute("aria-valuetext","Page "+(L.i+1)+" of "+n);
  img.style.visibility="hidden";delete img.dataset.ok;img.onload=()=>{img.dataset.ok=1;ajustaPic();};img.src="libros/"+p.img+BV;
  if(B.pages[L.i+1]){const nx=new Image();nx.src="libros/"+B.pages[L.i+1].img+BV;}   // the next picture is ready when the page turns
  L.ids=idsPag(L,L.i);const box=document.getElementById("lbtxt");box.textContent="";box.scrollTop=0;L.ids.forEach(id=>box.appendChild(lineaEl(id)));
  pie();ajustaPic();if(L.i===n-1)marcaLeido();}
function marcaLeido(){const d=db();d.leidos=d.leidos||{};if(!d.leidos[LEE.id]){d.leidos[LEE.id]=pnow();PAL.save();}}   // completion only: no word record is written
function pie(){const L=LEE,last=L.i===L.B.pages.length-1,f=document.getElementById("lbfoot");document.getElementById("libro").classList.toggle("fin",last);
  f.innerHTML=(last?'<div class="lbfin" id="lbfin">Fin</div>':"")+`<div class="lbrow"><button class="lbb sec${last?" ar":""}" id="lbback" aria-label="Previous page"${L.i?"":" disabled"}>${SVG(IC.izq)}</button>`+(last?`<button class="lbb tx" id="lbagain">${SVG(IC.otra)}Otra vez</button><button class="lbb" id="lbshelf">Biblioteca</button>`:`<button class="lbb" id="lbnext" aria-label="Next page">${SVG(IC.der)}</button>`)+"</div>";
  document.getElementById("lbback").onclick=()=>{tick();pag(-1);};
  if(last){document.getElementById("lbagain").onclick=()=>{tick();irPag(0);};document.getElementById("lbshelf").onclick=()=>{tick();cierraLibro();};}else document.getElementById("lbnext").onclick=()=>{tick();pag(1);};}
// where the words of a list of phrases (each a list of normalised tokens) stand in a text: [{a,z,k}], the longest phrase first when the list is sorted so; accents, case and punctuation ignored
function occs(text,L){const re=/[\p{L}\p{N}]+/gu,tk=[],out=[];let m;while((m=re.exec(text)))tk.push({s:m.index,e:m.index+m[0].length,n:PAL.norm(m[0]).trim()});
  for(let i=0;i<tk.length;i++)for(let k=0;k<L.length;k++){const t=L[k];if(i+t.length>tk.length||!t.every((x,j)=>tk[i+j].n===x))continue;out.push({a:tk[i].s,z:tk[i+t.length-1].e,k});i+=t.length-1;break;}
  return out;}
// a line is a button (the whole line is the target; a small speaker marks it); a word that has a picture inside it is a span (matched on the normalised word, a multi-word word is a phrase)
function lineaEl(id){const cl=LEE.T.clips[id],b=document.createElement("button"),lt=document.createElement("span"),sp=document.createElement("span");b.className="lbl";b.dataset.id=id;lt.className="lt";sp.className="spk";sp.setAttribute("aria-hidden","true");sp.innerHTML=SVG(IC.vol);
  if(cl.who==="tu"){const w=document.createElement("span");w.className="who";w.textContent="Coquí";lt.appendChild(w);}
  const tx=document.createElement("span"),text=cl.text||"";tx.className="tx";let pos=0;
  occs(text,pares().L.map(p=>p.t)).forEach(o=>{if(o.a>pos)tx.appendChild(document.createTextNode(text.slice(pos,o.a)));const s=document.createElement("span");s.className="bw";s.dataset.k=o.k;s.textContent=text.slice(o.a,o.z);tx.appendChild(s);pos=o.z;});
  if(pos<text.length)tx.appendChild(document.createTextNode(text.slice(pos)));lt.appendChild(tx);b.append(lt,sp);return b;}
function luce(id){document.querySelectorAll("#lbtxt .lbl").forEach(b=>b.classList.toggle("now",b.dataset.id===id));}
async function leeClip(id){await cargaClips([id]);if(CLIPS[id])await playClip(id);else await sleep(dur(id)*1000);}   // a line without a recording is read in its own time, lit all the while
async function secuencia(k){for(const id of LEE.ids){if(LOOP!==k)return;luce(id);await leeClip(id);if(LOOP!==k)return;await sleep(350);}if(LOOP===k)luce(null);}
async function arranca(){const L=LEE,k=++LOOP,i=L.i;hush();   // opening a page: its lines in order, then it waits. Only this page's recordings and the next page's are loaded
  const ids=idsPag(L,i),nx=idsPag(L,i+1);if(ids.length)luce(ids[0]);await cargaClips(ids);   // the first line is lit at once, while its recording loadsif(LOOP!==k||LEE!==L)return;
  cargaClips(nx);soltarClips(new Set([...idsPag(L,i-1),...ids,...nx]));await secuencia(k);}
function pag(d){if(LEE)irPag(LEE.i+d);}
function irPag(n){const L=LEE;if(!L||n<0||n>=L.B.pages.length)return;   // the sound stops with the page
  corta();luce(null);cierraTarjeta();quitaUw();L.i=n;pinta();arranca();}
async function leeUna(id){const L=LEE;corta();const k=++LOOP;luce(id);await leeClip(id);if(LOOP===k&&LEE===L)luce(null);}   // a tap on a line: that line again
function ajustaPic(){const img=document.getElementById("lbimg"),pic=document.getElementById("lbpic");if(!LEE||!img.dataset.ok||!img.naturalWidth)return;
  const dpr=window.devicePixelRatio||1,cs=getComputedStyle(pic),aw=pic.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),ah=pic.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom),nw=img.naturalWidth,nh=img.naturalHeight;let k=Math.floor(Math.min(aw*dpr/nw,ah*dpr/nh));if(k<1)k=Math.max(.2,Math.min(aw*dpr/nw,ah*dpr/nh));   // a whole number of device pixels to every art pixel
  img.style.width=nw*k/dpr+"px";img.style.height=nh*k/dpr+"px";img.style.visibility="visible";}
function reservaTxt(){const L=LEE;if(!L)return;const t=document.getElementById("lbtxt"),lb=document.getElementById("libro");t.style.minHeight="0px";   // the text area is as tall as the book's tallest page (never under three single lines), so the picture does not move from page to page
  const m=t.cloneNode(false);m.removeAttribute("id");m.style.cssText="position:absolute;left:0;top:0;visibility:hidden;pointer-events:none;overflow:visible;max-height:none;width:"+t.clientWidth+"px";lb.appendChild(m);
  const ll=parseFloat(getComputedStyle(lb).getPropertyValue("--ll"))||30;let h=3*Math.max(48,ll+18)+2*4+8;
  for(let i=0;i<L.B.pages.length;i++){m.textContent="";idsPag(L,i).forEach(id=>m.appendChild(lineaEl(id)));h=Math.max(h,m.offsetHeight);}
  m.remove();t.style.minHeight=Math.min(h,lb.clientHeight*.5)+"px";}
function tarjetaPal(k){const e=pares().L[k],cd=document.getElementById("lbcard");   // a word that has a picture: its "sí" picture and the word, over the page
  cd.innerHTML='<div class="cd"><canvas width="196" height="104"></canvas><div class="cw"></div></div>';const cnv=cd.querySelector("canvas");try{miniatura(cnv,e.it.si,e.it.esc);}catch(x){}
  const dpr=window.devicePixelRatio||1,kd=Math.max(1,Math.floor(Math.min(innerWidth-64,360)*dpr/196));cnv.style.width=196*kd/dpr+"px";cnv.style.height=104*kd/dpr+"px";cd.querySelector(".cw").textContent=e.w;cd.classList.add("on");
  quitaUw();document.querySelectorAll('#lbtxt .bw[data-k="'+k+'"]').forEach(s=>s.classList.add("uw"));UWT=setTimeout(quitaUw,2400);}   // every place the word is on the page is underlined for a moment

(function initLibro(){const lb=document.getElementById("libro"),main=document.getElementById("lbmain"),txt=document.getElementById("lbtxt");
  document.getElementById("lbx").onclick=()=>{tick();cierraLibro();};
  document.getElementById("lbaa").onclick=()=>{tick();const big=!lb.classList.contains("big");lb.classList.toggle("big",big);document.getElementById("lbaa").setAttribute("aria-pressed",big);lbGuarda(big?24:20);reservaTxt();ajustaPic();};
  document.getElementById("lbcard").onclick=cierraTarjeta;   // any tap closes the card
  txt.onclick=e=>{if(SWIPED||!LEE)return;const ln=e.target.closest(".lbl");if(!ln)return;tick();const w=e.target.closest(".bw");if(w)tarjetaPal(+w.dataset.k);else leeUna(ln.dataset.id);};
  let sw=null;main.addEventListener("pointerdown",e=>{sw={x:e.clientX,y:e.clientY};});main.addEventListener("pointercancel",()=>{sw=null;});

    if(Math.abs(dx)>=48&&Math.abs(dx)>1.5*Math.abs(dy)){SWIPED=1;setTimeout(()=>{SWIPED=0;},400);pag(dx<0?1:-1);}});   // a swipe turns the page: left for the next
  addEventListener("keydown",e=>{if(!LEE)return;if(e.key==="Escape")cierraLibro();else if(e.key==="ArrowRight")pag(1);else if(e.key==="ArrowLeft")pag(-1);});
  const re=()=>{reservaTxt();ajustaPic();};addEventListener("resize",re);addEventListener("orientationchange",re);})();

/* ---------- PALABRAS: every word he has met, and how it stands ---------- */
let PALT=0;
const meter=(lab,n)=>`<div class="mt"><span class="ml">${lab}</span><span class="dts" role="img" aria-label="${lab}: ${n} of 4">${[1,2,3,4].map(i=>`<i${i<=n?' class="on"':""}></i>`).join("")}</span></div>`;
const mouthOf=r=>r.mouth||{etapa:0,n:0};
async function palabras(){const my=++PALT,P=pares().m,recs=Object.values(db().palabras).filter(r=>r.ear.etapa>0||mouthOf(r).n>0),jug=CURSO.lugares.flatMap(l=>(l.cuentos||[]).filter(veces));
  await Promise.all([...jug.map(cuentoJ),audioListo()]);if(my!==PALT)return;
  // a word belongs to the place of the first story (in story order) that brings it, as a focus word first, else as one that comes back
  const lugarDe=new Map();let k=0;
  for(const pass of ["focus_words","back_again"])for(const l of CURSO.lugares)for(const c of l.cuentos||[]){const T=STOV[c];if(!T||!veces(c))continue;for(const w of T[pass]||[])if(!lugarDe.has(w))lugarDe.set(w,{l,k:k++});}
  const grupos=CURSO.lugares.map(l=>({n:l.nombre,ws:recs.filter(r=>(lugarDe.get(r.w)||{}).l===l).sort((a,b)=>lugarDe.get(a.w).k-lugarDe.get(b.w).k)})).filter(g=>g.ws.length),sin=recs.filter(r=>!lugarDe.has(r.w));
  if(sin.length)grupos.push({n:"More words",ws:sin});
  const due=PAL.vence("ear").filter(w=>P.has(w)),askable=recs.filter(r=>r.ear.etapa>0&&P.has(r.w)),n=Math.min(due.length,10),min=Math.max(1,Math.round(n*10/60));   // ¿Cuál? asks only words he has heard that have a picture pair; a session is up to 10 words
  const rev=n?{t:n+" word"+(n>1?"s":"")+" today · about "+min+" min",b:"Start"}:{t:"Nothing due today",b:"Practice"},off=!n&&!askable.length,ex=db().extra||[];
  const card=r=>{const aria=`${esc(r.w)}: ear ${r.ear.etapa} of 4, mouth ${mouthOf(r).etapa} of 4`,mt=meter("Ear",r.ear.etapa)+meter("Mouth",mouthOf(r).etapa);   // the word is always spelled
    return P.has(r.w)?`<button class="wc" data-w="${esc(r.w)}" aria-label="${aria}"><canvas width="196" height="104"></canvas><div class="t"><div class="w">${esc(r.w)}</div>${mt}</div></button>`
      :`<button class="wc np" data-w="${esc(r.w)}" aria-label="${aria}"><div class="npw">${esc(r.w)}</div><div class="t">${mt}</div></button>`;};
  document.getElementById("t-palabras").innerHTML=`<h1>Palabras</h1>
  <div class="card"><div class="row" style="min-height:0"><div class="grow"><b>Repaso</b><div class="small mut" id="repaso">${rev.t}</div></div><button class="btn go" ${off?"disabled":""} onclick="tick();location.href='cual.html?desde=app'">${rev.b}</button></div></div>
  ${recs.length?grupos.map((g,i)=>`<h2>${g.n}</h2>${i?"":'<p class="small mut keyl">Ear: you know it when you hear it. Mouth: you can say it.</p>'}<div class="grid">${g.ws.map(card).join("")}</div>`).join(""):`<p class="mut">Play the first story on the map. Your words show up here.</p>`}
  <h2>Add a word or a goal</h2><div class="card"><p class="small mut" style="margin-top:0">For example: "talk to my 1-year-old around the house".</p><input id="extra" style="width:100%;min-height:48px;border:1.5px solid var(--line2);border-radius:12px;padding:0 12px;font:inherit;background:#fff" placeholder="A word or a goal" aria-label="A word or a goal"><div style="margin-top:16px"><button class="btn go" onclick="extra()">Add</button></div>
  ${ex.length?`<p class="small mut" style="margin:16px 0 8px">Saved. Material for it comes later.</p>${ex.map(x=>`<p class="small" style="margin:0 0 4px">· ${esc(x)}</p>`).join("")}`:""}</div>`;
  document.querySelectorAll(".wc").forEach(el=>{const it=P.get(el.dataset.w),cv=el.querySelector("canvas");if(it&&cv)miniatura(cv,it.si,it.esc);el.onclick=()=>{tick();palabra(el.dataset.w);};});}
function extra(){const v=document.getElementById("extra").value.trim();if(!v)return;(db().extra=db().extra||[]).push(v);PAL.save();palabras();}
// "Heard in": up to five lines from the stories he has played whose text holds the word (the phrase, on the normalised text); a line from each story first, then the next of each
function oidoEn(w){const nw=PAL.norm(w),seen=new Set(),per=[],out=[];
  CURSO.lugares.flatMap(l=>l.cuentos||[]).filter(c=>veces(c)&&STOV[c]).forEach(c=>{const T=STOV[c],ls=[];[...new Set([...(T.leer||[]),...Object.keys(T.clips)])].forEach(id=>{const cl=T.clips[id];if(cl&&cl.text&&(!HAVE||HAVE.has(id))&&PAL.norm(cl.text).includes(nw))ls.push({id,cl,c});});per.push(ls);});
  for(let r=0;out.length<5;r++){let any=false;for(const ls of per){if(r>=ls.length)continue;any=true;const x=ls[r],key=PAL.norm(x.cl.text);if(seen.has(key))continue;seen.add(key);out.push(x);if(out.length>=5)break;}if(!any)break;}
  return out;}
function vuelve(d){const t=pnow();if(!d)return "";if(d<=t)return "Comes back today";const n=Math.max(1,Math.round((d-t)/864e5));return "Comes back in "+n+" day"+(n>1?"s":"");}
function palabra(w){const r=db().palabras[w];if(!r)return;paraLeer();const it=pares().m.get(w),ls=oidoEn(w),wt=PAL.norm(w).trim().split(" ");
  sheet(`<div id="ws">${it?'<canvas class="wsp" width="196" height="104"></canvas>':""}<h1 class="wsw">${esc(w)}</h1><div class="wsm">${meter("Ear",r.ear.etapa)}${meter("Mouth",mouthOf(r).etapa)}</div><p class="small mut" style="text-align:center;margin:16px 0 0">${vuelve(r.ear.due)}</p>${ls.length?'<h2>Heard in</h2><div class="card" style="padding:0 16px" id="oido"></div>':""}</div>`,{title:esc(w)});
  const hd=document.getElementById("shead"),sb=document.getElementById("sbody"),h1=document.querySelector("#ws .wsw");hd.classList.add("wl");   // scrolled, the word stays in the header
  sb.onscroll=()=>{hd.classList.toggle("sc",sb.scrollTop>0);hd.classList.toggle("wsh",h1.getBoundingClientRect().bottom<sb.getBoundingClientRect().top+8);};
  const cv=document.querySelector("#ws canvas");if(cv){miniatura(cv,it.si,it.esc);const dpr=window.devicePixelRatio||1,kd=Math.max(1,Math.floor(Math.min(innerWidth-32,528)*dpr/196));cv.style.width=196*kd/dpr+"px";cv.style.height=104*kd/dpr+"px";}
  const box=document.getElementById("oido");if(box)ls.forEach(x=>{const li=document.createElement("div"),g=document.createElement("div"),tx=document.createElement("div"),ti=document.createElement("div"),b=document.createElement("button"),text=x.cl.text;li.className="li";g.className="grow";tx.className="ht";ti.className="small mut hs";ti.textContent=(CURSO.cuentos[x.c]||{}).t||"";let pos=0;   // the word is bold inside its line; the story it comes from is under it
    occs(text,[wt]).forEach(o=>{if(o.a>pos)tx.appendChild(document.createTextNode(text.slice(pos,o.a)));const e=document.createElement("b");e.textContent=text.slice(o.a,o.z);tx.appendChild(e);pos=o.z;});if(pos<text.length)tx.appendChild(document.createTextNode(text.slice(pos)));
    g.append(tx,ti);b.className="pb";b.dataset.id=x.id;b.setAttribute("aria-label","Play: "+text);b.innerHTML=SVG(IC.play);b.onclick=()=>{tick();oyeLinea(x.id,x.cl,b);};li.append(g,b);box.appendChild(li);});}
async function oyeLinea(id,cl,btn){const was=btn.classList.contains("pl");paraLeer();document.querySelectorAll("#oido .pb").forEach(b=>{b.classList.remove("pl");b.innerHTML=SVG(IC.play);});if(was)return;   // a second touch stops it
  try{ac().resume();}catch(e){}LINES=Object.assign({},LINES,{[id]:cl});const k=++LOOP;btn.classList.add("pl");btn.innerHTML=SVG(IC.stop);
  await cargaClips([id]);if(LOOP!==k)return;if(CLIPS[id])await playClip(id);else await sleep(dur(id)*1000);if(LOOP===k){btn.classList.remove("pl");btn.innerHTML=SVG(IC.play);}}
function miniatura(canvas,spec,esc){const keep=W,Ex=ESCENAS[esc]||E;W=panelW(spec,Ex);Ex.draw(c,W,0);if(W.resp)respDraw(c,0);W=keep;const g=canvas.getContext("2d");g.imageSmoothingEnabled=false;g.drawImage(sc,spec.cam[0],spec.cam[1],spec.cam[2],spec.cam[3],0,0,196,104);}

/* ---------- HABLAR: one card per place; La casa's opens when all its stories are played ---------- */
function hablar(){const open=Object.values(db().palabras).filter(r=>r.ear.etapa>=3).map(r=>r.w);
  const cards=CURSO.lugares.map(l=>{const on=Llamada.tiene(l.id)&&!!l.cuentos&&l.cuentos.every(hecho);   // stories the level check skipped count as played (they are in db().cuentos)
    if(on)return `<div class="card cc" onclick="tick();Llamada.abre('${l.id}',{alCerrar:hablar})"><div class="grow"><b class="ct">Call Danny</b><div class="small mut">${l.nombre} · about ${Llamada.minutos(l.id)} min</div></div><button class="pb" aria-label="Call Danny: ${l.nombre}">${SVG(IC.phone)}</button></div>`;
    const fin=!!l.cuentos&&l.cuentos.every(hecho);
    return `<div class="card cc lk" aria-disabled="true"><div class="grow"><b class="ct">Call Danny</b><div class="small">${fin?"Coming soon · "+l.nombre:"Opens when you finish "+l.nombre}</div></div></div>`;}).join("");
  document.getElementById("t-hablar").innerHTML=`<h1>Hablar</h1>${cards}
  <h2>Words open for speaking</h2><p class="mut" style="margin:0">${open.length?open.join(", "):"None yet. A word opens once your ear has held it for a few days."}</p>`;
  if(Llamada.tiene("casa")&&CURSO.lugares[0].cuentos.every(hecho))Llamada.precarga();}   // the voice library is ready before the tap

/* ---------- YO ---------- */
let NOTAPAG="";   // the day the "speaking is not available" note was first shown on this page: it stays while the page is open, and comes back once a day
function notaHabla(){if(habDisp())return "";   // habDisp (juego.js): can this phone take a speaking turn right now? It also says no after an error in a story
  const hoy=new Date().toISOString().slice(0,10);
  if(NOTAPAG!==hoy){if(AJ().notaHabla===hoy)return "";AJ().notaHabla=hoy;PAL.save();NOTAPAG=hoy;}
  return `<div class="small mut" style="margin:-8px 0 16px">Speaking in stories isn't available on this phone right now.</div>`;}
function yo(){const d=db(),r=PAL.racha(),ws=Object.values(d.palabras),l=CURSO.lugares[aqui()];
  const pl=(n,u,p)=>n===1?u:(p||u+"s"),st=(n,t)=>`<div class="card" style="text-align:center;margin:0"><div style="font-size:24px;font-weight:600">${n}</div><div class="small mut">${t}</div></div>`;
  document.getElementById("t-yo").innerHTML=`<h1>Yo</h1><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:16px">${st("🔥 "+r,"day streak")+st(Math.round(d.minutos||0),pl(Math.round(d.minutos||0),"minute")+" listened")+st(ws.length,pl(ws.length,"word")+" heard")+st(ws.filter(x=>x.ear.etapa>=4).length,pl(ws.filter(x=>x.ear.etapa>=4).length,"word")+" good")}</div>
  <div class="card"><div class="lab">Where you are</div><div style="font-size:18px;line-height:24px;font-weight:500;margin-top:4px">A1 · place ${l.n} of 10 · ${l.nombre}</div></div>
  <h2>Minutes a day</h2><div class="seg">${[15,30,60,120].map(m=>`<button class="${AJ().min===m?"on":""}" onclick="AJ().min=${m};PAL.save();tick();yo()">${m}</button>`).join("")}</div><p class="small mut" style="margin:16px 0">Today's plan is sized to this.</p>
  <div class="card row"><div class="grow"><b>Open every place</b><div class="small mut">To look ahead. Places not built yet stay empty.</div></div><button class="sw ${AJ().todo?"on":""}" onclick="AJ().todo=AJ().todo?0:1;PAL.save();tick();yo()"><i></i></button></div>
  <div class="card row"><div class="grow"><b>Speak in stories</b><div class="small mut">Some of the coquí's lines become your turn: you say them and the app listens.</div></div><button class="sw ${AJ().habla!==0?"on":""}" aria-label="Speak in stories" onclick="AJ().habla=AJ().habla===0?1:0;PAL.save();tick();yo()"><i></i></button></div>
  ${notaHabla()}
  <div class="card row"><div class="grow"><b>Level check</b><div class="small mut">For people who already understand some Spanish. About 3 minutes, touch only. ${db().nivel?"Done: "+db().nivel.historias+" "+pl(db().nivel.historias,"story","stories")+" skipped.":"Covers the stories built so far."}</div></div><button class="btn out" onclick="tick();location.href='nivel.html'">Start</button></div>
  <button class="btn out full" onclick="bienvenida(0)">How it works</button>`;}

/* ---------- welcome, first time only: three short steps in English ---------- */
const NIVELTXT="The words of the stories you already understand are yours to keep: each gets one cold check tomorrow, and they are open for speaking now.";   // what the level check's result screen used to say (notas/nivel-explicacion.txt)
function bienvenida(k){const dots=`<div style="display:flex;gap:8px;justify-content:center;margin:8px 0 16px">${[0,1,2].map(i=>`<i style="width:8px;height:8px;border-radius:4px;background:${i===k?"var(--info)":"#D5D3CC"}"></i>`).join("")}</div>`;
  const p=[[`<h1 style="margin-top:0">Welcome to Coquí</h1><p>You learn Spanish the way children do: by hearing it, with pictures, in short stories.</p><p>You answer by touching the picture. What you touch changes what happens.</p><p>Words come back just before you would forget them.</p><p class="small mut">English is only in the menus, to help you find your way.</p>${AJ().bienvenida?`<h2>Level check</h2><p style="margin:0">${NIVELTXT}</p>`:""}`,   // opened again from Yo ("How it works"), not the first-time welcome
      `${dots}<button class="btn full" onclick="bienvenida(1)">Next</button>`],
    [`<h1 style="margin-top:0">How much time a day?</h1><p class="mut">Today's plan is sized to it. You can change it in Yo.</p><div class="seg">${[15,30,60,120].map(m=>`<button class="${AJ().min===m?"on":""}" onclick="AJ().min=${m};PAL.save();bienvenida(1)">${m} min</button>`).join("")}</div>`,
      `${dots}<button class="btn full" onclick="bienvenida(2)">Next</button>`],
    [`<h1 style="margin-top:0">Where do you start?</h1><p class="small mut">The level check takes about 3 minutes. You hear a sentence and touch one of four pictures.</p>`,
      `${dots}<button class="btn full" onclick="listo()">I'm new to Spanish</button> <div style="height:16px"></div><button class="btn out full" onclick="AJ().bienvenida=1;PAL.save();location.href='nivel.html'">I understand some Spanish</button>`]];
  // the first time it is a modal sheet: a tap outside does nothing and it comes back after a reload until it is finished. Opened again from Yo it is an ordinary sheet.
  sheet(p[k][0],{modal:!AJ().bienvenida,foot:p[k][1]});}
function listo(){AJ().bienvenida=1;PAL.save();cierra();hud();}

/* ---------- start ---------- */
(async()=>{CU=await cualCarga();S=CU;E=ESCENAS.frente;SW=E.SW;SH=E.SH;sc.width=SW;sc.height=SH;W=EMPTY();voiceReady=loadVoice();
  mapa();tabs();const t=new URLSearchParams(location.search).get("tab");ver(TABS.some(x=>x[0]===t)?t:"mapa");
  if(!AJ().bienvenida)bienvenida(0);
  document.getElementById("lbx").innerHTML=SVG(IC.x);
  document.body.classList.add("ready");window.App={plan,ver,lugar,leer,listo,palabra,cierraLibro,pag,ready:1,get libro(){const L=LEE;return {open:!!L,id:L&&L.id,i:L?L.i:-1,n:L?L.B.pages.length:0,lit:[...document.querySelectorAll("#lbtxt .lbl.now")].map(b=>b.dataset.id),ids:L?L.ids.slice():[],speaking,tam:lbTam()};}};})();
setTimeout(()=>document.body.classList.add("ready"),4000);   // if something fails to load, still show the page
