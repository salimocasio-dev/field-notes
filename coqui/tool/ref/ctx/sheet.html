<!doctype html><html><head><meta charset="utf-8"><title>Canvas sheet: 40 cases</title></head><body>
<!-- The old engine and kit are loaded as they are: the sprites and the drawing helpers (fr, glyph, face, bubble, KIT.tarjeta) are the real ones. -->
<script src="../../../../historia/engine.js"></script>
<script src="../../../../historia/escenas/kit.js"></script>
<script>
'use strict';
/* 40 numbered cases for the software canvas (page 12, section 4, `Ctx`). Each case draws into its own 64 x 64 tile of the browser's
   2D canvas (willReadFrequently, sRGB). Every call the case makes is recorded as it is made, so cases.json lists exactly what the
   browser ran. A case starts on a transparent tile, with imageSmoothingEnabled set first (false unless the case says so).
   Parameters come from real calls in historia/ wherever there is one; `refs` names the line. */
const R = Math.round;

// ---- the source images: real sprites from engine.js ----
const SRCS = {
  coqui:  { call: 'mkCoqui(1,0,0)',  cv: mkCoqui(1, 0, 0) },
  coqui7: { call: 'mkCoqui(.7,0,0)', cv: mkCoqui(.7, 0, 0) },
  coqui6: { call: 'mkCoqui(.6,0,0)', cv: mkCoqui(.6, 0, 0) },
  coqui5: { call: 'mkCoqui(.5,0,0)', cv: mkCoqui(.5, 0, 0) },
  abuela: { call: 'mkAbuela("idle",0)', cv: mkAbuela('idle', 0) },
  tree:   { call: 'mkTree()', cv: mkTree() },
  bush:   { call: 'mkBush()', cv: mkBush() },
  pot:    { call: 'mkPot()',  cv: mkPot() },
  ball:   { call: 'mkBall()', cv: mkBall() },
  cup:    { call: 'mkCup()',  cv: mkCup() },
};
const S = Object.fromEntries(Object.entries(SRCS).map(([k, v]) => [k, v.cv]));
const idOf = new Map(Object.entries(SRCS).map(([k, v]) => [v.cv, k]));

// ---- the recorder: a context that logs every call and property set, then does it ----
const scratch = document.createElement('canvas').getContext('2d');
function resolve(css) {                          // [r, g, b, a8]: the colour the canvas will use; a8 = round(alpha * 255)
  scratch.fillStyle = '#000000'; scratch.fillStyle = css;
  const n = scratch.fillStyle;
  if (n[0] === '#') return [parseInt(n.slice(1, 3), 16), parseInt(n.slice(3, 5), 16), parseInt(n.slice(5, 7), 16), 255];
  const m = /^rgba\((\d+), (\d+), (\d+), ([\d.]+)\)$/.exec(n);
  if (!m) throw new Error('colour ' + css + ' became ' + n);
  return [+m[1], +m[2], +m[3], Math.round(+m[4] * 255)];
}
const ARGS = { save: 0, restore: 0, translate: 2, scale: 2, rotate: 1, fillRect: 4, clearRect: 4, beginPath: 0, rect: 4, arc: 5, ellipse: 7, moveTo: 2, lineTo: 2, fill: 0, stroke: 0, clip: 0 };
const NUMS = new Set(['globalAlpha', 'lineWidth']);
function recorder(ctx, log) {
  return new Proxy(ctx, {
    get(t, k) {
      const v = t[k];
      if (typeof v !== 'function') return v;
      return (...a) => {
        if (k === 'drawImage') {
          const id = idOf.get(a[0]);
          if (!id) throw new Error('drawImage of an image that is not a listed source');
          if (a.length === 3 || a.length === 5) log.push(['drawImage', id, ...a.slice(1)]);
          else if (a.length === 9) log.push(['drawImageRect', id, ...a.slice(1)]);
          else throw new Error('drawImage with ' + a.length + ' arguments');
        } else if (k in ARGS) {
          if (a.length !== ARGS[k]) throw new Error(k + ' with ' + a.length + ' arguments');
          log.push([k, ...a]);
        } else throw new Error('canvas call ' + String(k) + ' is not in Ctx');
        a.forEach(x => { if (typeof x === 'number' && (!Number.isFinite(x) || Object.is(x, -0))) throw new Error('not finite, or -0, in ' + String(k)); });
        return v.apply(t, a);
      };
    },
    set(t, k, v) {
      if (k === 'fillStyle' || k === 'strokeStyle') log.push([k, v, resolve(v)]);
      else if (NUMS.has(k)) { if (!Number.isFinite(v)) throw new Error(k + ' not finite'); log.push([k, v]); }
      else if (k === 'imageSmoothingEnabled') log.push([k, !!v]);
      else throw new Error('canvas property ' + String(k) + ' is not in Ctx');
      t[k] = v;
      return true;
    },
  });
}

const CASES = [];
const add = d => CASES.push(d);
const SKY = '#BFE0F0', CREAM = '#FBF0D2', GRASS = RP.grass[2], INKC = OUT;

/* ---- fillRect, whole numbers ---- */
add({ kind: 'fillRect-whole', title: 'a card: dark frame, then the cream fill (KIT.tarjeta(g,6,6,50,30))', smoothing: false, bg: SKY,
  refs: [['historia/escenas/kit.js', 'function tarjeta(', 'tarjeta'], ['historia/escenas/sala.js', 'tarjeta(g,3,3,78,29)', 'a card in use']],
  run(c) { KIT.tarjeta(c, 6, 6, 50, 30); } });
add({ kind: 'fillRect-whole', title: 'pixel icons: eight glyphs and two faces, every pixel a 1 x 1 fillRect', smoothing: false, bg: '#FFFFFF',
  refs: [['historia/engine.js', 'function glyph(', 'glyph'], ['historia/engine.js', 'function face(', 'face']],
  run(c) { ['heart', 'up', 'go', 'ven', 'plus'].forEach((k, i) => glyph(c, k, 4 + i * 12, 6)); ['hand', 'q', 'eye'].forEach((k, i) => glyph(c, k, 4 + i * 14, 22)); face(c, 14, 46, true); face(c, 34, 46, false); } });
add({ kind: 'fillRect-whole', title: 'an answer bubble with three icons and its tail (bubble(c,["ok","heart","up"],32,46,0))', smoothing: false, bg: SKY,
  refs: [['historia/engine.js', 'function bubble(', 'bubble'], ['historia/juego.js', 'function respDraw', 'where bubbles are drawn']],
  run(c) { bubble(c, ['ok', 'heart', 'up'], 32, 46, 0); } });

/* ---- fillRect, half positions ---- */
add({ kind: 'fillRect-half', title: 'three rectangles: half origin, half size, half both', smoothing: false, bg: CREAM,
  refs: [['historia/escenas/campo.js', 'g.ellipse(b.x+b.w/2,q.y+28,rx+1,ry+1', 'the nearest real fractional fill (an ellipse); fillRect itself is rounded by fr() in the old code']],
  run(c) { c.fillStyle = '#2E6CD0'; c.fillRect(10.5, 8, 20, 12); c.fillStyle = '#D0403A'; c.fillRect(10, 28, 20.5, 12.5); c.fillStyle = '#2E9A48'; c.fillRect(36.5, 14.5, 20.5, 30.5); } });
add({ kind: 'fillRect-half', title: 'quarter positions, and one rectangle half outside the tile', smoothing: false, bg: SKY,
  refs: [],
  run(c) { c.fillStyle = '#7A1C1C'; c.fillRect(4.25, 4.25, 10, 10); c.fillStyle = '#E0A020'; c.fillRect(20.75, 20.75, 12, 12); c.fillStyle = '#2A1810'; c.fillRect(40.5, 6.5, 8.5, 30.5); c.fillStyle = '#4A8CE8'; c.fillRect(-2.5, 50.5, 12, 20); c.fillRect(52.5, -3.25, 14, 10.5); } });

/* ---- drawImage, plain ---- */
add({ kind: 'drawImage-plain', title: 'the frog drawn plain on a transparent tile', smoothing: false, bg: null,
  refs: [['historia/juego.js', 'g.drawImage(spr("cq"+q.s', 'the frog']],
  run(c) { c.drawImage(S.coqui, 16, 18); } });
add({ kind: 'drawImage-plain', title: 'abuela, then the frog in front of her, on grass', smoothing: false, bg: GRASS,
  refs: [['historia/escenas/balcon.js', 'c.drawImage(spr("ab"+pose+habla,()=>mkAbuela(pose,habla)),x,y)', 'abuela drawn plain']],
  run(c) { c.drawImage(S.abuela, 8, 6); c.drawImage(S.coqui, 28, 30); } });
add({ kind: 'drawImage-plain', title: 'a card with the frog and a 16 x 22 crop of abuela (nine-argument drawImage, 1:1)', smoothing: false, bg: SKY,
  refs: [['historia/escenas/sala.js', 'tarjeta(g,3,3,78,29);g.drawImage(spr("cq.7_0"', 'card and frog'], ['historia/escenas/sala.js', 'g.drawImage(im,sx,0,16,22', 'the crop']],
  run(c) { KIT.tarjeta(c, 3, 3, 58, 40); c.drawImage(S.coqui7, 5, 7); c.drawImage(S.abuela, 22, 0, 16, 22, 36, 10, 16, 22); } });

/* ---- drawImage scaled 1.6 ---- */
add({ kind: 'drawImage-scale-1.6', title: 'scale(1.6, 1.6) then drawImage, as the bird is drawn', smoothing: false, bg: SKY,
  refs: [['historia/escenas/kit.js', 'c.scale(dir*AVK,AVK);c.drawImage(im,-Math.round(w/2),0)', 'the bird, AVK = 1.6']],
  run(c) { c.save(); c.translate(32, 6); c.scale(1.6, 1.6); c.drawImage(S.coqui, -16, 0); c.restore(); } });
add({ kind: 'drawImage-scale-1.6', title: 'five-argument drawImage to 1.6 times the size, rounded (22 x 30 to 35 x 48)', smoothing: false, bg: CREAM,
  refs: [['historia/escenas/sala.js', 'g.drawImage(im,Math.round(x-1),Math.round(y-2*k-1),Math.round(13*k),Math.round(11*k))', 'rounded scaled size'], ['historia/escenas/patio.js', 'g.drawImage(im,R(x-7*s),R(y-14*s),R(14*s),R(14*s))', 'rounded scaled size']],
  run(c) { c.drawImage(S.pot, 14, 6, R(22 * 1.6), R(30 * 1.6)); } });
add({ kind: 'drawImage-scale-1.6', title: 'a held thing at 1.6: translate, scale, drawImage from its bottom middle', smoothing: false, bg: GRASS,
  refs: [['historia/escenas/estufa.js', 'function tenida(', 'tenida with a scale (the old code uses 1.5 and 2)']],
  run(c) { c.save(); c.translate(R(32), R(58)); c.scale(1.6, 1.6); c.drawImage(S.cup, -(S.cup.width >> 1), -S.cup.height); c.restore(); } });

/* ---- drawImage scaled 0.86 ---- */
add({ kind: 'drawImage-scale-0.86', title: 'scale(.86, .86) then drawImage', smoothing: false, bg: SKY,
  refs: [['historia/escenas/kit.js', 'c.scale(dir*AVK,AVK)', 'translate, scale, drawImage (the factor .86 is the order\'s)']],
  run(c) { c.save(); c.translate(8, 6); c.scale(.86, .86); c.drawImage(S.abuela, 0, 0); c.restore(); } });
add({ kind: 'drawImage-scale-0.86', title: 'five-argument drawImage to .86 of the size, rounded (32 x 27 to 28 x 23)', smoothing: false, bg: CREAM,
  refs: [['historia/escenas/patio.js', 'g.drawImage(im,R(x-7*s),R(y-14*s),R(14*s),R(14*s))', 'rounded scaled size']],
  run(c) { c.drawImage(S.coqui, 14, 14, R(32 * .86), R(27 * .86)); } });
add({ kind: 'drawImage-scale-0.86', title: 'a tree at .86 from its foot, over a second plain tree', smoothing: false, bg: GRASS,
  refs: [['historia/escenas/estufa.js', 'function tenida(', 'translate, scale, drawImage from the bottom middle']],
  run(c) { c.drawImage(S.tree, 0, 2); c.save(); c.translate(40, 60); c.scale(.86, .86); c.drawImage(S.tree, -24, -62); c.restore(); } });

/* ---- drawImage, other scales ---- */
add({ kind: 'drawImage-scale-stretch', title: 'the frog stretched tall (1, 1.3) and crouched flat (1.15, .65)', smoothing: false, bg: SKY,
  refs: [['historia/escenas/campo.js', 'g.scale(1,1.3)', 'tall'], ['historia/escenas/campo.js', 'g.scale(1.15,.65)', 'flat']],
  run(c) { c.save(); c.translate(12, 36); c.scale(1, 1.3); c.drawImage(S.coqui, 0, -S.coqui.height); c.restore(); c.save(); c.translate(14, 62); c.scale(1.15, .65); c.drawImage(S.coqui, 0, -S.coqui.height); c.restore(); } });

/* ---- drawImage, flipped ---- */
add({ kind: 'drawImage-flip', title: 'abuela facing left: translate, scale(-1, 1), drawImage at -30', smoothing: false, bg: CREAM,
  refs: [['historia/escenas/estufa.js', 'c.scale(-1,1);c.drawImage(spr("ab"+ps+habla', 'the flip']],
  run(c) { c.save(); c.translate(32, 6); c.scale(-1, 1); c.drawImage(S.abuela, -30, 0); c.restore(); } });
add({ kind: 'drawImage-flip', title: 'a bush flipped, over the plain one', smoothing: false, bg: SKY,
  refs: [['historia/escenas/camino.js', 'if(d<0)c.scale(-1,1);c.drawImage(im,-13,0)', 'the flip with an offset']],
  run(c) { c.drawImage(S.bush, 4, 36); c.save(); c.translate(40, 30); c.scale(-1, 1); c.drawImage(S.bush, -17, 0); c.restore(); c.save(); c.translate(36, 6); c.scale(-1, 1); c.drawImage(S.ball, -11, 0); c.restore(); } });
add({ kind: 'drawImage-flip', title: 'flipped and scaled 1.6: scale(-1.6, 1.6)', smoothing: false, bg: GRASS,
  refs: [['historia/escenas/kit.js', 'c.scale(dir*AVK,AVK)', 'dir = -1']],
  run(c) { c.save(); c.translate(32, 8); c.scale(-1.6, 1.6); c.drawImage(S.coqui, -16, 0); c.restore(); } });

/* ---- drawImage, rotated 0.5 rad ---- */
add({ kind: 'drawImage-rotate-0.5', title: 'the bird tipping: translate to the foot, rotate(.5) about the bottom, scale 1.6', smoothing: false, bg: SKY,
  refs: [['historia/escenas/kit.js', 'c.translate(0,H);c.rotate(dir*.5);c.translate(0,-H)', 'the dip']],
  run(c) { const H = R(S.ball.height * 1.6); c.save(); c.translate(26, 56 - H + 2); c.translate(0, H); c.rotate(.5); c.translate(0, -H); c.scale(1.6, 1.6); c.drawImage(S.ball, -11, 0); c.restore(); } });
add({ kind: 'drawImage-rotate-0.5', title: 'the frog pulled off his feet: rotate(-.5) about his middle, drawn from -w/2, -h/2', smoothing: false, bg: CREAM,
  refs: [['historia/escenas/camino.js', 'g.rotate(-.5*(W.arrastra<0?-1:1))', 'the leash']],
  run(c) { c.save(); c.translate(32, 30); c.rotate(-.5); c.drawImage(S.coqui, -32 / 2, -27 / 2); c.restore(); } });
add({ kind: 'drawImage-rotate-0.5', title: 'flipped and rotated: scale(-1, 1), rotate(-.5)', smoothing: false, bg: GRASS,
  refs: [['historia/escenas/lago.js', 'if(d>0)c.scale(-1,1);if(fuera)c.rotate(-.5)', 'flip then rotate']],
  run(c) { c.save(); c.translate(32, 32); c.scale(-1, 1); c.rotate(-.5); c.drawImage(S.ball, -9, -6); c.restore(); } });

/* ---- drawImage with smoothing on ---- */
add({ kind: 'drawImage-smoothing', title: 'the frog mid-hop: y = 24 - 7 sin(pi/5) = 19.886, smoothing on (the scene canvas default)', smoothing: true, bg: SKY,
  refs: [['historia/juego.js', 'q.dy=-7*Math.sin(Math.PI*i/n)', 'the hop'], ['historia/escenas/banco.js', 'g.drawImage(spr("cq"+q.s+"_"+bl+op,()=>mkCoqui(q.s,bl,op)),b.x,b.y+dy)', 'drawn at b.y + dy']],
  run(c) { c.drawImage(S.coqui, 16, 24 + -7 * Math.sin(Math.PI * 1 / 5)); } });
add({ kind: 'drawImage-smoothing', title: 'half-pixel position, both axes, smoothing on', smoothing: true, bg: CREAM,
  refs: [],
  run(c) { c.drawImage(S.abuela, 8.5, 6.5); } });
add({ kind: 'drawImage-smoothing', title: 'smoothing on: abuela down to 20 x 18, the frog up by 1.5 (the blur of "borroso")', smoothing: true, bg: GRASS,
  refs: [['historia/escenas/sala.js', 'g.imageSmoothingEnabled=true;g.drawImage(sc,0,0,SW,SH,0,0,20,18)', 'drawn down with smoothing on'], ['historia/escenas/sala.js', 'x.imageSmoothingEnabled=true;x.drawImage(im,KIT.PX-11,0,22,23,0,0,5,5)', 'drawn down, 22 x 23 to 5 x 5']],
  run(c) { c.drawImage(S.abuela, 0, 0, 48, 51, 2, 2, 20, 18); c.drawImage(S.coqui, 0, 0, 32, 27, 8, 24, 48, 40); } });
add({ kind: 'drawImage-smoothing', title: 'the frog pulled off his feet, rotate(-.5), smoothing on (same call as the rotate case, other setting)', smoothing: true, bg: CREAM,
  refs: [['historia/escenas/camino.js', 'g.rotate(-.5*(W.arrastra<0?-1:1))', 'the leash']],
  run(c) { c.save(); c.translate(32, 30); c.rotate(-.5); c.drawImage(S.coqui, -32 / 2, -27 / 2); c.restore(); } });

/* ---- globalAlpha ---- */
add({ kind: 'globalAlpha-0.5', title: 'the frog at globalAlpha .5 over abuela', smoothing: false, bg: GRASS,
  refs: [['historia/escenas/banco.js', 'g.globalAlpha=q.al;g.drawImage(spr("cq"+q.s', 'q.al is the frog\'s fade']],
  run(c) { c.drawImage(S.abuela, 8, 6); c.globalAlpha = .5; c.drawImage(S.coqui, 24, 26); c.globalAlpha = 1; } });
add({ kind: 'globalAlpha-0.5', title: 'two overlapping rectangles at globalAlpha .5', smoothing: false, bg: CREAM,
  refs: [['historia/escenas/campo.js', 'c.globalAlpha=.3;fr(c,R(o.x)-9', 'a translucent fill (.3)']],
  run(c) { c.globalAlpha = .5; c.fillStyle = '#2E6CD0'; c.fillRect(6, 6, 34, 34); c.fillStyle = '#D0403A'; c.fillRect(24, 24, 34, 34); c.globalAlpha = 1; } });
add({ kind: 'alpha-rgba', title: 'the night over the bench: rgba(30,24,90,.32) over everything, a lamp, a rgba(255,240,160,.16) glow ellipse', smoothing: false, bg: null,
  refs: [['historia/escenas/banco.js', 'c.fillStyle="rgba(30,24,90,.32)"', 'the night']],
  run(c) { c.fillStyle = '#44AA42'; c.fillRect(0, 0, 64, 64); c.drawImage(S.abuela, 8, 10); c.fillStyle = 'rgba(30,24,90,.32)'; c.fillRect(0, 0, 64, 64); fr(c, 41, 6, 11, 11, '#FFF8C8'); c.fillStyle = 'rgba(255,240,160,.16)'; c.beginPath(); c.ellipse(46, 40, 46, 22, 0, 0, 7); c.fill(); } });

/* ---- arc fills ---- */
add({ kind: 'arc-fill', title: 'filled circles of five radii: 2, 4, 6, 9, 12 (arc(x,y,r,0,7))', smoothing: false, bg: '#FFFFFF',
  refs: [['historia/escenas/patio.js', 'g.arc(x+ex,y+16-(a%2),2,0,7)', 'radius 2'], ['historia/escenas/patio.js', 'g.arc(x+ex,y+17,8,0,7)', 'radius 8'], ['historia/app.html', 'g.arc(x,y-12,6,0,7)', 'radius 6'], ['historia/escenas/banco.js', 'c.arc(64,26,9,0,7)', 'radius 9'], ['historia/escenas/patio.js', 'c.arc(z.x,z.y,z.r||12,0,7)', 'radius 12']],
  run(c) { c.fillStyle = '#E0403A'; [[6, 8, 2], [20, 10, 4], [40, 12, 6], [16, 42, 9], [46, 44, 12]].forEach(([x, y, r]) => { c.beginPath(); c.arc(x, y, r, 0, 7); c.fill(); }); } });
add({ kind: 'arc-fill', title: 'the frog\'s eyes wide open: dark ring r+1, white r, pupil r/2, centres fractional', smoothing: false, bg: SKY,
  refs: [['historia/escenas/patio.js', 'g.arc(ex,ey,r+1,0,7)', 'the eyes'], ['historia/escenas/sala.js', 'c.arc(b.x+b.w*u,b.y+dy+7*q.s,5.2*q.s,0,7)', 'the same at s = 1']],
  run(c) { const q = { s: 1, ojx: 1, ojy: 0 }, b = { x: 14, y: 19, w: 32, h: 27 }, dy = 0; c.drawImage(S.coqui, b.x, b.y);
    [.3, .7].forEach(u => { const ex = b.x + b.w * u, ey = b.y + dy + 7 * q.s, r = 4.5 * q.s; c.fillStyle = OUT; c.beginPath(); c.arc(ex, ey, r + 1, 0, 7); c.fill(); c.fillStyle = '#FFFFFF'; c.beginPath(); c.arc(ex, ey, r, 0, 7); c.fill();
      c.fillStyle = '#20140A'; c.beginPath(); c.arc(ex + (q.ojx || 0) * 1.6 * q.s, ey + (q.ojy == null ? -1 : q.ojy) * 1.6 * q.s, r * .5, 0, 7); c.fill(); }); } });
add({ kind: 'arc-fill', title: 'half discs: arc(x, y, r, Math.PI, 0), the beach umbrella of the map icons', smoothing: false, bg: SKY,
  refs: [['historia/app.html', 'g.arc(x,y-6,10,Math.PI,0)', 'the umbrella']],
  run(c) { const x = 32, y = 46; c.fillStyle = '#000'; c.beginPath(); c.arc(x, y - 6, 10, Math.PI, 0); c.fill(); c.fillStyle = '#D82800'; c.beginPath(); c.arc(x, y - 6, 9, Math.PI, 0); c.fill(); R_(c, x, y - 6, 1, 10, '#6E4220'); } });
function R_(g, a, b, w, h, col) { g.fillStyle = '#000'; g.fillRect(a - 1, b - 1, w + 2, h + 2); g.fillStyle = col; g.fillRect(a, b, w, h); }   // the helper "R" inside landmark() in app.html

/* ---- ellipse fills ---- */
add({ kind: 'ellipse-fill', title: 'filled ellipses of five sizes: 3 x 2, 6 x 3, 11 x 5, 15 x 10, 22 x 4 (radii)', smoothing: false, bg: '#FFFFFF',
  refs: [['historia/app.html', 'g.ellipse(x,y,10,4,0,0,7)', '10 x 4 beside 11 x 5'], ['historia/escenas/camino.js', 'c.ellipse(p[0],p[1]-30,19,16,0,0,7)', '19 x 16'], ['historia/escenas/campo.js', 'g.ellipse(b.x+b.w/2,q.y+28,rx+1,ry+1,0,0,7)', 'wide and flat']],
  run(c) { c.fillStyle = '#2E6CD0'; [[6, 5, 3, 2], [20, 6, 6, 3], [44, 8, 11, 5], [20, 32, 15, 10], [40, 56, 22, 4]].forEach(([x, y, rx, ry]) => { c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, 7); c.fill(); }); } });
add({ kind: 'ellipse-fill', title: 'a round white plate: dark rim, white, grey well (three layers)', smoothing: false, bg: GRASS,
  refs: [['historia/escenas/frente.js', 'g.ellipse(x+w/2,y+5,w/2+1,6,0,0,7)', 'the plate']],
  run(c) { const x = 6, y = 24, w = 50, g = c; g.fillStyle = OUT; g.beginPath(); g.ellipse(x + w / 2, y + 5, w / 2 + 1, 6, 0, 0, 7); g.fill(); g.fillStyle = '#FFFFFF'; g.beginPath(); g.ellipse(x + w / 2, y + 5, w / 2, 5, 0, 0, 7); g.fill(); g.fillStyle = RP.grey[3]; g.beginPath(); g.ellipse(x + w / 2, y + 5, w / 2 - 6, 2.6, 0, 0, 7); g.fill(); } });
add({ kind: 'ellipse-fill', title: 'half ellipses from Math.PI to 0: a lid over the pot', smoothing: false, bg: CREAM,
  refs: [['historia/escenas/sala.js', 'g.ellipse(x+13,y+9,15,13,0,Math.PI,0)', 'the lid']],
  run(c) { const g = c, x = 20, y = 30; g.fillStyle = OUT; g.beginPath(); g.ellipse(x + 13, y + 9, 15, 13, 0, Math.PI, 0); g.fill(); g.fillStyle = '#D8D8E4'; g.beginPath(); g.ellipse(x + 13, y + 9, 14, 12, 0, Math.PI, 0); g.fill(); fr(g, x + 6, y + 1, 3, 5, '#F2F2F8'); } });

// ---- run them ----
function runAll() {
  if (CASES.length !== 40) throw new Error('expected 40 cases, have ' + CASES.length);
  const b64 = u => { let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
  const cases = CASES.map((d, i) => {
    const cv = document.createElement('canvas'); cv.width = 64; cv.height = 64;
    const ctx = cv.getContext('2d', { willReadFrequently: true, colorSpace: 'srgb' });
    const ops = [];
    const c = recorder(ctx, ops);
    c.imageSmoothingEnabled = d.smoothing;
    if (d.bg) { c.fillStyle = d.bg; c.fillRect(0, 0, 64, 64); }
    d.run(c);
    return { n: i + 1, kind: d.kind, title: d.title, refs: d.refs, ops, rgba: b64(ctx.getImageData(0, 0, 64, 64).data) };
  });
  const sources = Object.fromEntries(Object.entries(SRCS).map(([k, v]) => {
    const g = v.cv.getContext('2d');
    return [k, { call: v.call, w: v.cv.width, h: v.cv.height, rgba: b64(g.getImageData(0, 0, v.cv.width, v.cv.height).data) }];
  }));
  return { cases, sources, browser: navigator.userAgent, smoothingDefault: scratch.imageSmoothingEnabled, colorSpace: scratch.getContextAttributes().colorSpace };
}
