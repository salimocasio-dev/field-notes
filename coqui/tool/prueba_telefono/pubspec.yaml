name: prueba_telefono
description: "Order 00: a throwaway phone test page (audio, mic, storage, load). Web only."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.10.6
  speech_to_text: ^7.5.0
  web: ^1.1.2

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  fonts:
    - family: PixelifySans
      fonts:
        - asset: assets/fonts/PixelifySans-400.ttf
        - asset: assets/fonts/PixelifySans-700.ttf
          weight: 700
