<!DOCTYPE html>
<html lang="en" translate="no">
<head>
  <!--
    The base path the app is served from. `flutter build web --base-href ...`
    replaces the placeholder below.
    https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- Nothing in a lesson may turn into English by a browser's translation. -->
  <meta name="google" content="notranslate">
  <!-- The old app's viewport (historia/app.html): no pinch zoom, so a two-finger touch cannot jitter the page. -->
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <!-- Noche ground theme-color. -->
  <meta name="theme-color" content="#0C1926">

  <!-- Added to the home screen: opens full screen, with its own name and icon. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Coquí">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>Coquí</title>

  <!-- Noche ground colour (#0C1926) behind everything until the app's first frame: no white flash. -->
  <style>html,body{margin:0;background:#0C1926}</style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
