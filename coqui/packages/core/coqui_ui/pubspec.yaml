name: coqui_ui
description: "Colours, type, shared widgets, the lesson frame, and the widget that shows a pixel picture."
version: 0.0.1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.14.0
  flutter: 3.50.0

dependencies:
  flutter:
    sdk: flutter
  coqui_contracts: any
  material_ui: ^1.11.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  # Roboto is the app's text font on every platform (web, Android, iOS: one look), in the four weights
  # the tokens use: 400, 500, 600 and 700, each its own file, all four cut from one source so that they
  # match each other: the npm package @fontsource/roboto 5.3.0 (the latin subset, converted from .woff2
  # to .ttf with fonttools; it holds Latin-1, the curly quotes, the dashes, the ellipsis, the middle dot
  # and the digits). CSS 600 is drawn with the SemiBold file, never with Bold. Nothing is synthesised.
  # Licence: SIL OFL 1.1, fonts/LICENSE-roboto.txt (the package's own). `Roboto` is the name other
  # packages see as `packages/coqui_ui/Roboto`; the second name is what this package's own entry
  # (tool/dev_main.dart) needs to find the same files with `package: 'coqui_ui'`.
  fonts:
    - family: Roboto
      fonts:
        - asset: fonts/Roboto-Regular.ttf
          weight: 400
        - asset: fonts/Roboto-Medium.ttf
          weight: 500
        - asset: fonts/Roboto-SemiBold.ttf
          weight: 600
        - asset: fonts/Roboto-Bold.ttf
          weight: 700
    - family: packages/coqui_ui/Roboto
      fonts:
        - asset: fonts/Roboto-Regular.ttf
          weight: 400
        - asset: fonts/Roboto-Medium.ttf
          weight: 500
        - asset: fonts/Roboto-SemiBold.ttf
          weight: 600
        - asset: fonts/Roboto-Bold.ttf
          weight: 700
    - family: Pixelify Sans
      fonts:
        - asset: fonts/PixelifySans-Regular.ttf
          weight: 400
        - asset: fonts/PixelifySans-Bold.ttf
          weight: 700
    - family: packages/coqui_ui/Pixelify Sans
      fonts:
        - asset: fonts/PixelifySans-Regular.ttf
          weight: 400
        - asset: fonts/PixelifySans-Bold.ttf
          weight: 700
