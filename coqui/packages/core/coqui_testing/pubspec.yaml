name: coqui_testing
description: "A fake for every interface, and a tiny sample course."
version: 0.0.1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.14.0
  flutter: 3.50.0

dependencies:
  flutter:
    sdk: flutter
  coqui_contracts: any
  coqui_ui: any
  material_ui: ^1.11.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  # The sample course (made by coqui/tool/contracts/make_sample.mjs). Other packages
  # read it as packages/coqui_testing/sample/...
  assets:
    - sample/cuentos/
    - sample/libros/
    - sample/datos/
    - sample/audio/
