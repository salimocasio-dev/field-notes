name: coqui_scenes
description: "One folder per scene (its set, its scene), and the pictures other features ask for."
version: 0.0.1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.14.0
  flutter: 3.50.0

dependencies:
  flutter:
    sdk: flutter
  coqui_contracts: any
  coqui_pixel: any
  coqui_ui: any
  material_ui: ^1.11.1

dev_dependencies:
  coqui_testing: any
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/sheets/
    - assets/old_pictures/banco/
    - assets/old_pictures/mesa/
    - assets/old_pictures/estufa/
    - assets/old_pictures/nevera/
    - assets/old_pictures/comer/
