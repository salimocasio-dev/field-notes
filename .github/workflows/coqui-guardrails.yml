name: Coqui PR Guardrails

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-guards:
    name: Paid Audio, Boundaries & Noche Greps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Run PR guardrails
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: bash .github/scripts/pr_guardrails.sh

  dart-boundaries-and-format:
    name: Boundaries & Format (Changed Dart Files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Match exact Flutter setup step & version pin from .github/workflows/coqui.yml
      - name: Read the pinned Flutter version
        id: pin
        run: echo "flutter=$(tr -d '[:space:]' < coqui/.flutter-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.pin.outputs.flutter }}
          channel: stable
          cache: true

      - name: Run check_boundaries.dart
        if: hashFiles('coqui/tool/check_boundaries.dart') != ''
        working-directory: coqui
        run: dart run tool/check_boundaries.dart

      - name: Check dart format on changed Dart files
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash .github/scripts/check_dart_format.sh
