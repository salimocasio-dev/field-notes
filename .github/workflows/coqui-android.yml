# The Android build of the Flutter app in coqui/: a debug apk, kept as an artifact, then installed
# on an emulator twice in a row (the second time over the first, `adb install -r`) and started once.
# The apk is signed with the key in coqui/app/android/debug.keystore (the standard debug key, not a
# secret), so every build installs over the last. The adb steps are in coqui/tool/check_apk.sh.
# The Flutter version is the one in coqui/.flutter-version.
name: Coquí Android
on:
  push:
    branches: [main, "lane/coqui_platform/**"]   # the platform lane holds the plugins, so its branch is built for Android before it is merged
    paths: ["coqui/**"]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Read the pinned Flutter version
        id: pin
        run: echo "flutter=$(tr -d '[:space:]' < coqui/.flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.pin.outputs.flutter }}
          channel: stable
          cache: true
      - name: flutter pub get
        run: flutter pub get
        working-directory: coqui
      - name: Generate shared scene lists
        run: dart run tool/make_scenes.dart
        working-directory: coqui
      - name: Build the debug apk
        env:
          COQUI_APP_BASE: ${{ vars.COQUI_APP_BASE || 'https://salimocasio-dev.github.io/field-notes/app/' }}
        run: flutter build apk --debug --dart-define=COQUI_APP_BASE="$COQUI_APP_BASE"
        working-directory: coqui/app
      - name: The apk is signed with the key in the repo
        run: bash coqui/tool/check_apk.sh key coqui/app/build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coqui-debug-apk
          path: coqui/app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  emulator:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coqui-debug-apk
          path: apk
      # The rule from the android-emulator-runner README: the emulator needs KVM.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install twice, start once
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash coqui/tool/check_apk.sh emulator apk/app-debug.apk emulator-screenshot.png
      - name: Keep the screenshot of the running app
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coqui-emulator-screenshot
          path: emulator-screenshot.png
          if-no-files-found: ignore
          retention-days: 14
