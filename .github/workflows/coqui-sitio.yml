# Puts the Flutter web app and runtime historia/ files on the live GitHub Pages site.
#
# Uses GitHub Pages artifact deployment (Settings -> Pages -> Source -> GitHub Actions)
# instead of committing compiled builds back to `main`, so `main` stays PR-only with
# zero ruleset bypasses and no `contents: write` permission here.
#
# Starts on pushes to `main` touching publish-trigger paths (coqui/BUILD, index.html,
# prueba/index.html, or runtime historia/**) or manually via workflow_dispatch.
# On any ref other than `main` (and on a pull request) it builds and uploads the
# `coqui-sitio` debug artifact without deploying.
name: Coquí sitio
on:
  push:
    branches: [main]
    paths:
      - "coqui/BUILD"
      - "index.html"
      - "prueba/index.html"
      - "historia/**"
      - "!historia/tools/**"
      - "!historia/notas/**"
  workflow_dispatch:
    inputs:
      force:
        description: "Force rebuild and deploy even if content appears unchanged"
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
  checks: read
  deployments: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  sitio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      should_deploy: ${{ steps.gate.outputs.should_deploy }}
      build: ${{ steps.gate.outputs.build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Decide whether to build and deploy
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FORCE_PUBLISH: ${{ inputs.force }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/sitio_publish_gate.py
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        if: steps.gate.outputs.should_build == 'true'
        with:
          flutter-version: ${{ steps.gate.outputs.flutter }}
          channel: stable
          cache: true
      - name: Build the site
        if: steps.gate.outputs.should_build == 'true'
        env:
          COQUI_BUILD: ${{ steps.gate.outputs.build }}
        run: bash coqui/tool/build_sitio.sh "$RUNNER_TEMP/sitio"
      - name: Keep the build as an artifact
        if: steps.gate.outputs.should_build == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coqui-sitio
          path: ${{ runner.temp }}/sitio
          if-no-files-found: error
          retention-days: 14
      - name: Setup Pages
        if: steps.gate.outputs.should_deploy == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Stage GitHub Pages site
        id: stage
        if: steps.gate.outputs.should_deploy == 'true'
        run: python3 .github/scripts/stage_pages_site.py --app-dir "$RUNNER_TEMP/sitio" --out "$RUNNER_TEMP/pages-site" --clean
      - name: Upload GitHub Pages artifact
        if: steps.gate.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/pages-site
  deploy:
    needs: sitio
    if: needs.sitio.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
