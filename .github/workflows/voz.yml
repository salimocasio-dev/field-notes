# Makes the recorded voice files with Azure Speech and saves them into this project.
# Started by hand from the Actions tab. Needs one repository secret:
#   AZURE_SPEECH_KEY   the key of the Azure Speech resource (coqui-voz-2611, region eastus)
name: Voz
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "muestras = the same six lines in every Spanish voice. cuento = the story in the chosen voices."
        type: choice
        options: [muestras, cuento]
        default: muestras
      narr:
        description: "cuento: voice for the narrator (for example es-MX-JorgeNeural)"
        default: ""
      abuela:
        description: "cuento: voice for grandma"
        default: ""
      tu:
        description: "cuento: voice for the learner's own line (empty = same as narrator)"
        default: ""
      rate:
        description: "speaking rate, for example -12%"
        default: "-12%"
permissions:
  contents: write
concurrency: voz
jobs:
  voz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Make the audio
        run: python historia/tools/voz.py
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: eastus
          MODO: ${{ inputs.modo }}
          V_NARR: ${{ inputs.narr }}
          V_ABUELA: ${{ inputs.abuela }}
          V_TU: ${{ inputs.tu }}
          RATE: ${{ inputs.rate }}
      - name: Save the audio into the project
        env:
          MODO: ${{ inputs.modo }}
        run: |
          git config user.name "coqui-voz"
          git config user.email "coqui-voz@users.noreply.github.com"
          for d in historia/audio historia/muestras; do if [ -e "$d" ]; then git add "$d"; fi; done
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "Audio: $MODO"
          git pull --rebase
          git push
