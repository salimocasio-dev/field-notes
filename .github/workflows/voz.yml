# Makes the recorded voice files with Azure Speech and saves them into a PR branch (never directly to main).
# Starts by itself when a story file changes (story mode, Karina's voice), or by hand from the Actions tab.
# Needs one repository/environment secret:
#   AZURE_SPEECH_KEY   the key of the Azure Speech resource (coqui-voz-2611, region eastus)
# Optional secret:
#   VOZ_PR_TOKEN       fine-grained PAT/token if you want the workflow to auto-open PRs that trigger CI
name: Voz
on:
  push:
    branches: [main]   # never from a lane branch: three AIs push branches, and each recording costs money
    paths: ["historia/cuentos/**"]
  workflow_dispatch:
    inputs:
      modo:
        description: "muestras = the same six lines in every Spanish voice. cuento = the story in the chosen voices."
        type: choice
        options: [muestras, cuento]
        default: muestras
      narr:
        description: "cuento: voice for the narrator (for example es-MX-JorgeNeural)"
        default: ""
      abuela:
        description: "cuento: voice for grandma"
        default: ""
      tu:
        description: "cuento: voice for the coquí, the learner's own character (empty = es-PR-VictorNeural)"
        default: ""
      rate:
        description: "speaking rate, for example -12%"
        default: "-12%"
permissions:
  contents: write
  pull-requests: write
concurrency: voz
jobs:
  voz:
    runs-on: ubuntu-latest
    environment: paid-audio
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: ffmpeg, for the start and end marks (historia/tools/marcas.py)
        run: command -v ffmpeg ffprobe >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
      - name: Make the audio
        run: python historia/tools/voz.py
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: eastus
          MODO: ${{ inputs.modo || 'cuento' }}
          V_NARR: ${{ inputs.narr || 'es-PR-KarinaNeural' }}
          V_ABUELA: ${{ inputs.abuela }}
          V_TU: ${{ inputs.tu || 'es-PR-VictorNeural' }}
          RATE: ${{ inputs.rate || '-12%' }}
      - name: Save the audio into a PR branch
        env:
          MODO: ${{ inputs.modo || 'cuento' }}
          GH_TOKEN: ${{ secrets.VOZ_PR_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python3 .github/scripts/voz_publish_pr.py
