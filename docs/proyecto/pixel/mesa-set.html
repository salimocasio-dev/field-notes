<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#000}canvas{image-rendering:pixelated}</style></head><body>
<canvas id="c"></canvas>
<script>
'use strict';
/* La mesa: abuela's kitchen table (place 3, La cocina, its first scene), as a set on the Pixel Plays engine (order 37a).
   The kitchen is one room seen in three scenes (La mesa, La estufa, La nevera): its floor, walls, tile band, counters, cupboards, window,
   stove, light and scale are cocina-kit.js's (written with this set). It is cut open as La sala's: the two far walls stand, the near ones are
   not built, the floor runs off the picture, the plain dark backdrop above the cut walls.
   The layout stands on the world's axes (the engine's 30 degree camera, shadows to screen right):
     the left wall (x = 0, facing +x): the counter along it (a base cupboard with its white top and the tile band behind it, running off the
       picture's left edge) and the wall cupboard over it (the old picture's left);
     the back wall (y = 0, facing +y): a small window with the patio's bush outside, then the stove (the kit's: hob, two burners, knobs, oven
       door) with a counter beside it running off the picture's right edge, the tile band behind both (the old picture's right);
     the table in the middle of the floor, along x, its long side to the camera: the four chairs along its far side, between it and the back
       wall, where the family sits facing us; the table top deep enough for each place (a plate, a cup, what is spilled in front) and a cloth
       on it when `mantel` is 1.
   Every place keeps its old screen point but those the sheet moves (mesa-sheet.json moves): the four seats step down to the right along the
   table (a row level on the old screen cannot lie on a world axis), and what stands on the counter or the stove lies on its top.
   The state comes from the address; these become the builder's setKey:
     mantel = 0 | 1   W.mantel: the white cloth on the table
     horno  = 0 | 1   W.estufa.horno: the oven lit (its window glows)
     t      = wind time in seconds (nothing sways: kept for the frame call); ox, oy = the origin (defaults: this scene's)
   It draws one frame: the baked set. No characters. */
const Q = new URLSearchParams(location.search);
const pick = (k, allowed, def) => { const v = Q.get(k); return allowed.includes(v) ? v : def; };
const SET = {
  mantel: pick('mantel', ['0', '1'], '0') === '1',
  horno: pick('horno', ['0', '1'], '0') === '1',
  t: +(Q.get('t') || 0),
};
window.PP_SCENE = { w: 240, h: 216, s: 26, originX: +(Q.get('ox') || 4), originY: +(Q.get('oy') || -22), shadowX: .9, shadowY: -.1 };
</script>
<script src="pp-engine.js"></script>
<script src="mapa.js"></script>
<script src="set-kit.js"></script>
<script src="cocina-kit.js"></script>
<script>
'use strict';
cocinaCheckScene();
/* ---------- the plan (world units; the corner of the two standing walls is (0, 0)) ----------
   With origin (4, -22) a point (x, y, z) is on the screen at (124 + 18.385 (x - y), 86 + 9.192 (x + y) - 22.517 z). */
const r3 = v => Math.round(v * 1000) / 1000;
const Gs = (sx, sy, z = 0) => { const u = (sx - OX) / S, v = (sy - OY + z * COS * S) / (S * SIN); return [(u + v) / R2, (v - u) / R2, z]; };
const SCR = (x, y, z = 0) => { const p = project(x, y, z); return [p.sx, p.sy]; };
const XR = 9, YL = 9;                                                 // how far the back wall and the left wall run (past the picture's edges)
// the four seats (old SILLA, people at row 150): each steps down the table by SD rows (moves); a sitter's lap at (x, y - 8) is on the seat (ZS)
const SILLA = [104, 128, 152, 176], SD = [-15, -3, 9, 21];
const ZS = .6, ZT = 1.0;                                              // the chairs' seat and the table's top
const LAPS = SILLA.map((x, k) => Gs(x, 150 + SD[k] - 8, ZS)).map(p => [r3(p[0]), r3(p[1])]);
const LY = LAPS[0][1];                                                // the seats' line (y): every lap on it
// the table: its far edge 14 rows over a sitter's feet row (the old: 20; across a sitter's width the edge rises 5.5 rows to the left, so it
// covers no row of them the old table did not), its near edge 11 rows under it (the
// spilt things in front of each place, old FRENTE + 2, lie on it); its left end .6 past the first seat, its right end .5 past the last (clear of abuela at the stove)
const TBL = { x0: r3(LAPS[0][0] - .6), x1: r3(LAPS[3][0] + .5), y0: r3(Gs(SILLA[0], 150 + SD[0] - 14, ZT)[1]), y1: r3(Gs(SILLA[0], 150 + SD[0] + 11, ZT)[1]), z: ZT, th: .07 };
// a chair: its seat's middle .2 behind the lap (its front edge .02 behind it), .5 wide and .44 deep; the back at its far edge, up to ZB
const CH = { hw: .25, hd: .22, back: .36, ZB: 1.45 };
const CHAIRS = LAPS.map(([x, y]) => ({ x, y: r3(y - .2) }));
// the counter on the left wall: from the corner side A0 (its top's front corner at the old counter's right end, screen x 88) off the picture
const A0 = r3(.9 + (OX - 88) / (S / R2)), A1 = YL;
const UP = [3.3, 5.4];                                                // the wall cupboard over it
// the back wall: the window, the stove (its front's middle at the old stove's, screen x 205), the counter beside it
const STX = r3(.9 + (205 - OX) / (S / R2) - K.STW / 2);
// (the kit's backdrop stands K.T + K.OUTD behind the wall, and a sight line through the window meets it that far along the wall to the left: the
// bush's place bushA is on the backdrop, so -1.5 puts it in the window's right half, as the old)
const WIN = { face: 'y', a0: 2.7, a1: 3.85, z0: 1.95, z1: 2.85, view: 'arbusto', name: 'ventana', bushA: -1.5, bushR: .5 };
// the doorway to the yard in the left wall, between the corner and the counter (the old picture's door at its left edge): whoever comes in to
// sit, or leaves, appears and goes there (moves: PUERTA), walking along the walkway behind the chairs (PASO)
const DOOR = { face: 'x', a0: 1.6, a1: 2.62, z0: 0, z1: 2.45, view: 'patio', door: true, name: 'puerta', horizon: 1.6 };
const WALK = { y: 2.2, door: [.15, 2.2] };                         // the walkway behind the chairs (y), and its end in the doorway
const BAND = { x: [[A0 - .2, YL]], y: [[STX - .18, XR]] };

/* ---------- the table and its chairs ---------- */
const TW = [214, 168, 112], TWD = [104, 68, 36], CHW = [110, 66, 32];   // the table's wood (old #D8B078 ...), its legs, the chairs (old Wd[0]..Wd[1]): legs and chairs
// dark enough to stand out from both floor tiles (WCAG contrast 2 and more: sheet checks.thin)
const CLOTH = [250, 250, 255], CLOTHD = [222, 222, 236], CLOTHR = [208, 48, 42];   // the cloth (old #FBFBFF, #D8D8E4, its red band #D0302A)
function tableLegs() { const { x0, x1, y0, y1, z, th } = TBL; for (const lx of [x0 + .12, x1 - .2]) for (const ly of [y0 + .1, y1 - .18]) kSolid('y', lx, lx + .08, ly, ly + .08, 0, z - th - .16, TWD); }
function table() {
  const { x0, x1, y0, y1, z, th } = TBL, R = rampOf(TW), L = rampOf(TWD);
  // the legs, inset from the corners, and the apron under the top
  kBox('y', x0 + .1, x1 - .1, y0 + .08, y1 - .08, z - th - .16, z - th, (f, p, q, sh) => f === 'top' ? 0 : L[sh ? 1 : 2]);
  // the top: planks along the table, a lit rim
  kBox('y', x0, x1, y0, y1, z - th, z, (f, p, q, sh) => {
    if (f === 'top') { const e = q - y0, plank = (e % .3) < .022; return R[p > x1 - .03 || q > y1 - .03 ? 4 : plank ? 2 : 3]; }
    return R[sh ? 1 : 2];
  });
}
// the cloth on the table (mantel): over the top, hanging over its near side and its right end, a red band near the hem
function cloth() {
  const { x0, x1, y0, y1, z } = TBL, m = .03, drop = .2, C = kRgb(CLOTH), CD = kRgb(CLOTHD), CR = kRgb(CLOTHR);
  kBox('y', x0 - m, x1 + m, y0 - m, y1 + m, z - drop, z + .012, (f, p, q, sh) => {
    if (f === 'top') return C;
    const h = z + .012 - q;                                            // how far down from the top's edge
    if (h > drop - .035) return CD;                                      // the hem
    if (h > drop - .1 && h < drop - .06) return CR;                    // the red band
    return sh ? CD : C;
  });
}
function chairLegs() { for (const c of CHAIRS) { const xa = c.x - CH.hw, xb = c.x + CH.hw, ya = c.y - CH.hd, yb = c.y + CH.hd; for (const lx of [xa, xb - .05]) for (const ly of [ya, yb - .05]) kSolid('y', lx, lx + .05, ly, ly + .05, 0, ZS - .06, CHW); } }
function chairs() {
  const R = rampOf(CHW);
  for (const c of CHAIRS) {
    const { hw, hd, back, ZB } = CH, xa = c.x - hw, xb = c.x + hw, ya = c.y - hd, yb = c.y + hd;
    kBox('y', xa, xb, ya, yb, ZS - .06, ZS, (f, p, q, sh) => f === 'top' ? R[3] : R[sh ? 1 : 2]);
    // the back: two posts and two rails at the seat's far edge (the old chairs: two posts, two slats)
    for (const px of [xa, xb - .06]) kSolid('y', px, px + .06, ya, ya + .06, ZS, ZB, CHW);
    for (const [r0, r1] of [[ZB - .2, ZB], [ZB - .5, ZB - .38]]) kBox('y', xa, xb, ya, ya + .05, r0, r1, (f, p, q, sh) => f === 'top' ? R[4] : R[sh ? 1 : 3]);
  }
}

/* ---------- bake one state ---------- */
const PLAN = {
  XR, YL, windows: [WIN, DOOR], band: BAND, occlusion: 'shade',
  furnish() {
    part('mostrador', () => { cocinaBase('x', A0, A1); });
    part('alacena', () => { cocinaWallCupboard('x', UP[0], UP[1]); });
    part('estufa', () => { cocinaStove('y', STX, { noEnd: true, horno: SET.horno }); });
    part('campana', () => { cocinaBackguard('y', STX); cocinaHood('y', STX); });
    part('mostrador2', () => { cocinaBase('y', STX + K.STW, XR); });
    part('sillas.patas', chairLegs);
    part('sillas', chairs);
    part('mesa.patas', tableLegs);
    part('mesa', () => { table(); if (SET.mantel) cloth(); });
  },
  shadows() {
    // the table's legs and the chairs' legs: a short contact shadow at each foot (thin things); the table's top: a low shade under it
    const { x0, x1, y0, y1 } = TBL;
    part('mesa.patas', () => { for (const lx of [x0 + .16, x1 - .16]) for (const ly of [y0 + .14, y1 - .14]) cocinaShadowFoot(lx, ly, .08); });
    // (the chairs' front legs stand under the table's top: no shadow is seen there)
    part('sillas.patas', () => { for (const c of CHAIRS) for (const lx of [c.x - CH.hw + .025, c.x + CH.hw - .025]) cocinaShadowFoot(lx, c.y - CH.hd + .025, .035); });
  },
};
// for the checks' pictures (not states): noshade=1, the set with no shadow cast and no floor dimming (what a surface is without the thing on it);
// empty=1, the room without the table and the chairs (what lies behind them)
const NOSHADE = Q.get('noshade') === '1', EMPTY = Q.get('empty') === '1';
function buildSet() { cocinaBuild(NOSHADE ? Object.assign({}, PLAN, { occlusion: 'none', shadows: null }) : EMPTY ? Object.assign({}, PLAN, { furnish() { const f = PLAN.furnish; const p0 = part; part = (n, fn) => /^(mesa|sillas)/.test(n) ? null : p0(n, fn); try { f(); } finally { part = p0; } }, shadows: null }) : PLAN); }
// what is under a screen point (the sheet's floor rule): the table's top, a counter's top, the stove's top, or the floor (z 0); on the floor, whether
// the point is under the table or a chair, in a counter's or the stove's footprint (not clear floor)
const inR = (x, y, r, m = 0) => x >= r[0] - m && x <= r[2] + m && y >= r[1] - m && y <= r[3] + m;
const FOOT = { mesa: [TBL.x0, TBL.y0, TBL.x1, TBL.y1], mostrador: [0, A0, K.CD, A1], mostrador2: [STX + K.STW, 0, XR, K.CD], estufa: [STX, 0, STX + K.STW, K.SD] };
function surfaceAt(sx, sy) {
  for (const [on, r, z] of [['mesa', FOOT.mesa, ZT], ['mostrador', FOOT.mostrador, K.CZ], ['mostrador2', FOOT.mostrador2, K.CZ], ['estufa', FOOT.estufa, K.CZ]]) {
    const g = Gs(sx, sy, z); if (inR(g[0], g[1], r)) return { on, z, x: g[0], y: g[1] }; }
  const g = Gs(sx, sy, 0), under = Object.entries(FOOT).find(([k, r]) => inR(g[0], g[1], r)) || CHAIRS.map((c, k) => ['silla' + k, [c.x - CH.hw, c.y - CH.hd, c.x + CH.hw, c.y + CH.hd]]).find(([k, r]) => inR(g[0], g[1], r));
  return { on: g[0] < 0 || g[1] < 0 ? 'wall' : 'floor', z: 0, x: g[0], y: g[1], under: under ? under[0] : null };
}
const STOVE = (() => { const x0 = STX, x1 = STX + K.STW; return { x0, x1, y0: 0, y1: K.SD, z: K.CZ }; })();
window.MESA_SET = { SET, OXY: [OX, OY], XR, YL, SILLA, SD, ZS, ZT, LAPS, LY, TBL, CH, CHAIRS, A0, A1, UP, STX, STOVE, WIN, DOOR, WALK, BAND, FOOT, K, KC, buildSet, Gs, SCR, surfaceAt };

if (Q.get('tags') === '1') PART_TAGS = new Array(W * H).fill(null);
// prof=1 (a check's tool, not a state): the time each part of the first bake takes
const PROF = Q.get('prof') === '1' ? {} : null;
if (PROF) { const p0 = part; part = (n, fn) => { const a = performance.now(); const r = p0(n, fn); PROF[n] = (PROF[n] || 0) + performance.now() - a; return r; };
  for (const f of ['bakeOcclusion', 'cocinaOcclusion', 'shadeEdges', 'applyShadows', 'flushShadows', 'skyFill']) { const g = window[f]; window[f] = function (...a) { const t = performance.now(); const r = g.apply(this, a); PROF[f] = (PROF[f] || 0) + performance.now() - t; return r; }; } }
const t0 = performance.now();
buildSet();
window.BAKE_MS = performance.now() - t0; window.PROF = PROF;
function frame(t, casts = []) {
  pix.set(bakedPix); zb.set(bakedZ);
  for (const c of casts) castShadow(c[0], c[1], c[2], c[3]);
  applyShadows(groundZ);
  ctx.putImageData(image, 0, 0);
  return image;
}
frame(SET.t);
window.TAGS = PART_TAGS;
window.DEPTH = { z: bakedZ, OX, OY, S };
window.frame = frame;
</script></body></html>
