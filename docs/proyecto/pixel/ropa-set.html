<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#000}canvas{image-rendering:pixelated}</style></head><body>
<canvas id="c"></canvas>
<script>
'use strict';
/* La ropa: where the family changes, at the back of the beach (place 7, scene 3), as a set on the Pixel Plays engine. A NEW scene: there is no old picture.
   Laid out square to the picture, in u, v (plaza-base.js, playa-base.js). The sea is at the top, with its wet strip; things wash up there.
   In the middle two palms with a line between them (the pegs and the clothes are sprites). At the left a little wooden cabin with a striped
   curtain for a door. At the right a bench that faces the camera. At the picture's foot, the road, with the guagua at its stop (story 80).
   The state comes from the address; these become the builder's setKey:
     hora = tarde | ocaso      the light
     guagua = 0 | 1            the guagua standing at the stop on the road, its door open (its driver is a sprite)
     t = wind time (0 for the reference); ox, oy = the origin
   It draws one frame: the baked set and the palms' fronds. No characters, no clothes, no things in the water. */
const Q = new URLSearchParams(location.search);
const pick = (k, allowed, def) => { const v = Q.get(k); return allowed.includes(v) ? v : def; };
const SET = { hora: pick('hora', ['tarde', 'ocaso'], 'tarde'), guagua: Q.get('guagua') === '1', t: +(Q.get('t') || 0) };
const ORIGIN = [0, -48];
window.PP_SCENE = { w: +(Q.get('pw') || 240), h: +(Q.get('ph') || 216), s: 26, originX: +(Q.get('ox') || ORIGIN[0]), originY: +(Q.get('oy') || ORIGIN[1]), shadowX: .9, shadowY: -.1 };
</script>
<script src="pp-engine.js"></script>
<script src="mapa.js"></script>
<script src="set-kit.js"></script>
<script src="calle-base.js"></script>
<script src="plaza-base.js"></script>
<script src="playa-base.js"></script>
<script>
'use strict';
const E = {
  B: { edge: 0, wet: .8, deep: -1.8, hor: -3.5 },                     // the beach (v)
  PALMS: [[-1.9, 2.7], [1.65, 2.7]], LINE: 1.75,                      // the two palms; the line's height
  PEGS: [-1.4, -.72, -.04, .64, 1.32],                                // cuerda1 to cuerda5: where a piece hangs (u), 18 px apart
  CABIN: { u: -3.1, v: 2.4, hw: .62, hd: .5, h: 2.3 },                // the cabin; its curtain is its front
  BENCH: { u: 2.55, v: 3.7, hw: .95 },                                // the bench (its seat's top is z .46)
  ROAD: 9.4,                                                          // the road begins at this v (a kerb, then asphalt to the picture's foot)
  BUS: { u0: .9, u1: 5.0, v: 10.6, h: 1.9 },                           // the guagua's side: a plane that faces the camera; its front end (the driver, the door) is at the left
};
function groundAt(x, y, ix, iy) {
  const [u, v] = PZ.uv(x, y);
  if (v > E.ROAD) return [v < E.ROAD + .16 ? CL.kerb() : (Math.abs(v - E.ROAD - 2.2) < .06 && ((u + 40) % 1.4) < .8) ? CL.paint(CL.LINE) : CL.asphalt(ix, iy), 'calle'];
  return PL.ground(u, v, ix, iy, E.B);
}
function cabin() {
  const K = E.CABIN, WD = [176, 134, 92], Wd = rampOf([140, 100, 64]);
  PZ.box(K.u, K.v, 0, K.h, K.hw, K.hd, WD, (s, t, z, face) => {
    if (face === 'front') {
      if (Math.abs(s) < K.hw - .12 && z < K.h - .4) { const k = Math.floor((s + K.hw) / .18) % 2; return z > K.h - .46 ? rgb(90, 70, 60) : shade(k ? [86, 160, 190] : [250, 246, 236], 2.3 - Math.abs(Math.sin(s * 9 + z * .5)) * .5, s * 6, z * 2, .2); }   // the striped curtain on its rail
      return ((z % .3) < .03) ? Wd[1] : 0;
    }
    return 0;
  });
  PZ.slope(K.u - K.hw - .12, K.u + K.hw + .12, K.v + K.hd + .12, K.h, K.v - K.hd - .1, K.h + .34, (u, b) => shade(PZ.TILE, b > .5 ? 3.0 : 2.4, u * 3, b * 4));
  for (let du = -K.hw; du <= K.hw; du += .3) PZ.shadow(K.u + du, K.v, 1.4, .5);
}
function bus() {
  const B = E.BUS, C1 = [244, 244, 236], BAND = [60, 150, 120], G = [44, 52, 66], G2 = [70, 84, 104];
  PZ.wall(B.u0, B.u1, B.v, .3, B.h + .3, (u, z) => {
    const d = u - B.u0, zz = z - .3;
    if (d > .35 && d < 1.15 && zz < B.h - .2) return (Math.abs(d - .75) < .03) ? rgb(30, 34, 44) : (d < .75 ? rgb(60, 50, 50) : rgb(96, 84, 76));        // the front door, open: the steps inside
    if (zz > .85 && zz < 1.55 && d > 1.45 && ((d - 1.45) % .68) < .54) return rgb(...(((u * 2 + z) % 1.6) < .22 ? G2 : G));
    if (zz > .85 && zz < 1.55 && d < .28) return rgb(...G);                                                                                                  // the driver's window
    if (zz > .32 && zz < .56) return shade(BAND, 2.4, u, z);
    return shade(C1, 2.4, u, z);
  });
  PZ.flat(B.u0, B.v - 1.3, B.u1, B.v, B.h + .3, (u, v) => shade([226, 226, 220], 3.4, u, v));
  for (const wu of [B.u0 + .8, B.u0 + 3.4]) PZ.wall(wu - .27, wu + .27, B.v + .02, 0, .54, (u, z) => { const r = Math.hypot((u - wu) * 26, (z - .27) * 22.5); return r > 6.6 ? 0 : r < 2.4 ? rgb(170, 170, 176) : rgb(40, 38, 44); });
  for (let u = B.u0; u <= B.u1; u += .5) PZ.shadow(u, B.v - .6, 1.2, .8);
  PZ.post(B.u0 - .5, E.ROAD - .25, 0, 2.3, .045, [90, 94, 104]);                                                                                             // the stop's sign: a small guagua on a board
  PZ.wall(B.u0 - .84, B.u0 - .16, E.ROAD - .2, 1.7, 2.3, (u, z) => { const fu = (u - B.u0 + .84) / .68, fz = (z - 1.7) / .6; return (fu < .07 || fu > .93 || fz < .08 || fz > .92) ? rgb(250, 250, 250) : (fz > .3 && fz < .72 && fu > .18 && fu < .82) ? rgb(250, 250, 250) : (fz > .18 && fz <= .3 && (Math.abs(fu - .32) < .07 || Math.abs(fu - .68) < .07)) ? rgb(30, 30, 40) : rgb(40, 110, 200); });
}
function buildSet() {
  zb.fill(-1e9); pix.fill(0); kinds.fill(0); ground.fill(0); shadowMask.fill(0); staticShadow.fill(0);
  tufts.length = 0; leaves.length = 0; pendingShadows.length = 0; slabTops.length = 0; glowReset();
  for (let iy = 0; iy < H; iy++) for (let ix = 0; ix < W; ix++) {
    const g = unproject(ix + .5, iy + .5), i = iy * W + ix, c = groundAt(g.x, g.y, ix, iy);
    if (!c) continue;
    pix[i] = c[0]; ground[i] = 1; zb[i] = (g.x + g.y) / R2 * COS; kinds[i] = c[1] === 'mar' ? KIND_WATER : c[1] === 'calle' ? KIND_ROAD : KIND_SAND;
  }
  groundZ.set(zb);
  const L = { tarde: { m: [1.0, .95, .86], a: [8, 3, -6] }, ocaso: { m: [1.0, .86, .74], a: [16, 0, -12] } }[SET.hora] || null;
  part('caseta', cabin);
  part('palmas', () => {
    PL.palm(E.PALMS[0][0], E.PALMS[0][1], 4.0, -.35, 2, 1, L); PL.palm(E.PALMS[1][0], E.PALMS[1][1], 3.8, .35, 5, .95, L);
    PZ.wall(E.PALMS[0][0], E.PALMS[1][0], E.PALMS[0][1], E.LINE - .12, E.LINE + .04, (u, z) => { const t = (u - E.PALMS[0][0]) / (E.PALMS[1][0] - E.PALMS[0][0]), zr = E.LINE - .07 * 4 * t * (1 - t); return Math.abs(z - zr) < .03 ? rgb(110, 84, 60) : 0; });
  });
  part('banco', () => PZ.seat(E.BENCH.u, E.BENCH.v, E.BENCH.hw));
  if (SET.guagua) part('guagua', bus);
  flushShadows(); pendingShadows.length = 0;
  bakeOcclusion(); joinSlabs(); staticShadow.set(shadowMask); applyShadows(groundZ); shadeEdges();
  PL.light(SET.hora);
  skyFill(PL.sky(SET.hora, SET.hora === 'ocaso' ? [70, 12, 8] : null));
  bakedPix.set(pix); bakedZ.set(zb);
}
window.ROPA = { SET, E, buildSet };
if (Q.get('tags') === '1') PART_TAGS = new Array(W * H).fill(null);
const t0 = performance.now();
buildSet();
window.BAKE_MS = performance.now() - t0;
function frame(t, casts = []) {
  pix.set(bakedPix); zb.set(bakedZ);
  const windT = STILL ? 0 : Math.floor(t * WIND_FPS) / WIND_FPS;
  drawLeaves(windT);
  for (const c of casts) castShadow(c[0], c[1], c[2], c[3]);
  applyShadows(groundZ);
  ctx.putImageData(image, 0, 0);
  return image;
}
frame(SET.t);
if (PART_TAGS) tagLeaves(zb);
window.TAGS = PART_TAGS;
window.DEPTH = { z: bakedZ, OX, OY, S, live: () => zb };
window.frame = frame;
</script></body></html>
