<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#000}canvas{image-rendering:pixelated}</style></head><body>
<canvas id="c"></canvas>
<script>
'use strict';
/* La sombrilla: abuela's beach umbrella, close (place 7, scene 2), as a set on the Pixel Plays engine. A NEW scene: there is no old picture.
   Laid out square to the picture, in u, v (plaza-base.js, playa-base.js). The sea is a strip at the top. At the left the striped umbrella with
   a blanket in its shade. In the middle and at the right, a wide flat stretch of damp sand, the children's drawing ground; on it, drawn with a
   stick: a big circle (a face to be), or a whole lying figure (a round head at the top, two arms out to the sides with five-line hands, a
   body, two legs coming towards the camera). Beside it a bucket, a heap of seaweed and abuela's bag.
   The state comes from the address; these become the builder's setKey:
     hora = mediodia | tarde | sol      the light (sol: the hottest hour, hard and bright)
     dibujo = circulo | figura          what is drawn on the damp sand
     t = wind time (0 for the reference); ox, oy = the origin
   It draws one frame: the baked set. No characters, no shells, no seaweed hair, no stones. */
const Q = new URLSearchParams(location.search);
const pick = (k, allowed, def) => { const v = Q.get(k); return allowed.includes(v) ? v : def; };
const SET = { hora: pick('hora', ['mediodia', 'tarde', 'sol'], 'mediodia'), dibujo: pick('dibujo', ['circulo', 'figura'], 'circulo'), t: +(Q.get('t') || 0) };
const ORIGIN = [0, -44];
window.PP_SCENE = { w: +(Q.get('pw') || 240), h: +(Q.get('ph') || 216), s: 26, originX: +(Q.get('ox') || ORIGIN[0]), originY: +(Q.get('oy') || ORIGIN[1]), shadowX: .9, shadowY: -.1 };
</script>
<script src="pp-engine.js"></script>
<script src="mapa.js"></script>
<script src="set-kit.js"></script>
<script src="calle-base.js"></script>
<script src="plaza-base.js"></script>
<script src="playa-base.js"></script>
<script>
'use strict';
const E = {
  B: { edge: 0, wet: .7, deep: -1.6, hor: -3.2 },                     // the beach (v): the water's edge, the wet strip, where the sea turns dark, the horizon
  UMB: [-3.05, 1.5, 2.1, 1.3],                                       // the umbrella: u, v, its pole's height, the canopy's radius
  BLANKET: [-2.75, 1.2, -.35, 2.9],                                    // the blanket in its shade: u0, v0, u1, v1
  GROUND: { u: 1.05, v: 5.2, ru: 2.75, rv: 3.3 },                     // the damp drawing ground: an oval
  FACE: { u: 1.05, v: 4.6, r: 1.6 },                                  // dibujo = circulo: the big circle; the eyes at u -+ .62, v - .55; the nose at v + .1; the mouth at v + .85
  FIG: { u: 1.05, head: [3.0, .78], arms: 4.35, armLen: 1.95, body: [3.8, 5.5], legs: [5.5, 7.6], legDu: .55 },   // dibujo = figura: the head's v and radius; the arms' v and half length; the body from v to v; the legs from v to v, each du from the middle
  BUCKET: [3.45, 1.9], WEED: [3.5, 3.0], BAG: [-2.3, 5.3],
};
const FACE_AT = { ojo_izq: [E.FACE.u - .62, E.FACE.v - .55], ojo_der: [E.FACE.u + .62, E.FACE.v - .55], nariz: [E.FACE.u, E.FACE.v + .1], boca: [E.FACE.u, E.FACE.v + .85] };
const LINE = rgb(120, 100, 76);
// is (u, v) on a line drawn with the stick? (the ground is seen flattened: a line is ~1.4 px thick either way)
const near = (d, w = .045) => Math.abs(d) < w;
function drawn(u, v) {
  if (SET.dibujo === 'circulo') {
    const F = E.FACE, d = Math.hypot(u - F.u, (v - F.v) * 1.0);
    return near(d - F.r, .05);
  }
  const G = E.FIG, du = u - G.u;
  if (near(Math.hypot(du, v - G.head[0]) - G.head[1], .05)) return true;                         // the head
  if (near(du, .04) && v > G.body[0] && v < G.body[1]) return true;                              // the body
  if (near(v - G.arms, .07) && Math.abs(du) < G.armLen) return true;                             // the arms
  for (const sgn of [-1, 1]) {                                                                   // the hands: five short lines; the legs; the feet
    const hu = sgn * G.armLen;
    for (let k = -2; k <= 2; k++) { const a = k * .38, lu = du - hu, lv = v - G.arms, t = lu * sgn * Math.cos(a) + lv * Math.sin(a), n = -lu * sgn * Math.sin(a) + lv * Math.cos(a); if (t > 0 && t < .46 && near(n, .05)) return true; }
    const lt = (v - G.legs[0]) / (G.legs[1] - G.legs[0]);
    if (lt > 0 && lt < 1 && near(du - sgn * G.legDu * lt, .045)) return true;
    if (near(v - G.legs[1], .07) && (du - sgn * G.legDu) * sgn > 0 && (du - sgn * G.legDu) * sgn < .4) return true;
  }
  return false;
}
function groundAt(x, y, ix, iy) {
  const [u, v] = PZ.uv(x, y), g = PL.ground(u, v, ix, iy, E.B);
  if (!g) return 0;
  if (g[1] === 'arena') {
    const K = E.GROUND, d = Math.hypot((u - K.u) / K.ru, (v - K.v) / K.rv) + noise(u * 2, v * 2) * .06;
    if (d < 1) {
      if (drawn(u, v)) return [LINE, 'arena'];
      return [toneOf(PL.WET, d > .9 ? .9 : .62 + noise(u * 1.5, v * 1.5) * .12, ix, iy), 'arena'];   // damp, flat, darker than the dry sand round it
    }
  }
  return g;
}
function buildSet() {
  zb.fill(-1e9); pix.fill(0); kinds.fill(0); ground.fill(0); shadowMask.fill(0); staticShadow.fill(0);
  tufts.length = 0; leaves.length = 0; pendingShadows.length = 0; slabTops.length = 0; glowReset();
  for (let iy = 0; iy < H; iy++) for (let ix = 0; ix < W; ix++) {
    const g = unproject(ix + .5, iy + .5), i = iy * W + ix, c = groundAt(g.x, g.y, ix, iy);
    if (!c) continue;
    pix[i] = c[0]; ground[i] = 1; zb[i] = (g.x + g.y) / R2 * COS; kinds[i] = c[1] === 'mar' ? KIND_WATER : KIND_SAND;
  }
  groundZ.set(zb);
  part('manta', () => PL.blanket(...E.BLANKET, [70, 150, 150], [250, 246, 236]));
  part('sombrilla', () => PL.umbrella(E.UMB[0], E.UMB[1], E.UMB[2], E.UMB[3], true));
  part('cubo', () => PL.bucket(E.BUCKET[0], E.BUCKET[1]));
  part('algas', () => { const [x, y] = PZ.xy(E.WEED[0], E.WEED[1]); for (let k = 0; k < 9; k++) sphere(x + Math.cos(k * 2.3) * .22 * (k % 3), y + Math.sin(k * 2.3) * .22 * (k % 3), .1, .16, k % 2 ? [60, 130, 70] : [86, 156, 80], 'rough'); castShadow(x, y, .1, .4); });
  part('bolsa', () => { PZ.box(E.BAG[0], E.BAG[1], 0, .5, .36, .2, [236, 150, 60], (s, t, z, face) => face === 'front' && z > .36 ? rgb(250, 246, 236) : 0); PZ.shadow(E.BAG[0], E.BAG[1], .3, .4); });
  flushShadows(); pendingShadows.length = 0;
  bakeOcclusion(); joinSlabs(); staticShadow.set(shadowMask); applyShadows(groundZ); shadeEdges();
  PL.light(SET.hora);
  skyFill(PL.sky(SET.hora, null));
  bakedPix.set(pix); bakedZ.set(zb);
}
window.SOMBRILLA = { SET, E, FACE_AT, buildSet };
if (Q.get('tags') === '1') PART_TAGS = new Array(W * H).fill(null);
const t0 = performance.now();
buildSet();
window.BAKE_MS = performance.now() - t0;
function frame(t, casts = []) {
  pix.set(bakedPix); zb.set(bakedZ);
  for (const c of casts) castShadow(c[0], c[1], c[2], c[3]);
  applyShadows(groundZ);
  ctx.putImageData(image, 0, 0);
  return image;
}
frame(SET.t);
window.TAGS = PART_TAGS;
window.DEPTH = { z: bakedZ, OX, OY, S };
window.frame = frame;
</script></body></html>
