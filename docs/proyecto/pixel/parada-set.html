<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#000}canvas{image-rendering:pixelated}</style></head><body>
<canvas id="c"></canvas>
<script>
'use strict';
/* La parada: a bus stop on a street of small houses (place 5, scene 2), as a set on the Pixel Plays engine. A NEW scene: there is no old picture.
   Far side: a row of house fronts along x (lit), their pavement. Then the street, two lanes; whatever drives goes left (towards -x), so a guagua's
   lit right side, with its two doors, faces the camera, and the near pavement is its kerb. Near side, at the bottom: the wide pavement of the stop,
   with the stop's sign on a pole at the kerb, a seat with a back, a post with a walking person where a footpath leaves to the right, a street lamp.
   No roof over the seat: it would hide the guagua's doors.
   The state comes from the address; these become the builder's setKey:
     hora = temprano | manana | tarde | noche    the sky, the sun's height, the light; noche lights the lamp
     autos = for the readers' renders only: "guagua@x,y,i" ... joined by ";" (in the game they are sprites)
     t = wind time (0 for the reference); ox, oy = the origin
   It draws one frame: the baked set. No characters. */
const Q = new URLSearchParams(location.search);
const pick = (k, allowed, def) => { const v = Q.get(k); return allowed.includes(v) ? v : def; };
const SET = { hora: pick('hora', ['temprano', 'manana', 'tarde', 'noche'], 'manana'), t: +(Q.get('t') || 0) };
const ORIGIN = [70, -16];
window.PP_SCENE = { w: +(Q.get('pw') || 240), h: +(Q.get('ph') || 216), s: 26, originX: +(Q.get('ox') || ORIGIN[0]), originY: +(Q.get('oy') || ORIGIN[1]), shadowX: .9, shadowY: -.1 };
</script>
<script src="pp-engine.js"></script>
<script src="mapa.js"></script>
<script src="set-kit.js"></script>
<script src="calle-base.js"></script>
<script>
'use strict';
const E = {
  HH: 2.8, FP: 1.4, S0: 1.6, S1: 5.6, NP: 5.8, NP1: 9.2,             // the houses' height; the far pavement; the street; the near pavement from NP to NP1
  LANE1: 2.6, LANE2: 4.6,                                            // the lanes' middles (LANE2 is the stop's)
  P1: -1.7, P2: 3.2,                                                 // the middles of the two guaguas that stand at the stop, in LANE2
  SIGN: [-.5, 6.05], SEAT: [.3, 7.35, 2.5], POST: [5.2, 6.5], LAMP: [1.2, .9],
  PATH: [6.2, 7.3],                                                  // the footpath on the near pavement, right of the post: from y to y
  SUN: { temprano: [227, 9, 7], manana: null, tarde: [231, 15, 8], noche: null },
};
function groundAt(x, y, ix, iy) {
  if (y < -4.2) return 0;
  if (y < 0) return CL.grass(x, y, ix, iy);                                            // behind the houses: sky
  if (y >= E.S0 && y <= E.S1) return (Math.abs(y - 3.6) < .06 && ((x + 40) % 1.6) < 1.0) ? CL.paint(CL.LINE) : CL.asphalt(ix, iy);
  if ((y > E.FP && y < E.S0) || (y > E.S1 && y < E.NP)) return CL.kerb();
  if (y > E.NP1) return CL.grass(x, y, ix, iy);
  if (y > E.NP && x > E.POST[0] + .2 && y >= E.PATH[0] && y <= E.PATH[1]) return rgb(...(hash(ix, iy) < .1 ? [226, 204, 160] : [214, 190, 146]));   // the footpath
  if (y > E.NP && x > E.P1 - 2.2 && x < E.P1 + 2.2 && y < E.NP + .16) return CL.paint([236, 196, 60]);                                         // the stop's yellow kerb
  return CL.slab(x, y, ix, iy);
}
const busPic = (u, v) => {                                           // the stop's sign: a guagua, side on
  if (v > .3 && v < .78 && u > .16 && u < .84) return (v > .5 && v < .7 && ((u - .2) % .2) < .13) ? rgb(60, 80, 110) : rgb(250, 250, 250);
  if (Math.hypot(u - .32, v - .26) < .09 || Math.hypot(u - .68, v - .26) < .09) return rgb(40, 40, 50);
  return 0;
};
const walkPic = (u, v) => {                                          // the post: a walking person
  if (Math.hypot(u - .5, v - .8) < .1) return rgb(250, 250, 250);
  if (Math.abs(u - .5) < .07 && v > .42 && v < .7) return rgb(250, 250, 250);
  if (v <= .42 && v > .12 && Math.abs(Math.abs(u - .5) - (.42 - v) * .55) < .06) return rgb(250, 250, 250);
  if (v > .5 && v < .62 && Math.abs(u - .5) < .24) return rgb(250, 250, 250);
  return 0;
};
function buildSet() {
  zb.fill(-1e9); pix.fill(0); kinds.fill(0); ground.fill(0); shadowMask.fill(0); staticShadow.fill(0);
  tufts.length = 0; leaves.length = 0; pendingShadows.length = 0; slabTops.length = 0; glowReset();
  for (let iy = 0; iy < H; iy++) for (let ix = 0; ix < W; ix++) {
    const g = unproject(ix + .5, iy + .5), i = iy * W + ix, c = groundAt(g.x, g.y, ix, iy);
    if (!c) continue;
    pix[i] = c; ground[i] = 1; zb[i] = (g.x + g.y) / R2 * COS; kinds[i] = KIND_ROAD;
  }
  groundZ.set(zb);
  part('casas', () => {
    CL.houseX(0, -13, -8.6, E.HH, [250, 214, 120], [206, 150, 70], -11.4, -10.0);
    CL.houseX(0, -8.6, -4.2, E.HH + .3, [150, 200, 214], [86, 140, 160], -7.9, -6.4, [120, 70, 50]);
    CL.houseX(0, -4.2, .2, E.HH, [244, 170, 150], [200, 110, 96], -1.6, -3.4);
    CL.houseX(0, .2, 4.6, E.HH + .2, [196, 220, 150], [120, 160, 90], .9, 2.6, [96, 70, 110]);
  });
  part('arbol', () => CL.tree(6.4, -1.6, 1.3, .9));
  part('parada', () => CL.signPole(E.SIGN[0], E.SIGN[1], 2.3, .62, .62, [40, 110, 200], busPic));
  part('asiento', () => CL.seat(E.SEAT[0], E.SEAT[1], E.SEAT[2]));
  part('poste', () => CL.signPole(E.POST[0], E.POST[1], 1.5, .5, .5, [60, 150, 90], walkPic));
  part('farol', () => {
    const [x, y] = E.LAMP, lit = SET.hora === 'noche';
    for (let z = 0; z <= 3.3; z += CL.PZ) for (let t = 0; t < 6.3; t += .5) plot(x + Math.cos(t) * .05, y + Math.sin(t) * .05, z, shade([70, 74, 84], 1.2 + Math.cos(t - .8) * 1.2, t, z));
    CL.box(x - .16, y - .1, 3.3, x + .16, y + .5, 3.42, [60, 64, 74]);
    for (let a = -.12; a <= .12; a += .02) for (let b = .1; b <= .44; b += .02) plot(x + a, y + b, 3.29, lit ? rgb(255, 240, 170) : rgb(210, 214, 220));
    if (lit) for (let a = -1.1; a <= 1.1; a += .05) for (let b = -.5; b <= 1.5; b += .05) if ((a * a) / 1.2 + (b - .5) * (b - .5) < 1) plotGlow(x + a, y + b, .02, rgb(255, 232, 150));
    for (let z = .15; z <= 3.2; z += .12) castShadow(x, y, z, .06);
  });
  for (const a of (Q.get('autos') || '').split(';').filter(Boolean)) { const [k, r] = a.split('@'), [x, y, h, bd] = r.split(','); part('auto', () => CL.vehicle(k, +x, +y, h || 'i', bd || null)); }
  flushShadows(); pendingShadows.length = 0;
  bakeOcclusion(); joinSlabs(); staticShadow.set(shadowMask); applyShadows(groundZ); shadeEdges();
  const L = { temprano: [[1.0, .95, .86], [8, 4, -4]], tarde: [[1.0, .9, .8], [12, 0, -10]], noche: [[.62, .62, .82], [-6, -4, 14]] }[SET.hora];
  if (L) lightPass(L[0], L[1]);
  skyFill(CL.sky(SET.hora, E.SUN[SET.hora]));
  bakedPix.set(pix); bakedZ.set(zb);
}
window.PARADA = { SET, E, buildSet };
if (Q.get('tags') === '1') PART_TAGS = new Array(W * H).fill(null);
const t0 = performance.now();
buildSet();
window.BAKE_MS = performance.now() - t0;
function frame(t, casts = []) {
  pix.set(bakedPix); zb.set(bakedZ);
  for (const c of casts) castShadow(c[0], c[1], c[2], c[3]);
  applyShadows(groundZ);
  ctx.putImageData(image, 0, 0);
  return image;
}
frame(SET.t);
window.TAGS = PART_TAGS;
window.DEPTH = { z: bakedZ, OX, OY, S };
window.frame = frame;
</script></body></html>
