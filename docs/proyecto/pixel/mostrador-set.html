<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#000}canvas{image-rendering:pixelated}</style></head><body>
<canvas id="c"></canvas>
<script>
'use strict';
/* El mostrador: don Pepe's counter (place 4, scene 1), as a set on the Pixel Plays engine. A NEW scene: there is no old picture.
   The room itself is colmado-dentro.js (shared with estantes and caja); this file frames the counter: the first run of shelves, the counter,
   the register, the freezer, the chair and the street door with its open leaf, all whole; the second run of shelves is out of the picture.
   The state comes from the address; these become the builder's setKey:
     donde = dentro | calle       inside the shop, or its front from the street (calle: colmado-fuera.js, with the frutas set)
     hora  = manana | tarde       the hour: what shows through the street door, the light on the floor
     atras = shut | open          the back door
     puerta = shut | open         the shop door, in calle
     nevera = 0 | 1               the little freezer on the counter (story 38)
     props = 0 | 1                stand-in goods on the shelves (for the readers' renders only; in the game they are sprites)
     t = wind time (0 for the reference); ox, oy = the origin
   It draws one frame: the baked set. No characters. */
const Q = new URLSearchParams(location.search);
const pick = (k, allowed, def) => { const v = Q.get(k); return allowed.includes(v) ? v : def; };
const SET = {
  donde: pick('donde', ['dentro', 'calle'], 'dentro'),
  hora: pick('hora', ['manana', 'tarde'], 'manana'),
  atras: pick('atras', ['shut', 'open'], 'shut'),
  puerta: pick('puerta', ['shut', 'open'], 'shut'),
  nevera: Q.get('nevera') === '1',
  props: Q.get('props') === '1',
  t: +(Q.get('t') || 0),
};
const ORIGIN = SET.donde === 'calle' ? [-46, -6] : [-7, -32];        // calle: the door and the sign in the middle third, the whole stand, the crate and the post inside the picture. dentro: the first run of shelves, the counter and the chair whole; the street door, the shop window and the register inside
window.PP_SCENE = { w: +(Q.get('pw') || 240), h: +(Q.get('ph') || 216), s: 26, originX: +(Q.get('ox') || ORIGIN[0]), originY: +(Q.get('oy') || ORIGIN[1]), shadowX: .9, shadowY: -.1 };
</script>
<script src="pp-engine.js"></script>
<script src="mapa.js"></script>
<script src="set-kit.js"></script>
<script src="colmado-dentro.js"></script>
<script src="colmado-fuera.js"></script>
<script>
'use strict';
const DARK = [46, 38, 40];                                           // outside the room, above the walls' tops: a warm dark
function buildSet() {
  zb.fill(-1e9); pix.fill(0); kinds.fill(0); ground.fill(0); shadowMask.fill(0); staticShadow.fill(0);
  tufts.length = 0; leaves.length = 0; pendingShadows.length = 0; slabTops.length = 0; glowReset();
  if (SET.donde === 'calle') {                                       // the shop front, from the street (story 36's first beat)
    const o = { hora: SET.hora, puerta: SET.puerta, puesto: true, solX: 206 }, HZ = CF.skyPlan(o).HZ;
    for (let iy = 0; iy < H; iy++) for (let ix = 0; ix < W; ix++) {
      const g = unproject(ix + .5, iy + .5), i = iy * W + ix, c = CF.groundAt(g.x, g.y, ix, iy, i, HZ);
      if (!c) continue;
      pix[i] = c; ground[i] = 1; zb[i] = (g.x + g.y) / R2 * COS;
    }
    groundZ.set(zb);
    CF.build(o);
    flushShadows(); pendingShadows.length = 0;
    bakeOcclusion(); joinSlabs(); staticShadow.set(shadowMask); applyShadows(groundZ); shadeEdges();
    skyFill(CF.sky(o, HZ));
    bakedPix.set(pix); bakedZ.set(zb);
    return;
  }
  for (let iy = 0; iy < H; iy++) for (let ix = 0; ix < W; ix++) {
    const g = unproject(ix + .5, iy + .5), i = iy * W + ix, c = CD.floorAt(g.x, g.y, ix, iy, i);
    if (!c) continue;
    pix[i] = c; ground[i] = 1; zb[i] = (g.x + g.y) / R2 * COS;
  }
  groundZ.set(zb);
  CD.build(SET);
  flushShadows(); pendingShadows.length = 0;
  bakeOcclusion(); joinSlabs(); staticShadow.set(shadowMask); applyShadows(groundZ); shadeEdges();
  CD.light(SET);
  skyFill(() => rgb(...DARK));
  bakedPix.set(pix); bakedZ.set(zb);
}
window.MOSTRADOR = { SET, CD, buildSet };
if (Q.get('tags') === '1') PART_TAGS = new Array(W * H).fill(null);
const t0 = performance.now();
buildSet();
window.BAKE_MS = performance.now() - t0;
function frame(t, casts = []) {
  pix.set(bakedPix); zb.set(bakedZ);
  for (const c of casts) castShadow(c[0], c[1], c[2], c[3]);
  applyShadows(groundZ);
  ctx.putImageData(image, 0, 0);
  return image;
}
frame(SET.t);
window.TAGS = PART_TAGS;
window.DEPTH = { z: bakedZ, OX, OY, S };
window.frame = frame;
</script></body></html>
