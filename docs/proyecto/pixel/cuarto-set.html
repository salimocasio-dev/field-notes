<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#000}canvas{image-rendering:pixelated}</style></head><body>
<canvas id="c"></canvas>
<script>
'use strict';
/* El cuarto: the children's bedroom in the morning (place 9, scene 1), as a set on the Pixel Plays engine. A NEW scene.
   Laid out square to the picture, in u, v (plaza-base.js, fonda-base.js, casa-base.js). The back wall faces us at v = 0: a wall light with
   its switch, a window, a wall clock (no hands: they are sprites), the door at the right. Two beds stand side by side, heads to the wall:
   Luis's (blue) at the left, Carmen's (pink) at the right; whoever lies in one is seen whole, head at the top. Between them a night table.
   At the far left an armchair (butaca = 1); in the right back corner a cradle (cuna = 1); at the right front a chair; a rug at the left front.
   The state comes from the address; these become the builder's setKey:
     hora = alba | manana     the window, and the room's light (alba: dim, unless the wall light is on)
     luz = 0 | 1              the wall light
     cuna = 0 | 1, butaca = 0 | 1
   It draws one frame: the baked set. No people, no blankets, no big pillow, no plate, no bell, no clothes. */
const Q = new URLSearchParams(location.search);
const pick = (k, allowed, def) => { const v = Q.get(k); return allowed.includes(v) ? v : def; };
const on = (k, def = 0) => (Q.get(k) === null ? def : +(Q.get(k) === '1'));
const SET = { hora: pick('hora', ['alba', 'manana'], 'manana'), luz: on('luz'), cuna: on('cuna'), butaca: on('butaca'), t: +(Q.get('t') || 0) };
const ORIGIN = [0, -42];
window.PP_SCENE = { w: +(Q.get('pw') || 240), h: +(Q.get('ph') || 216), s: 26, originX: +(Q.get('ox') || ORIGIN[0]), originY: +(Q.get('oy') || ORIGIN[1]), shadowX: .9, shadowY: -.1 };
</script>
<script src="pp-engine.js"></script>
<script src="mapa.js"></script>
<script src="set-kit.js"></script>
<script src="calle-base.js"></script>
<script src="plaza-base.js"></script>
<script src="fonda-base.js"></script>
<script src="casa-base.js"></script>
<script>
'use strict';
const E = {
  WALL: 3.1,
  LIGHT: { u: -2.55, z: 2.2, sw: [-2.55, 1.3] },                      // the wall light, and its switch (u, z)
  WINDOW: [-1.75, -.25, 1.35, 2.45],
  CLOCK: [.75, 2.25],
  DOOR: [2.75, 3.62, 0, 2.15],
  BEDS: [{ u: -1.5, c: [110, 150, 220] }, { u: 1.2, c: [236, 150, 170] }], BED: { v0: .25, v1: 3.2, hw: .66 },   // Luis's, Carmen's: head at v0, foot at v1 (the mattress top is z .5)
  TABLE: { u: -.15, v: .55, hw: .4, hd: .28, h: .55 },                // the night table
  ARMCHAIR: [-3.15, 1.3],
  CRADLE: { u: 2.28, v: .75, hw: .33, hd: .3 },
  CHAIR: [2.9, 4.3],                                                  // the chair (seat top z .44; its back's top z 1.08, at v - .18)
  RUG: [-3.3, 4.2, -.7, 5.9],
};
const groundAt = (x, y, ix, iy) => { const [u, v] = PZ.uv(x, y); return v < -.02 ? rgb(84, 70, 70) : CS.boards(u, v, ix, iy); };
function backWall() {
  PZ.wall(-5, 5, 0, 0, E.WALL, (u, z) => {
    const L = E.LIGHT;
    const sw = Math.abs(u - L.sw[0]) < .13 && Math.abs(z - L.sw[1]) < .16; if (sw) return (Math.abs(u - L.sw[0]) < .05 && Math.abs(z - L.sw[1]) < .07) ? rgb(120, 120, 130) : rgb(252, 250, 244);
    return CS.windowAt(u, z, E.WINDOW, SET.hora) || CS.clockAt(u, z, E.CLOCK[0], E.CLOCK[1]) || CS.doorAt(u, z, E.DOOR, true) || CS.paint(u, z, [226, 214, 236]);
  });
  CS.lampWall(E.LIGHT.u, E.LIGHT.z, SET.luz);
}
function room() {
  CS.rug(...E.RUG, [86, 150, 150], [240, 230, 200]);
  if (SET.butaca) CS.armchair(E.ARMCHAIR[0], E.ARMCHAIR[1], [150, 110, 170]);
  for (const b of E.BEDS) CS.bed(b.u, E.BED.v0, E.BED.v1, E.BED.hw, b.c);
  const T = E.TABLE;
  PZ.box(T.u, T.v, 0, T.h, T.hw, T.hd, FD.WOOD, (s, t, z, face) => face === 'top' ? rgb(...FD.WOOD_L) : (face === 'front' && z > .1 && z < T.h - .1 && Math.abs(s) < T.hw - .07) ? (Math.hypot(s * 26, (z - .3) * 22.5) < 1.4 ? rgb(...FD.BRASS) : rgb(...FD.WOOD_L)) : 0);
  if (SET.cuna) {
    const C = E.CRADLE;
    PZ.box(C.u, C.v, .3, .4, C.hw, C.hd, [250, 246, 236], (s, t, z, face) => face === 'top' ? rgb(250, 226, 150) : 0);                                 // the cradle: a bed of slats on rockers
    PZ.wall(C.u - C.hw, C.u + C.hw, C.v - C.hd, .4, .95, (a, b) => (b > .88 || Math.floor((a - C.u + C.hw) / .09) % 2 === 0) ? rgb(250, 246, 236) : 0);
    PZ.wall(C.u - C.hw, C.u + C.hw, C.v + C.hd, .4, .78, (a, b) => (b > .72 || Math.abs(a - C.u) > C.hw - .05 || Math.floor((a - C.u + C.hw) / .09) % 2 === 0) ? rgb(250, 246, 236) : 0);
    PZ.wall(C.u - C.hw - .08, C.u + C.hw + .08, C.v + C.hd + .02, 0, .3, (a, b) => Math.abs(b - (.02 + Math.pow((a - C.u) / (C.hw + .08), 2) * .2)) < .045 ? rgb(...FD.WOOD_L) : (Math.abs(Math.abs(a - C.u) - C.hw + .06) < .03 ? rgb(...FD.WOOD_L) : 0));
    PZ.shadow(C.u, C.v, .3, .4);
  }
  FD.chair(E.CHAIR[0], E.CHAIR[1]); PZ.shadow(E.CHAIR[0], E.CHAIR[1], .4, .3);
}
function buildSet() {
  zb.fill(-1e9); pix.fill(0); kinds.fill(0); ground.fill(0); shadowMask.fill(0); staticShadow.fill(0);
  tufts.length = 0; leaves.length = 0; pendingShadows.length = 0; slabTops.length = 0; glowReset();
  for (let iy = 0; iy < H; iy++) for (let ix = 0; ix < W; ix++) {
    const g = unproject(ix + .5, iy + .5), i = iy * W + ix, c = groundAt(g.x, g.y, ix, iy);
    if (!c) continue;
    pix[i] = c; ground[i] = 1; zb[i] = (g.x + g.y) / R2 * COS; kinds[i] = KIND_ROAD;
  }
  groundZ.set(zb);
  part('pared', backWall);
  part('cuarto', room);
  flushShadows(); pendingShadows.length = 0;
  bakeOcclusion(); joinSlabs(); staticShadow.set(shadowMask); applyShadows(groundZ); shadeEdges();
  { const dim = SET.hora === 'alba' && !SET.luz; lightPass(dim ? [.66, .68, .84] : [1.0, .97, .92], dim ? [-4, -2, 16] : [3, 1, -3], false); }
  skyFill(() => rgb(30, 24, 30));
  bakedPix.set(pix); bakedZ.set(zb);
}
window.CUARTO = { SET, E, buildSet };
if (Q.get('tags') === '1') PART_TAGS = new Array(W * H).fill(null);
const t0 = performance.now();
buildSet();
window.BAKE_MS = performance.now() - t0;
function frame(t, casts = []) {
  pix.set(bakedPix); zb.set(bakedZ);
  for (const c of casts) castShadow(c[0], c[1], c[2], c[3]);
  applyShadows(groundZ);
  ctx.putImageData(image, 0, 0);
  return image;
}
frame(SET.t);
window.TAGS = PART_TAGS;
window.DEPTH = { z: bakedZ, OX, OY, S };
window.frame = frame;
</script></body></html>
