<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#000}canvas{image-rendering:pixelated}</style></head><body>
<canvas id="c"></canvas>
<script>
'use strict';
/* El baño: the bathroom, in daylight (place 9, scene 2), as a set on the Pixel Plays engine. A NEW scene.
   Laid out square to the picture, in u, v. The tiled back wall faces us at v = 0. At the left the shower: a tiled corner with a low wall
   across its front (whoever stands in it is seen from the shoulders up), its head on the back wall, and its tap OUTSIDE it, on the wall at
   its right. In the middle the sink with its tap, the mirror over it, a shelf at each side of it at the sink's height. On the wall at the
   right the water heater with its gauge (the bars are sprites), and the door. A wide stool, a basket.
   One state. It draws one frame: the baked set. No people, no water, no soap, no towels, nothing on the shelves. */
const Q = new URLSearchParams(location.search);
const pick = (k, allowed, def) => { const v = Q.get(k); return allowed.includes(v) ? v : def; };
const on = (k, def = 0) => (Q.get(k) === null ? def : +(Q.get(k) === '1'));
const SET = { hora: 'dia', t: +(Q.get('t') || 0) };
const ORIGIN = [0, -42];
window.PP_SCENE = { w: +(Q.get('pw') || 240), h: +(Q.get('ph') || 216), s: 26, originX: +(Q.get('ox') || ORIGIN[0]), originY: +(Q.get('oy') || ORIGIN[1]), shadowX: .9, shadowY: -.1 };
</script>

<script src="mapa.js"></script>

<script>
'use strict';
const E = {
  WALL: 3.1,
  SHOWER: { u0: -3.75, u1: -2.25, v1: 1.6, wall: 1.2, head: [-3.0, 2.35] },   // the shower: from the back wall to v1; its low front wall's height; its head (u, z)
  TAP_SHOWER: [-1.95, 1.35],                                          // the shower's tap, on the wall outside it (u, z)
  SINK: { u: 0, v: .42, hw: .5, hd: .34, h: .8 },                     // the sink; its tap is on its top, at the back
  MIRROR: [-.55, .55, 1.4, 2.35],
  SHELF_L: { u0: -1.72, u1: -.62, v1: .62, z: .8 },                   // the shelf at the sink's left (the frog stands on it)
  SHELF_R: { u0: .62, u1: 2.0, v1: .62, z: .8 },                      // the shelf at its right (things lie on it)
  HEATER: { u: 2.38, z0: 1.5, z1: 2.45, hw: .3, gauge: [2.38, 1.9] },
  DOOR: [2.8, 3.62, 0, 2.15],
  STOOL: { u: 1.7, v: 2.7, hw: .5, hd: .26, h: .4 },                  // the wide stool (two folded towels lie on it)
  BASKET: [2.75, 1.5],
};
const groundAt = (x, y, ix, iy) => { const [u, v] = PZ.uv(x, y); if (v < -.02) return rgb(84, 70, 70); const a = ((u + 60) % .5), b = ((v + 60) % .5), k = (Math.floor((u + 60) / .5) + Math.floor((v + 60) / .5)) & 1; return (a < .03 || b < .05) ? rgb(170, 190, 200) : k ? rgb(214, 232, 238) : rgb(240, 246, 248); };
function backWall() {
  const S = E.SHOWER;
  PZ.wall(-5, 5, 0, 0, E.WALL, (u, z) => {
    if (u > S.u0 && u < S.u1) {                                                                                         // the shower's corner: darker tiles, a big round head on an arm
      const d = Math.hypot((u - S.head[0]) * 26, (z - S.head[1] + .12) * 22.5);
      if (d < 4.6 && z < S.head[1] - .02) return d > 3.4 ? rgb(120, 126, 140) : ((Math.round((u - S.head[0]) * 26) + Math.round(z * 22.5)) % 2 ? rgb(90, 96, 110) : rgb(176, 182, 196));
      if (Math.abs(u - S.head[0]) < .035 && z >= S.head[1] - .02 && z < S.head[1] + .4) return rgb(150, 156, 170);
      return CS.tiles(u, z, [70, 150, 170]).valueOf() === rgb(244, 248, 248) ? rgb(206, 230, 236) : CS.tiles(u, z, [70, 150, 170]);
    }
    const T = E.TAP_SHOWER, dt = Math.hypot((u - T[0]) * 26, (z - T[1]) * 22.5);                                         // its tap: a round plate with a red and a blue knob
    if (dt < 4.2) return Math.hypot((u - T[0]) * 26 + 1.6, (z - T[1]) * 22.5) < 1.2 ? rgb(226, 80, 70) : Math.hypot((u - T[0]) * 26 - 1.6, (z - T[1]) * 22.5) < 1.2 ? rgb(70, 130, 220) : dt > 3.3 ? rgb(150, 156, 170) : rgb(226, 230, 238);
    const M = E.MIRROR; if (FD.onFrame(u, z, M, .08)) return rgb(...FD.WOOD_L); if (FD.inside(u, z, M)) { const g = (u - M[0]) + (z - M[2]) * .6; return (Math.abs((g % .9) - .3) < .06) ? rgb(250, 252, 255) : rgb(196, 224, 236); }
    const H = E.HEATER;                                                                                                 // the water heater: a white tank with a pipe up from it and a dark gauge (its bars are sprites)
    if (Math.abs(u - H.u) < H.hw && z > H.z0 && z < H.z1) { if (Math.abs(u - H.gauge[0]) < .16 && Math.abs(z - H.gauge[1]) < .22) return rgb(50, 54, 66); return (Math.abs(u - H.u) > H.hw - .04 || z > H.z1 - .06 || z < H.z0 + .06) ? rgb(170, 176, 190) : rgb(246, 248, 250); }
    if (Math.abs(u - H.u + .12) < .03 && z >= H.z1) return rgb(170, 176, 190);
    if (Math.abs(u - H.u - .12) < .03 && z >= H.z1) return rgb(226, 120, 100);
    return CS.doorAt(u, z, E.DOOR, true) || CS.tiles(u, z);
  });
}
function room() {
  const S = E.SHOWER, mid = (S.u0 + S.u1) / 2, hw = (S.u1 - S.u0) / 2;
  PZ.flat(S.u0, .02, S.u1, S.v1, .02, (u, v) => Math.hypot((u - mid) * 26, (v - S.v1 / 2) * 13) < 2.2 ? rgb(90, 96, 110) : (((u + 60) % .25) < .03 || ((v + 60) % .25) < .04) ? rgb(96, 150, 170) : rgb(140, 196, 212));       // the shower's floor, with its drain
  PZ.box(mid, S.v1, 0, S.wall, hw + .06, .07, [70, 150, 170], (s, t, z, face) => face === 'front' ? ((((s + 9) % .3) < .03 || (z % .27) < .035) ? rgb(52, 118, 136) : rgb(86, 166, 186)) : face === 'top' ? rgb(240, 246, 248) : 0);   // the low front wall
  const K = E.SINK;
  PZ.box(K.u, K.v, 0, K.h - .2, K.hw - .12, K.hd - .1, [226, 232, 238]);
  PZ.box(K.u, K.v, K.h - .2, K.h, K.hw, K.hd, [250, 252, 252], (s, t, z, face) => face === 'top' && Math.hypot(s / (K.hw - .1), (t + .02) / (K.hd - .12)) < 1 ? rgb(190, 222, 234) : 0);
  PZ.post(K.u, K.v - K.hd + .08, K.h, K.h + .22, .03, [176, 182, 196]); PZ.box(K.u, K.v - K.hd + .16, K.h + .2, K.h + .25, .03, .1, [176, 182, 196]);    // its tap
  for (const L of [E.SHELF_L, E.SHELF_R]) { const m = (L.u0 + L.u1) / 2, w = (L.u1 - L.u0) / 2; PZ.box(m, L.v1 / 2, L.z - .07, L.z, w, L.v1 / 2, FD.WOOD_L, (s, t, z, face) => face === 'top' ? rgb(236, 214, 170) : rgb(...FD.WOOD)); for (const du of [-w + .12, w - .12]) PZ.wall(m + du - .03, m + du + .03, .02, L.z - .3, L.z - .07, () => rgb(...FD.WOOD)); }
  const T = E.STOOL;
  PZ.box(T.u, T.v, T.h - .08, T.h, T.hw, T.hd, FD.WOOD_L); for (const [a, b] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) PZ.post(T.u + a * (T.hw - .08), T.v + b * (T.hd - .07), 0, T.h - .08, .035, FD.WOOD); PZ.shadow(T.u, T.v, .3, .5);
  const [bx, by] = PZ.xy(E.BASKET[0], E.BASKET[1]); drum(bx, by, 0, .55, .3, [214, 176, 120], (a, b) => Math.hypot(a, b) < .24 ? rgb(250, 246, 236) : 0); castShadow(bx, by, .3, .34);
}
function buildSet() {
  zb.fill(-1e9); pix.fill(0); kinds.fill(0); ground.fill(0); shadowMask.fill(0); staticShadow.fill(0);
  tufts.length = 0; leaves.length = 0; pendingShadows.length = 0; slabTops.length = 0; glowReset();
  for (let iy = 0; iy < H; iy++) for (let ix = 0; ix < W; ix++) {
    const g = unproject(ix + .5, iy + .5), i = iy * W + ix, c = groundAt(g.x, g.y, ix, iy);
    if (!c) continue;
    pix[i] = c; ground[i] = 1; zb[i] = (g.x + g.y) / R2 * COS; kinds[i] = KIND_ROAD;
  }
  groundZ.set(zb);
  part('pared', backWall);
  part('bano', room);
  flushShadows(); pendingShadows.length = 0;
  bakeOcclusion(); joinSlabs(); staticShadow.set(shadowMask); applyShadows(groundZ); shadeEdges();
  lightPass([1.0, .99, .98], [2, 2, 2], false);
  skyFill(() => rgb(30, 24, 30));
  bakedPix.set(pix); bakedZ.set(zb);
}
window.BANO = { SET, E, buildSet };
if (Q.get('tags') === '1') PART_TAGS = new Array(W * H).fill(null);
const t0 = performance.now();
buildSet();
window.BAKE_MS = performance.now() - t0;
function frame(t, casts = []) {
  pix.set(bakedPix); zb.set(bakedZ);
  for (const c of casts) castShadow(c[0], c[1], c[2], c[3]);
  applyShadows(groundZ);
  ctx.putImageData(image, 0, 0);
  return image;
}
frame(SET.t);
window.TAGS = PART_TAGS;
window.DEPTH = { z: bakedZ, OX, OY, S };
window.frame = frame;
</script></body></html>
