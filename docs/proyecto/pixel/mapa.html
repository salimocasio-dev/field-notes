<!doctype html>
<html lang="es" translate="no" class="notranslate"><head><meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#14141F">
<title>Coquí · Mapa</title>
<style>
/* Hybrid, as the UI plan says: only the map is pixel art. Chips, the Today button, the sheet and the tab bar are clean modern UI. */
:root{--bg:#F6F5F1;--ink:#16181D;--mut:#636A75;--line:#E3E1DA;--ok:#1F9D55;--info:#3D5AFE;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;color:var(--ink);font:400 16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overscroll-behavior:none}
body{background:#14141F radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.4px) 0 0/12px 12px}
button{font:inherit;color:inherit}
#mapwrap{display:flex;justify-content:center;padding:calc(60px + env(safe-area-inset-top)) 0 196px}
#c{display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:manipulation;cursor:pointer}
#topchips{position:fixed;top:calc(12px + env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:3;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:16px;background:rgba(255,255,255,.94);font-size:14px;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.3)}
#hoy{position:fixed;left:16px;right:16px;bottom:calc(88px + env(safe-area-inset-bottom));max-width:528px;margin:0 auto;z-index:3}
.play{display:flex;align-items:center;gap:16px;width:100%;min-height:72px;padding:12px 16px;border:0;border-radius:var(--r);background:#fff;text-align:left;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.35)}
.play .ic{flex:none;width:48px;height:48px;border-radius:24px;background:var(--ok);display:flex;align-items:center;justify-content:center}
.play .ic svg{width:24px;height:24px;color:#fff}.grow{flex:1}
.play b{display:block;font-size:18px;line-height:24px}.play span{font-size:14px;color:var(--mut)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:4;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .in{display:flex;max-width:560px;margin:0 auto;height:72px;align-items:stretch}
.tb{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:500;color:var(--mut);cursor:pointer;text-decoration:none}
.tb.on{color:var(--info)}.tb svg{width:24px;height:24px}
.tb.mid .disc{width:56px;height:56px;margin-top:-24px;border-radius:28px;background:var(--info);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(61,90,254,.4);border:4px solid #fff}
.tb.mid .disc svg{width:28px;height:28px;color:#fff}
#sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:8;display:none}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:9;max-width:560px;margin:0 auto;background:#fff;border-radius:24px 24px 0 0;padding:8px 16px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .2s;max-height:80vh;overflow:auto}
#sheet.on{transform:none}#sheet .grab{width:40px;height:4px;border-radius:2px;background:#D5D3CC;margin:4px auto 16px}
#sheet h1{font-size:24px;line-height:32px;font-weight:600;margin:4px 0 4px}
.lab{font-size:12px;font-weight:500;letter-spacing:.02em;color:var(--mut);text-transform:uppercase}
.mut{color:var(--mut)}.small{font-size:14px}
.row{display:flex;align-items:center;gap:16px;min-height:56px}.row+.row{border-top:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 24px;border:0;border-radius:12px;background:var(--ink);color:#fff;font-weight:600;cursor:pointer;text-decoration:none}
</style></head><body>
<div id="topchips"><span class="pill" id="chip"></span></div>
<div id="mapwrap"><canvas id="c" aria-label="Mapa del curso"></canvas></div>
<div id="hoy"></div>
<nav><div class="in" id="tabs"></div></nav>
<div id="sheetbg"></div><div id="sheet"></div>

<script src="curso.js"></script>
<script>window.PP_SCENE = { w: 256, h: 480, s: 8, originY: 36, shadowX: .9, shadowY: -.1 };</script>
<script src="pp-engine.js"></script>
<script src="mapa.js"></script>
<script>
'use strict';
const APP = 'https://salimocasio-dev.github.io/field-notes/historia/';
const L = CURSO.lugares;
const SVG = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const IC = { libro: '<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/>', cartas: '<rect x="7" y="4" width="13" height="16" rx="2"/><path d="M4 7v12a2 2 0 0 0 2 2h10"/>', mapa: '<path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/>',
  mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>', yo: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>', play: '<path d="M8 5v14l11-7z" fill="currentColor"/>' };
document.getElementById('tabs').innerHTML = [['biblioteca', 'Biblioteca', 'libro'], ['palabras', 'Palabras', 'cartas'], ['mapa', 'Mapa', 'mapa'], ['hablar', 'Hablar', 'mic'], ['yo', 'Yo', 'yo']]
  .map(t => t[0] === 'mapa' ? `<span class="tb mid on"><span class="disc">${SVG(IC[t[2]])}</span>${t[1]}</span>` : `<a class="tb" href="${APP}app.html?tab=${t[0]}">${SVG(IC[t[2]])}${t[1]}</a>`).join('');

// demo progress: ?hecho=N marks the first N places done
const N = +(new URLSearchParams(location.search).get('hecho') || 0);
const hecho = L.map((_, k) => k < N);
const abierto = L.map((l, k) => k < N || !!(l.cuentos && l.cuentos.length) || k === N);
const tick = () => { try { navigator.vibrate && navigator.vibrate(8); } catch (e) {} };

const cv = document.getElementById('c');
MAPA.bake();
MAPA.setState({ hecho, abierto, aqui: Math.min(N, 9) });
MAPA.placeFrog(Math.min(N, 9));
function chip() { const l = L[MAPA.FROG.at]; document.getElementById('chip').textContent = l.n + ' · ' + l.nombre; }
function hoy() {
  const l = L[MAPA.FROG.at];
  document.getElementById('hoy').innerHTML = `<button class="play" id="hoyBtn"><span class="ic">${SVG(IC.play)}</span><span class="grow"><span>Aquí</span><b>${l.nombre}</b><span>${l.cuentos ? l.cuentos.length + ' stories' : 'Not built yet'}</span></span></button>`;
  document.getElementById('hoyBtn').onclick = () => { tick(); sheet(MAPA.FROG.at); };
}
chip(); hoy();

function sheet(k) {
  const l = L[k], op = abierto[k];
  const body = l.cuentos && op
    ? l.cuentos.map(c => `<div class="row"><div class="grow"><b>${CURSO.cuentos[c].t}</b><div class="small mut">About ${CURSO.cuentos[c].min} min</div></div><a class="btn" href="${APP}index.html?cuento=${c}&desde=app">Play</a></div>`).join('')
    : `<p class="mut">${op ? 'Not built yet.' : 'Locked until the places before it are done.'}</p><p class="small mut">Scenes: ${l.escenas.join(' · ')}</p>`;
  const s = document.getElementById('sheet');
  s.innerHTML = `<div class="grab"></div><div class="lab">Place ${l.n}${l.fork ? ' · a fork: either place first' : ''}</div><h1>${l.nombre}</h1><p class="mut" style="margin:0 0 8px">${l.en}</p>${body}`;
  s.classList.add('on'); document.getElementById('sheetbg').style.display = 'block';
}
document.getElementById('sheetbg').onclick = () => { document.getElementById('sheet').classList.remove('on'); document.getElementById('sheetbg').style.display = 'none'; };

cv.addEventListener('click', e => {
  MAPA.wakeAudio();
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) * cv.width / r.width, y = (e.clientY - r.top) * cv.height / r.height;
  const k = MAPA.stopAt(x, y);
  if (k < 0 || MAPA.FROG.path) return;
  tick();
  if (abierto[k] && k !== MAPA.FROG.at) MAPA.hopTo(k, () => { chip(); hoy(); sheet(k); });
  else sheet(k);
});

function scale() {
  const dpr = window.devicePixelRatio || 1, k = Math.max(1, Math.floor(Math.min(innerWidth, 560) * dpr / cv.width));
  cv.style.width = cv.width * k / dpr + 'px'; cv.style.height = cv.height * k / dpr + 'px';
}
scale(); addEventListener('resize', scale);
// open on the frog
requestAnimationFrame(() => { const { x, y } = MAPA.XY(...MAPA.PADS[MAPA.FROG.at]), p = MAPA.project(x, y, 0), r = cv.getBoundingClientRect(); scrollTo(0, Math.max(0, r.top + scrollY + p.sy * r.height / cv.height - innerHeight * .45)); });
let last = performance.now();
function frame(now) { MAPA.tick(Math.min(.05, (now - last) / 1000)); last = now; requestAnimationFrame(frame); }
requestAnimationFrame(frame);
</script>
</body></html>
