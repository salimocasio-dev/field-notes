<script>
'use strict';
/* El camino: the path into the park (place 2, El parque), as a set on the Pixel Plays engine (order 33a).
   The park is in the same town as abuela's house: the same lawn (El frente's GRASS ramp, calm, as El patio has it), the same day sky, hills
   and sun as El frente, the same light and scale (S 26, the engine's 30 degree camera, shadows to screen right).
   The layout stands on the world's axes, every place on the ground at its old screen point (camino-sheet.json rules.floor):
     the path: it comes in from the picture's left edge along +x (down to the right on the screen) through the park's arch, turns at the
       first mark (the old MARCA[0], screen 66, 182) and climbs along -y (up to the right) over the stones (MARCA[1] to [7]), bends a little
       flatter after the fourth and goes on past the big tree off the picture's right edge;
     the arch (el portón): two stone posts and an iron arch over the path's first leg, its opening facing +x (whoever leaves goes up the
       path through it and on off the picture's left edge);
     the three small trees at their old feet (ARBOL), free-standing round trees; the bench (el banco) on the path's far side, its long side
       along y (parallel to the path's climb), facing the path; the big tree (el árbol grande) at the picture's right, by the path's far end,
       its broad crown running off the picture's right and top edges as the old one's did (round 2).
   The state comes from the address; these become the builder's setKey:
     gran   = 1 | 0          !W.sinGran: the big tree (story 13 is at the other end of the path: no big tree; the path goes on the same)
     t      = wind time in seconds (0 for the reference); ox, oy = the origin (defaults are El camino's)
     trees  = old | row      a look candidate, not a state: row stands the three small trees on one line along -y through the middle one
                             (the brief's "a row of trees runs along a world axis"); the sheet is made for old (see the report)
   It draws one frame: the baked set, then drawLeaves(t) and drawTufts(t). No characters. */
const Q = new URLSearchParams(location.search);
const pick = (k, allowed, def) => { const v = Q.get(k); return allowed.includes(v) ? v : def; };
const SET = {
  gran: pick('gran', ['0', '1'], '1') === '1',
  trees: pick('trees', ['old', 'row'], 'old'),
  t: +(Q.get('t') || 0),
};
window.PP_SCENE = { w: 240, h: 216, s: 26, originX: +(Q.get('ox') || 0), originY: +(Q.get('oy') || 4), shadowX: .9, shadowY: -.1 };
</script>
<script src="pp-engine.js"></script>
<script src="mapa.js"></script>
<script src="set-kit.js"></script>
<script>
'use strict';
/* ---------- the plan: every thing placed from its old screen point (the ground under it) ----------
   With origin (0, 4) a ground point (x, y) is on the screen at (120 + 18.385 (x - y), 112 + 9.192 (x + y)); a height z lifts it 22.5 rows.
   +x runs down to the right on the screen, -y up to the right. Gs(sx, sy): the ground point under a screen point */
const Gs = (sx, sy) => { const g = unproject(sx, sy); return [g.x, g.y, 0]; };
const P = (x, y, z = 0) => [x, y, z];
const SCR = (x, y, z = 0) => { const p = project(x, y, z); return [p.sx, p.sy]; };
// the marks on the path (the old MARCA: 0 the arch's end of the path, 1 to 7 the stones, 8 before the big tree)
const MARCA = [[66, 182], [79, 175], [92, 168], [105, 162], [118, 156], [131, 151], [144, 146], [157, 142], [170, 139]];
// the three small trees (their feet) and the big tree. Round 2: the big tree is built like the old one, a big old tree at the picture's right:
// its foot 4 px right of the old GRAN (200, 128) and 25 rows further back, the whole trunk inside the wide view: the frog with the basket at the
// walk's start (enT(1)) and Canelo at the last mark (perroEn(8), capped at x 188: sheet moves) stand before it, lawn between them and its foot
const ARBOL_OLD = [[70, 120], [112, 116], [154, 112]];
const ARBOL = SET.trees === 'row' ? [[70, 137], [112, 116], [154, 95]] : ARBOL_OLD;
const GRAN = [204, 103];
const HZ = 100;
const SMALL_CROWN_W = 2 * 15.6;                                       // a small crown's width (px, its clusters' middles)                                                       // the horizon (screen row): the old picture's
const WOOD = [150, 98, 56], TRUNK = [118, 82, 50], IRON = [64, 66, 82], STONEP = [190, 178, 156];

/* ---------- the path ---------- */
// the arch over the path's first leg: its middle on the ground at screen (48, 173) (the cat sits there, d-corre: in the old picture between
// the old gate's posts); the path's first leg runs along +x from beyond the arch to mark 0, then along the marks
// round 2: its middle at screen (37, 167.5), its posts .55 either side (on the screen 20 px apart, their opening 17 px clear: the old gate's
// was 20): the far post (B, up to the right) left of the first tree's box (x 51) and clear of the frog at mark 1, the near one (A) inside the view
const AC = Gs(37, 167.5);
const AH = .55, APW = .08, APH = 2.62, ARISE = .36;                    // the posts at AC +- AH in y (their half width APW, height APH); the arch's rise
const PATH_PTS = (() => {
  const m = MARCA.map(p => Gs(p[0], p[1]));
  const far = [AC[0] - 4, AC[1], 0];                                  // off the picture's left edge
  const d = [m[8][0] - m[7][0], m[8][1] - m[7][1]], l = Math.hypot(d[0], d[1]);
  const end = [m[8][0] + d[0] / l * 5, m[8][1] + d[1] / l * 5, 0];   // on past the big tree, off the picture's right edge
  return [far, AC, ...m, end];
})();
const PATH_HALF = .6;                                                // its half width (the frog walks at its far edge, Carmen on the lawn on our side)
// distance (world) from a ground point to the path's middle line, and how far along it
function pathDist(x, y) {
  let best = 1e9;
  for (let k = 0; k + 1 < PATH_PTS.length; k++) {
    const a = PATH_PTS[k], b = PATH_PTS[k + 1], dx = b[0] - a[0], dy = b[1] - a[1], l = dx * dx + dy * dy;
    const t = clamp(((x - a[0]) * dx + (y - a[1]) * dy) / l, 0, 1), d = Math.hypot(x - a[0] - dx * t, y - a[1] - dy * t);
    if (d < best) best = d;
  }
  return best;
}
// the stones: flat, worn, grey, at marks 1 to 7 (as the old), a little longer across the path than along it
const STONES = MARCA.slice(1, 8).map(p => Gs(p[0], p[1]));
const STONE_R = .3;

/* ---------- the ground: the lawn (El frente's grass, calm, as El patio's) and the path ---------- */
const LAWN = GRASS, LAWN_T = 3.45, BLADE = [2, 2, 3, 3, 4];
for (let k = 0; k < 5; k++) { const c = LAWN[BLADE[k]]; tuftLit[k] = rgb(...c); tuftDark[k] = rgb(c[0] * .54, c[1] * .52, c[2] * .72); }
const lawnAt = (x, y, ix, iy) => { const t = LAWN_T + (noise(x * .3, y * .3) - .5) * .6 + (bayerAt(ix, iy) - .5) * .8 + (hash(ix, iy) - .5) * .25;
  return rgb(...LAWN[clamp(Math.floor(t), 2, 4)]); };
// trodden earth, the old path's colours (#E8CE96, the specks #D8B67A, the edge #C8A468), worn lighter down its middle
const PATHC = [[184, 150, 96], [200, 164, 104], [216, 182, 122], [232, 206, 150], [242, 222, 172]];
function caminoGround(x, y, ix, iy, i) {
  if (iy + .5 < HZ) return 0;                                          // above the horizon: the hills and the sky
  const d = pathDist(x, y);
  if (d < PATH_HALF) {
    kinds[i] = KIND_ROAD;
    const e = PATH_HALF - d;
    // round 2: the edge is soft earth, ragged into the lawn (round 1's darker line read as a kerb under the arch's post shadow)
    if (e < .09 && bayerAt(ix, iy) > e / .09 + (hash(ix, iy) - .5) * .3) { kinds[i] = KIND_GRASS; return lawnAt(x, y, ix, iy); }
    const t = 2.75 + (e > .25 ? .35 : 0) + (noise(x * 1.7, y * 1.7) - .5) * .9 + (bayerAt(ix, iy) - .5) * .7 + (hash(ix, iy) - .5) * .3;
    return rgb(...PATHC[clamp(Math.floor(t), 2, 4)]);
  }
  kinds[i] = KIND_GRASS;
  return lawnAt(x, y, ix, iy);
}
// the stones, on the path: low slabs (a lit top, a dark rim on their near side), drawn after the ground
function stones() {
  const R = rampOf([176, 168, 150]);
  part('camino', () => {
    for (const [sx, sy] of STONES.map(s => SCR(s[0], s[1]))) {
      // an oval on the screen 13 x 6, its middle at the mark: the world points under it, raised .05
      for (let iy = Math.floor(sy - 4); iy <= Math.ceil(sy + 4); iy++) for (let ix = Math.floor(sx - 8); ix <= Math.ceil(sx + 8); ix++) {
        const dx = (ix + .5 - sx) / 6.5, dy = (iy + .5 - sy) / 3, q = dx * dx + dy * dy;
        if (q > 1) continue;
        const g = unproject(ix + .5, iy + .5 + .05 * COS * S);
        const top = dy < .35 - .25 * dx;
        const col = q > .72 && dy > 0 ? R[0] : top ? R[clamp(Math.floor(3.1 - dy * 1.2 + (hash(ix, iy) - .5) * .7 + (bayerAt(ix, iy) - .5) * .5), 1, 4)] : R[2];
        plot(g.x, g.y, .05, col);
      }
    }
  });
}

/* ---------- the arch ---------- */
// two square stone posts with caps, an iron arch between their tops (a half ellipse in the plane x = AC[0]), a small iron ball on each cap
function arch() {
  part('porton', () => {
    const [ax, ay] = AC, Sp = rampOf(STONEP), Ir = rampOf(IRON);
    for (const s of [1, -1]) {
      const py = ay + s * AH;
      block(ax - APW, py - APW, 0, ax + APW, py + APW, APH, STONEP, STONEP.map(v => v * 1.08));
      block(ax - APW - .02, py - APW - .02, APH, ax + APW + .02, py + APW + .02, APH + .1, STONEP.map(v => v * .96), STONEP.map(v => Math.min(255, v * 1.12)));
      sphere(ax, py, APH + .19, .085, STONEP, 'solid');                       // a stone ball on each cap
      block(ax - APW - .01, py - APW - .01, 0, ax + APW + .01, py + APW + .01, .22, STONEP.map(v => v * .8));   // a darker plinth at the foot
    }
    // the iron arch: a band .07 thick rising ARISE over the posts' tops, from one cap to the other, a second, thinner one under it, and a
    // straight bar across from cap to cap: an archway (round 1's single band read as a lamp's hook)
    const band = (rise, z0, th, lit) => { for (let t = 0; t <= 1; t += .0015) { const a = Math.PI * t, yy = ay + AH * Math.cos(a), zz = z0 + rise * Math.sin(a);
      for (let w = -.035; w <= .035; w += .012) for (let h = 0; h <= th; h += .012) plot(ax + w, yy, zz + h, Ir[h > th - .02 ? lit : w > 0 ? 1 : 2]); } };
    band(ARISE, APH + .1, .08, 4); band(ARISE * .55, APH + .1, .05, 3);
    for (let yy = ay - AH; yy <= ay + AH; yy += .01) for (let w = -.03; w <= .03; w += .012) for (let h = 0; h <= .06; h += .012) plot(ax + w, yy, APH + .04 + h, Ir[h > .04 ? 3 : 1]);
    // short iron bars between the two arcs
    for (const t of [.2, .35, .5, .65, .8]) { const a = Math.PI * t, yy = ay + AH * Math.cos(a), z0 = APH + .1 + ARISE * .55 * Math.sin(a), z1 = APH + .1 + ARISE * Math.sin(a);
      for (let z = z0; z <= z1; z += .01) for (let w = -.02; w <= .02; w += .012) plot(ax + w, yy, z, Ir[1]); }
    // round 2: a small green board hangs under the arch's top, in its plane (the park's sign, no words: round 1's bare iron read as a hook)
    { const bw = .26, bz0 = APH + .1 + ARISE * .55 - .26, bz1 = bz0 + .2, G = rampOf([70, 140, 80]);
      for (let yy = ay - bw; yy <= ay + bw; yy += .01) for (let zz = bz0; zz <= bz1; zz += .01) { const edge = Math.abs(yy - ay) > bw - .035 || zz < bz0 + .03 || zz > bz1 - .03;
        plot(ax + .04, yy, zz, edge ? rampOf([236, 226, 190])[3] : G[(Math.floor((yy + zz * 3) * 40) % 7 === 0) ? 3 : 2]); }
      for (const yy of [ay - bw + .06, ay + bw - .06]) for (let zz = bz1; zz <= APH + .1 + ARISE * .55; zz += .01) plot(ax + .04, yy, zz, Ir[1]); }
    // its shadow: the two posts' and the top's (the arches, the bar, the board), falling to the right as the trees' (round 2: round 1 cast only
    // the posts', two long strips along the path's edge that read as a kerb)
    for (const s of [1, -1]) for (let z = .05; z <= APH + .1; z += .1) castShadow(ax, ay + s * AH, z, .1, 1, 0);
    for (let t = 0; t <= 1; t += .02) { const a = Math.PI * t, yy = ay + AH * Math.cos(a); castShadow(ax, yy, APH + .1 + ARISE * Math.sin(a), .05, 1, 0); castShadow(ax, yy, APH + .07, .045, 1, 0); }
  });
}

/* ---------- the small trees: a straight trunk, a round crown of leaf clusters (still: at their height the wind moves none of them a pixel) ---------- */
// the crown's middle on the screen 30 rows over the foot (the old ell(x, y - 30, 16, 13)), as wide and as tall as the old
const LEAF = [[52, 128, 66], [66, 148, 76], [86, 170, 88], [118, 196, 108]];
function smallTree(i) {
  const [sx, sy] = ARBOL[i], [fx, fy] = Gs(sx, sy);
  part('arbol' + i, () => {
    const zc = 30 / (COS * S);
    capsule([fx, fy, 0], [fx, fy, zc - .1], .11, .08, () => TRUNK, 'rough');
    capsule([fx - .12, fy + .12, 0], [fx + .12, fy - .12, 0], .07, .07, () => TRUNK, 'rough');
    for (let z = .03; z < zc; z += .08) castShadow(fx, fy, z, .14, 1, 0);   // round 2: the trunk's shadow in one piece from its foot to the crown's
    // the crown: an ellipsoid of clusters, 16 px across (u), 13 rows (z) round the middle, a little deep in v
    const ru = 15.6 / S, rz = 12.6 / (COS * S), rv = .5;
    const n = 80;
    for (let k = 0; k < n; k++) {
      const h = (a, b) => hash(k * 13 + i * 101 + a, b);
      const th = h(1, 7) * 6.283, ph = Math.acos(2 * h(2, 8) - 1), d = Math.cbrt(h(3, 9)) * .88;
      const du = Math.cos(th) * Math.sin(ph) * d, dv = Math.sin(th) * Math.sin(ph) * d, dz = Math.cos(ph) * d;
      const u = (fx - fy) / R2 + du * ru, v = (fx + fy) / R2 + dv * rv, z = zc + dz * rz;
      const tone = h(4, 10) * .6 + dz * .5 - du * .25 + .3;
      const col = LEAF[tone > 1 ? 3 : tone > .62 ? 2 : tone > .25 ? 1 : 0];
      sphere(...UVW(u, v, z), .16 + h(5, 11) * .1, col, 'rough');
    }
    // the crown's shadow on the lawn (to its right, as the trunk's)
    castShadow(fx, fy, zc, .55, 1, .5);
  });
}

/* ---------- the bench: on the path's far side, its long side along y (parallel to the path's climb), facing the path (+x); the cat sits on it ----------
   Round 2: a plain bench of three planks on four legs, no back (round 1 had a back and stood where the frog walks over the marks: at mark 4 he
   stood in it). Round 2: its front left corner on the ground at screen (86, 146) (round 1: 100, 141), 14 px left along the path and 5 rows
   lower: whatever sits on it (the cat, the bird) is left of the middle tree's trunk; the first tree's shadow is kept off the patch of lawn behind
   the seat (benchBackdrop), so that whatever sits there has lit lawn behind it; the frog at marks 2 to 4 has 5 rows of lawn and more before it;
   its seat under the small trees' boxes */
const BENCH = (() => { const fl = Gs(86, 146), hl = .55, a0 = -.24, a1 = .24; return { cx: fl[0] - a1, cy: fl[1] - hl, hl, a0, a1, zs: .4 }; })();
// round 2: the lawn right behind the seat, where whatever sits on the bench is seen against it, takes no tree's shadow: from the seat's back edge
// up 26 rows, between its two ends (3 px wider each side) (the first tree's crown shadow fell there: the cat and the bird sat against a dark oval)
function benchBackdrop() {
  const B = BENCH, a = project(B.cx + B.a0, B.cy + B.hl, 0), b = project(B.cx + B.a0, B.cy - B.hl, 0), f = project(B.cx + B.a1, B.cy + B.hl, 0);
  for (let ix = Math.floor(Math.min(f.sx, a.sx)) - 4; ix <= Math.ceil(b.sx) + 4; ix++) { const t = (ix + .5 - a.sx) / (b.sx - a.sx), edge = a.sy + (b.sy - a.sy) * clamp(t, 0, 1);
    for (let iy = Math.floor(edge - 27); iy <= Math.ceil(edge + 4); iy++) if (ix >= 0 && iy >= 0 && ix < W && iy < H) shadowMask[iy * W + ix] = 0; }
}
function bench() {
  const B = BENCH, LEG = [92, 60, 36];
  part('banco', () => {
    const { cx, cy, hl, a0, a1, zs } = B;
    // the legs: a pair at each end, and a stretcher between each pair
    for (const b of [hl - .07, -hl + .07]) { for (const a of [a1 - .06, a0 + .06]) block(cx + a - .035, cy + b - .035, 0, cx + a + .035, cy + b + .035, zs - .05, LEG);
      block(cx + a0 + .06, cy + b - .025, .1, cx + a1 - .06, cy + b + .025, .16, LEG); }
    // the seat: three planks along y, a dark gap between them, each a step lighter towards the front
    const pw = (a1 - a0) / 3;
    for (let k = 0; k < 3; k++) { const s0 = a0 + k * pw, s1 = s0 + pw - .03;
      block(cx + s0, cy - hl, zs - .06, cx + s1, cy + hl, zs, WOOD, WOOD.map(v => Math.min(255, v * (1.12 + k * .05)))); }
    // its shadow on the lawn
    for (let b = -hl; b <= hl; b += .2) castShadow(cx, cy + b, zs, .22);
  });
}

/* ---------- the big tree (round 2): built like the old one, a big old tree at the picture's right ----------
   A thick trunk (twice a small one's and more), a broad crown centred over it (more than twice a small crown's width), lobed and leafed as the
   small ones (the same clusters, the same greens) so that it is the same kind of tree, bigger and older; no limb shows outside the leaves. Its
   crown runs off the picture's right and top edges, as the old one's did (sheet things.grande.hintBox: the part of its box its hint frame
   can show). Its leaves sway (they are high: the wind moves them a pixel). Kept clear of the third small tree's crown and box and of every
   bird's place: no cluster grows left of BIG_CLIP[0] below row BIG_CLIP[1], left of BIG_CLIP[2], or below row BIG_CLIP[3] */
const BIG_LOBES = [[205, 28, 30, 24, 420], [178, 26, 14, 12, 90], [188, 48, 11, 10, 60], [229, 46, 13, 12, 60], [201, 3, 22, 12, 90]];
const BIG_CLIP = [174, 64, 160, 72];   // no cluster left of x 174 reaches below row 64 (the third small tree's box), none left of 160, none below row 72
const BIG_R = .37;                                                    // the trunk's radius at its foot (a small one's .11)
function bigTree() {
  if (!SET.gran) return;
  const [fx, fy] = Gs(GRAN[0], GRAN[1]), tu = (fx - fy) / R2, tv = (fx + fy) / R2, Pu = (u, v, z = 0) => UVW(u, v, z);
  const TOP = (GRAN[1] - 36) / (COS * S);
  part('grande', () => {
    capsule(Pu(tu, tv, 0), Pu(tu, tv, TOP), BIG_R, .27, () => TRUNK, 'rough');
    capsule(Pu(tu - .38, tv, 0), Pu(tu + .38, tv, 0), .2, .2, () => TRUNK, 'rough');           // the flare of its roots
    // its limbs, hidden in the crown (none pokes out: the sheet checks)
    capsule(Pu(tu, tv, TOP - .4), Pu(tu - .6, tv - .1, TOP + .5), .17, .12, () => TRUNK, 'rough');
    capsule(Pu(tu, tv, TOP - .4), Pu(tu + .55, tv - .1, TOP + .55), .17, .12, () => TRUNK, 'rough');
    // its shadow, one piece from its foot: the trunk's, cast all the way up (the crown's falls off the picture to the right)
    for (let z = .03; z < TOP + .6; z += .08) castShadow(...Pu(tu, tv).slice(0, 2), z, .3, 1, 0);
    const UX = sx => (sx - OX) / S, cv = tv - .1, SYv = (v, z = 0) => OY + (v * SIN - z * COS) * S;
    let n = 0;
    for (const [sx, sy, rx, ry, count] of BIG_LOBES) {
      const cu = UX(sx), cz = (SYv(cv) - sy) / (COS * S), ru = rx / S, rz = ry / (COS * S);
      for (let k = 0; k < count; k++, n++) {
        const h = (a, b) => hash(n * 13 + 977 + a, b);
        const th = h(1, 7) * 6.283, ph = Math.acos(2 * h(2, 8) - 1), d = Math.cbrt(h(3, 9)) * .9;
        const du = Math.cos(th) * Math.sin(ph) * d, dv = Math.sin(th) * Math.sin(ph) * d, dz = Math.cos(ph) * d;
        const pu = cu + du * ru, pv = cv + dv * .7, pz = cz + dz * rz;
        const tone = h(4, 10) * .6 + dz * .5 - du * .25 + .3;
        const col = LEAF[tone > 1 ? 3 : tone > .62 ? 2 : tone > .25 ? 1 : 0];
        const r = .17 + h(5, 11) * .11, c = project(...Pu(pu, pv, pz)), rp = r * S;
        if ((c.sx - rp < BIG_CLIP[0] && c.sy + rp > BIG_CLIP[1]) || c.sx - rp < BIG_CLIP[2] || c.sy + rp > BIG_CLIP[3]) continue;
        capture = [];
        sphere(...Pu(pu, pv, pz), r, col, 'rough');
        // k odd: no shadow each frame (the crown's shadow falls off the picture)
        leaves.push({ x: Pu(pu, pv)[0], y: Pu(pu, pv)[1], z: pz, k: n * 2 + 1, r: .3, pixels: capture });
        capture = null;
      }
    }
  });
}

/* ---------- the sky, the hills, the sun: El frente's by day ---------- */
const SKY = { bands: [[58, 134, 230], [85, 159, 242], [120, 186, 250], [162, 211, 255], [208, 234, 255]], far: [[116, 180, 162], [156, 208, 188], [94, 158, 144]], near: [[78, 158, 94], [124, 203, 122], [62, 136, 80]], sun: [[220, 150, 30], [248, 200, 56], [255, 224, 112], [255, 244, 176]] };
// round 2: the sun in the upper LEFT of the sky (every shadow falls to the right), whole inside the wide view and clear of every crown; the old
// picture's three clouds back in the sky (El patio's way), each moved where it is clear of the sun and of the crowns (the old: 36, 16; 112, 9; 168, 26)
const SUN = [44, 24, 9];
const CLOUDS = [[90, 15, 1], [128, 6, .7], [124, 42, .8]];
const cloudAt = (ix, iy) => { for (const [cx, cy, s] of CLOUDS) {
    const e = (x0, y0, rx, ry) => { const dx = (ix + .5 - x0) / rx, dy = (iy + .5 - y0) / ry; return dx * dx + dy * dy <= 1; };
    if (e(cx, cy, 13 * s, 5 * s) || e(cx - 9 * s, cy + 2, 8 * s, 4 * s) || e(cx + 10 * s, cy + 2, 9 * s, 4 * s)) return rgb(...(iy + .5 > cy + 2 * s ? [214, 230, 248] : [244, 248, 255])); }
  return 0; };

/* ---------- bake one state ---------- */
let GROUND_CACHE = null;
function buildSet() {
  zb.fill(-1e9); pix.fill(0); kinds.fill(0); ground.fill(0); shadowMask.fill(0); staticShadow.fill(0);
  tufts.length = 0; leaves.length = 0; pendingShadows.length = 0; slabTops.length = 0; glowReset();
  if (!GROUND_CACHE) {
    for (let iy = 0; iy < H; iy++) for (let ix = 0; ix < W; ix++) {
      const g = unproject(ix + .5, iy + .5), i = iy * W + ix, c = caminoGround(g.x, g.y, ix, iy, i);
      if (!c) continue;
      pix[i] = c; ground[i] = 1; zb[i] = (g.x + g.y) / R2 * COS;
    }
    growGrass();
    GROUND_CACHE = { pix: pix.slice(), zb: zb.slice(), kinds: kinds.slice(), ground: ground.slice(), tufts: tufts.slice() };
  } else {
    pix.set(GROUND_CACHE.pix); zb.set(GROUND_CACHE.zb); kinds.set(GROUND_CACHE.kinds); ground.set(GROUND_CACHE.ground); tufts.push(...GROUND_CACHE.tufts);
  }
  groundZ.set(zb);
  stones(); arch(); for (let i = 0; i < 3; i++) smallTree(i); benchBackdrop(); bench(); bigTree();
  flushShadows(); pendingShadows.length = 0;
  bakeOcclusion(); staticShadow.set(shadowMask); applyShadows(groundZ); shadeEdges();
  skyFill((ix, iy) => {
    const s = skyDisc(SUN[0], SUN[1], SUN[2], SKY.sun, ix, iy); if (s) return s;
    const c = cloudAt(ix, iy); if (c) return c;
    return skyHills(HZ, SKY.far, SKY.near, ix, iy) || skyBands(SKY.bands, 0, HZ, ix, iy);
  });
  bakedPix.set(pix); bakedZ.set(zb);
}

/* ---------- for the sheet ---------- */
// the cat on the bench: its place (x, y as camino.js animal draws it, its lowest pixels on row y + 1) on the seat; the bench's entry in the sorted
// list (sheet front.banco) just before it. The bird on the bench (avebanco, drawn 15 x 12 from x, y): its feet on the backrest's top rail
// round 2: the cat on the seat's middle, a little to its front (the story files' 113, 134 -> remap); the bird on the seat's back plank
const SEAT_MID = project(BENCH.cx, BENCH.cy, BENCH.zs), SEAT_BACK = project(BENCH.cx + BENCH.a0 + .08, BENCH.cy, BENCH.zs);
const CAT_BENCH = [Math.round(SEAT_MID.sx), Math.round(SEAT_MID.sy) - 1], BENCH_SORT = 134.5, BENCH_SCREEN = (() => { const p = project(BENCH.cx, BENCH.cy, 0); return [Math.round(p.sx), Math.round(p.sy)]; })();
const CAT_BENCH_V = (BENCH.cx + BENCH.a1 + BENCH.cy + BENCH.hl) / R2;   // the cat on the bench: the depth of the seat's nearest corner (sheet front: its plane, so nothing of the bench goes over it)
const AVEB = [Math.round(SEAT_BACK.sx) - 7, Math.round(SEAT_BACK.sy) - 11];
const ARBOL0_Q = [49, 121];   // the frog's place at the first small tree (LUGAR.arbol0), clear of the arch's far post (every hop count the old one)
// the seat's top seen: its slats' top faces, sampled, the pixels where they are what the picture shows
function seatSeen() { const B = BENCH, seen = new Set();
  for (let a = B.a0 + .01; a <= B.a1 - .01; a += .01) for (let b = -B.hl + .01; b <= B.hl - .01; b += .01) { const p = project(B.cx + a, B.cy + b, B.zs), ix = p.sx | 0, iy = p.sy | 0, i = iy * W + ix;
    if (Math.abs(bakedZ[i] - p.d) < .02) seen.add(i); }
  return seen.size; }
window.CAMINO_SET = { SET, MARCA, ARBOL, ARBOL_OLD, GRAN, HZ, AC, AH, APW, APH, ARISE, PATH_PTS, PATH_HALF, STONES, STONE_R, BENCH, BIG_LOBES, BIG_CLIP, BIG_R, SMALL_CROWN_W, SUN, CLOUDS, OXY: [OX, OY],
  CAT_BENCH, CAT_BENCH_V, BENCH_SORT, BENCH_SCREEN, AVEB, ARBOL0_Q, buildSet };

if (Q.get('tags') === '1') PART_TAGS = new Array(W * H).fill(null);
const t0 = performance.now();
buildSet();
window.BAKE_MS = performance.now() - t0;
CAMINO_SET.SEAT_PX = seatSeen();
function frame(t, casts = []) {
  pix.set(bakedPix); zb.set(bakedZ);
  const windT = STILL ? 0 : Math.floor(t * WIND_FPS) / WIND_FPS;
  drawLeaves(windT); drawTufts(windT);
  for (const c of casts) castShadow(c[0], c[1], c[2], c[3]);
  applyShadows(groundZ);
  ctx.putImageData(image, 0, 0);
  return image;
}
frame(SET.t);
if (PART_TAGS) tagLeaves(zb);
window.TAGS = PART_TAGS;
window.DEPTH = { z: bakedZ, OX, OY, S, live: () => zb };
window.frame = frame;
</script></body></html>
