<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#000}canvas{image-rendering:pixelated}</style></head><body>
<canvas id="c"></canvas>
<script>
'use strict';
/* La sala, de día: the living room in the afternoon (place 9, scene 3), as a set on the Pixel Plays engine. A NEW scene.
   Laid out square to the picture, in u, v. The back wall faces us at v = 0: a wall clock (no hands), a window with the afternoon sun,
   a shelf of books, the kitchen's door at the far right. At the left a desk with a computer at its left end (its screen faces us) and a
   chair behind its right end. In the middle a low table with two cushions along its far side. At the right an armchair that faces us,
   with a small table at its left.
   One state. It draws one frame: the baked set. No people, no book, no pad, no telephone, no album. */
const Q = new URLSearchParams(location.search);
const pick = (k, allowed, def) => { const v = Q.get(k); return allowed.includes(v) ? v : def; };
const on = (k, def = 0) => (Q.get(k) === null ? def : +(Q.get(k) === '1'));
const SET = { hora: 'tarde', pantalla: on('pantalla'), t: +(Q.get('t') || 0) };
const ORIGIN = [0, -42];
window.PP_SCENE = { w: +(Q.get('pw') || 240), h: +(Q.get('ph') || 216), s: 26, originX: +(Q.get('ox') || ORIGIN[0]), originY: +(Q.get('oy') || ORIGIN[1]), shadowX: .9, shadowY: -.1 };
</script>
<script src="pp-engine.js"></script>
<script src="mapa.js"></script>
<script src="set-kit.js"></script>
<script src="calle-base.js"></script>
<script src="plaza-base.js"></script>
<script src="fonda-base.js"></script>
<script src="casa-base.js"></script>
<script>
'use strict';
const E = {
  WALL: 3.1,
  CLOCK: [-2.2, 2.3],
  WINDOW: [-1.2, .5, 1.3, 2.45],
  SHELF: { u0: 1.15, u1: 2.45, h: 2.0, hd: .2 },                      // the shelf of books, against the wall
  DOOR: [2.85, 3.62, 0, 2.15],
  DESK: { u: -2.7, v: 1.6, hw: .9, hd: .36, h: .72 },                 // the desk; its chair is behind its right end
  SCREEN: { u: -3.1, hw: .32, z0: .82, z1: 1.36 },                    // the computer's screen (on the desk's left end, at the desk's v - .1)
  DESKSEAT: [-2.3, .95],                                              // the chair behind the desk (seat top z .44)
  LOW: { u: .2, v: 4.3, hw: 1.3, hd: .5, h: .4 },                     // the low table
  CUSHIONS: [[-.4, 3.5], [.8, 3.5]],                                  // cojin1, cojin2 (their tops are z .12)
  ARMCHAIR: [2.75, 2.7],                                              // abuelo's armchair (seat top z .44)
  SIDE: { u: 1.6, v: 2.85, r: .36, h: .55 },                          // the small table at its left
};
const groundAt = (x, y, ix, iy) => { const [u, v] = PZ.uv(x, y); return v < -.02 ? rgb(84, 70, 70) : CS.boards(u, v, ix, iy, [210, 170, 120]); };
function backWall() {
  const B = E.SHELF;
  PZ.wall(-5, 5, 0, 0, E.WALL, (u, z) => CS.windowAt(u, z, E.WINDOW, 'tarde') || CS.clockAt(u, z, E.CLOCK[0], E.CLOCK[1]) || CS.doorAt(u, z, E.DOOR, true) || CS.paint(u, z, [236, 222, 190]));
  const m = (B.u0 + B.u1) / 2, w = (B.u1 - B.u0) / 2;
  PZ.box(m, B.hd, 0, B.h, w, B.hd, FD.WOOD, (s, t, z, face) => {                                                         // the shelf of books: four rows of spines
    if (face !== 'front') return face === 'top' ? rgb(...FD.WOOD_L) : 0;
    if (Math.abs(s) > w - .06 || z < .08) return 0;
    const row = Math.floor((z - .08) / .48), zz = (z - .08) % .48; if (zz > .4) return 0;
    const k = Math.floor((s + w) / .11), hgt = .26 + hash(k * 3, row * 7) * .12; if (zz > hgt) return rgb(96, 66, 44);
    return rgb(...[[196, 70, 60], [70, 110, 170], [236, 190, 90], [86, 150, 110], [150, 96, 150], [240, 236, 226]][(k * 5 + row * 3) % 6]);
  });
  PZ.shadow(m, B.hd + .2, .6, .6);
}
function room() {
  const D = E.DESK, C = E.SCREEN;
  FD.chair(E.DESKSEAT[0], E.DESKSEAT[1]);
  PZ.box(D.u, D.v, D.h - .08, D.h, D.hw, D.hd, FD.WOOD_L); for (const [a, b] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) PZ.post(D.u + a * (D.hw - .08), D.v + b * (D.hd - .07), 0, D.h - .08, .045, FD.WOOD);
  PZ.box(D.u, D.v + D.hd - .04, .3, D.h - .08, D.hw, .03, FD.WOOD);                                                      // its front panel
  PZ.box(C.u, D.v - .1, D.h, C.z0, .1, .06, [70, 74, 86]);                                                              // the computer: a foot, a screen that faces us, a keyboard
  PZ.box(C.u, D.v - .1, C.z0, C.z1, C.hw, .04, [70, 74, 86], (s, t, z, face) => face === 'front' && Math.abs(s) < C.hw - .05 && z > C.z0 + .05 && z < C.z1 - .05 ? (SET.pantalla ? rgb(150, 220, 250) : rgb(40, 46, 60)) : 0);
  PZ.box(C.u, D.v + .14, D.h, D.h + .04, .26, .09, [200, 204, 214]);
  for (let du = -D.hw; du <= D.hw; du += .3) PZ.shadow(D.u + du, D.v, .5, .4);
  const L = E.LOW;
  for (const [cu, cv] of E.CUSHIONS) { PZ.box(cu, cv, 0, .12, .36, .3, [226, 120, 90], (s, t, z, face) => face === 'top' ? rgb(240, 150, 110) : 0); }
  PZ.box(L.u, L.v, L.h - .08, L.h, L.hw, L.hd, FD.WOOD_L, (s, t, z, face) => face === 'top' ? shade(FD.WOOD_L, 3.3, s, t, .1) : 0); for (const [a, b] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) PZ.post(L.u + a * (L.hw - .1), L.v + b * (L.hd - .1), 0, L.h - .08, .05, FD.WOOD);
  for (let du = -L.hw; du <= L.hw; du += .3) PZ.shadow(L.u + du, L.v, .3, .5);
  CS.armchair(E.ARMCHAIR[0], E.ARMCHAIR[1], [110, 140, 96]);
  const [sx, sy] = PZ.xy(E.SIDE.u, E.SIDE.v); drum(sx, sy, 0, E.SIDE.h - .06, .05, FD.WOOD); drum(sx, sy, E.SIDE.h - .06, E.SIDE.h, E.SIDE.r, FD.WOOD_L); castShadow(sx, sy, .4, .4);
}
function buildSet() {
  zb.fill(-1e9); pix.fill(0); kinds.fill(0); ground.fill(0); shadowMask.fill(0); staticShadow.fill(0);
  tufts.length = 0; leaves.length = 0; pendingShadows.length = 0; slabTops.length = 0; glowReset();
  for (let iy = 0; iy < H; iy++) for (let ix = 0; ix < W; ix++) {
    const g = unproject(ix + .5, iy + .5), i = iy * W + ix, c = groundAt(g.x, g.y, ix, iy);
    if (!c) continue;
    pix[i] = c; ground[i] = 1; zb[i] = (g.x + g.y) / R2 * COS; kinds[i] = KIND_ROAD;
  }
  groundZ.set(zb);
  part('pared', backWall);
  part('sala', room);
  flushShadows(); pendingShadows.length = 0;
  bakeOcclusion(); joinSlabs(); staticShadow.set(shadowMask); applyShadows(groundZ); shadeEdges();
  lightPass([1.0, .96, .88], [6, 2, -6], false);
  skyFill(() => rgb(30, 24, 30));
  bakedPix.set(pix); bakedZ.set(zb);
}
window.SALA_DIA = { SET, E, buildSet };
if (Q.get('tags') === '1') PART_TAGS = new Array(W * H).fill(null);
const t0 = performance.now();
buildSet();
window.BAKE_MS = performance.now() - t0;
function frame(t, casts = []) {
  pix.set(bakedPix); zb.set(bakedZ);
  for (const c of casts) castShadow(c[0], c[1], c[2], c[3]);
  applyShadows(groundZ);
  ctx.putImageData(image, 0, 0);
  return image;
}
frame(SET.t);
window.TAGS = PART_TAGS;
window.DEPTH = { z: bakedZ, OX, OY, S };
window.frame = frame;
</script></body></html>
