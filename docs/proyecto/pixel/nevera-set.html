<script>
'use strict';
/* La nevera: abuela's fridge, the counter with the sink and the big window on the patio (place 3, La cocina, its third scene), as a set on the
   Pixel Plays engine (order 39a). The same room as La mesa and La estufa (cocina-kit.js: the floor, the walls, the tile band, the counter and
   its cupboard, the window with the patio beyond, the light and the scale), cut open as La sala.
   The layout stands on the world's axes (the kit's plan: the corner of the two standing walls at (0, 0), the left wall on x = 0 facing +x, the
   back wall on y = 0 facing +y):
     the counter runs along the back wall from the corner to past the picture's right edge, the sink set into it near the corner, its tap at the
       wall; over it the big window on the patio (the kit's 'patio' view: sky and a cloud, the yard's cream wall, the hedge's green), as tall as
       the old one (round 2: this set raises its own walls for it), its reveal the wall's thickness, its sill a ledge under it;
     the fridge stands against the left wall a little way from the corner, whole in the view, its front looking +x (towards the counter), its one
       door hinged on its far edge (the left on the screen): open, it stands out into the room at the fridge's side, its inner face (white, the
       racks) and its handle seen, and shows the white inside: two shelves with a dark edge, the lower bin with its drawer (shut: a white front
       and a dark handle; pulled out: a drawer box with sides, the fruit in it); half open, the door turned a little out of the light, the dark
       inside seen past its top;
     the wooden stool stands on the floor in front, where the frog stands on it (the old BANCO).
   The state comes from the address; these become the builder's setKey:
     nev    = 0 | 1 | 2      W.nev.abierta: shut, open, half open
     cajon  = 0 | 1 | 2      (open only) the drawer of the lower bin: none, shut (W.nev.cajon), pulled out (W.nev.cajonver)
     pila   = 0 | a | j      W.pila: the sink empty, dishwater, juice
     banco  = 1 | 0          W.banco: the stool (the review pictures have none)
     t      = wind time (nothing sways here); ox, oy = the origin
   It draws one frame: the baked set. No characters. */
const Q = new URLSearchParams(location.search);
const pick = (k, allowed, def) => { const v = Q.get(k); return allowed.includes(v) ? v : def; };
const SET = {
  nev: +pick('nev', ['0', '1', '2'], '0'),
  cajon: +pick('cajon', ['0', '1', '2'], '0'),
  pila: pick('pila', ['0', 'a', 'j'], '0'),
  banco: pick('banco', ['0', '1'], '1') === '1',
  t: +(Q.get('t') || 0),
};
if (SET.nev !== 1) SET.cajon = 0;
const GQ = Q.get('g') ? JSON.parse(Q.get('g')) : {};   // design only: overrides of the plan's numbers (not a state)
window.PP_SCENE = { w: 240, h: 216, s: 26, originX: +(Q.get('ox') || GQ.ox || -21), originY: +(Q.get('oy') || GQ.oy || -1), shadowX: .9, shadowY: -.1 };
</script>

<script>
'use strict';
cocinaCheckScene();
/* ---------- the plan (world units; the kit's frame) ---------- */
const g = (k, d) => GQ[k] == null ? d : GQ[k];
const XR = 9, YL = 9;                                          // the walls run past the picture's right and left edges
const CA1 = g('ca1', 6.8);                                     // the counter: from the corner (a 0) along the back wall; it ends inside the view, so that whoever comes in from the right walks in front of it
// round 2: the window as tall as the old one where the family stands outside (z 1.6 to 4.7: the outside seen through it 62 rows and more, its
// lowest row, over the sill and the reveal, 22 rows over the feet of whoever stands outside, as the old sill); the kit's walls are cut at K.WH 3.2, so this set raises its own walls to WALL_H round its call of cocinaBuild (the other scenes keep theirs)
const WIN = { face: 'y', a0: g('wa0', 2.35), a1: g('wa1', 8.0), z0: g('wz0', 1.6), z1: g('wz1', 4.7), view: 'patio', bars: 'none', horizon: g('hz', 3.3), name: 'ventana' };
const WALL_H = g('wh', 4.95);
const FR = { a0: g('fa0', .95), a1: g('fa1', 3.6), d: g('fd', 1.35), h: g('fh', 3.4) };   // the fridge on the left wall: along y from a0 to a1, depth d, height h (round 2: a1 3.6, so that its far side ends inside the view)
FR.fz = FR.h - .02;                                            // one door, from the plinth to the top (the old freezer door is gone: the inside needs the height)
FR.shelves = [g('s1', 2.0), g('s2', .85)];                   // the two glass shelves (their top surfaces)
FR.bin = [.16, g('bin', .74)];                                 // the lower bin (the drawer's place): from z bin[0] to bin[1]
const SINK = { a0: g('ka0', 1.25), a1: g('ka1', 2.4), d0: .12, d1: .8 };   // the basin in the counter top, along a from a0 to a1, d from d0 to d1 (round 2: larger, its middle still at the old EN.pila 124)
const STOOL = { sx: 120, sy: g('stsy', 190), h: .72, r: .32 };  // the stool: its top's middle on the screen (where the frog's feet are), its height and half width

const SHELF_EDGE = [30, 58, 82], WHITE = [240, 242, 248], WHITE_D = [214, 218, 230], INSIDE = [236, 240, 244], INSIDE_D = [206, 212, 220], GLASS = [150, 196, 214], GASKET = [150, 154, 170], HANDLE = [96, 100, 118];
const DARK = [44, 52, 66], SHELF = [226, 230, 236];   // round 2: the inside white (a fridge, not a display case), the shelves white with a dark front edge
// round 2, for the sheet's checks: the pixels each named piece drew that are still seen after the bake (mark(name, fn))
const MARKS = {}, MARKING = Q.get('tags') === '1';
function mark(name, fn) { if (!MARKING) { fn(); return; } const b = zb.slice(); fn(); const m = MARKS[name] = MARKS[name] || new Map(); for (let i = 0; i < zb.length; i++) if (zb[i] !== b[i]) m.set(i, zb[i]); }
const marked = () => Object.fromEntries(Object.entries(MARKS).map(([k, m]) => [k, [...m].filter(([i, z]) => bakedZ[i] === z).map(([i]) => i)]));
const at = (sx, sy, z = 0) => { const u = (sx - OX) / S, v = (sy - OY + z * COS * S) / (S * SIN); return [(u + v) / R2, (v - u) / R2, z]; };   // the point at height z under a screen point
</script>
<script>
'use strict';
/* ---------- the fridge ---------- */
// In the left wall's frame: a along the wall (world y), d out from it (world x), z up. Its front looks +x (d = FR.d), its end at a1 looks +y
// (lit, the left side on the screen), its top. The door hinges at (FR.d, a1): shut it lies along the front, open it turns back towards +y.
function fridge() {
  const { a0, a1, d, h, fz } = FR, W0 = rampOf(WHITE), In = rampOf(INSIDE), open = SET.nev === 1, half = SET.nev === 2;
  const wall = .08;                                          // the body's walls
  const paintBody = (f, p, q, sh) => {
    if (f === 'top') return kRgb(p > a1 - .03 || q > d - .03 ? WHITE : WHITE_D);
    if (f === 'end') return kRgb(kLit(q < .08 ? [70, 70, 84] : p > d - .04 ? WHITE_D : WHITE, false));
    return 0;
  };
  // the cabinet: its top and its lit end (the left side on the screen); the front is drawn by the doors or the inside
  part('nevera', () => {
    kBox('x', a0, a1, 0, d, .08, h, paintBody, 'te');
    // the feet: a dark plinth under it
    kSolid('x', a0 + .05, a1 - .05, .1, d - .06, 0, .08, [56, 56, 66], 'fe');
    if (!open && !half) doorShut();
  });
  if (open || half) part('nevera.dentro', inside);
  if (open) part('nevera.puerta', doorOpen); else if (half) part('nevera.puerta', doorHalf);
}
// the main door, shut: a white leaf over the front from the plinth to the freezer, its handle a long bar near the free edge
function doorShut() {
  const { a0, a1, d, fz } = FR;
  kBox('x', a0, a1, d, d + .06, .08, fz - .02, (f, p, q, sh) => {
    if (f === 'top') return kRgb(WHITE_D);
    if (f === 'end') return kRgb(WHITE_D);
    if (q < .12 || q > fz - .06 || p < a0 + .03 || p > a1 - .03) return kRgb(kLit(GASKET, sh));
    return kRgb(kLit(WHITE, sh));
  }, 'tfe');
  // the handle: an upright bar standing off the door
  kSolid('x', a0 + .3, a0 + .38, d + .06, d + .14, fz - 1.45, fz - .4, HANDLE);
}
// the inside: the back and the walls white, the two shelves (white, a dark front edge), the lower bin; the drawer (shut or pulled out).
// Half open: the same hollow, unlit (a dark gap seen down past the leaf's top)
function inside() {
  const { a0, a1, d, fz } = FR, half = SET.nev === 2, w = .09, z0 = .14, z1 = fz - .1;
  const In = rampOf(half ? DARK : INSIDE), Sh = half ? DARK : SHELF;
  // the hollow, seen through the front: its far wall (the back, x = w) and its floor, its near side wall (a0 + w, looking +y), its roof
  planeQuad([w, a0 + w, z0], [0, a1 - a0 - 2 * w, 0], [0, 0, z1 - z0], () => In[3]);
  planeQuad([w, a0 + w, z0], [d - w, 0, 0], [0, 0, z1 - z0], () => In[2]);
  planeQuad([w, a0 + w, z0], [d - w, 0, 0], [0, a1 - a0 - 2 * w, 0], () => In[3]);
  planeQuad([w, a0 + w, z1], [d - w, 0, 0], [0, a1 - a0 - 2 * w, 0], () => In[1]);
  // the front rim of the cabinet round the opening: its walls' thickness, white, a grey gasket line on its inner edge
  const rim = (b0, b1, c0, c1) => kBox('x', b0, b1, d - .06, d, c0, c1, (f, p, q, sh) => kRgb(f === 'top' ? WHITE_D : kLit(WHITE, sh)), 'tfe');
  mark('rim', () => { rim(a0, a0 + w, z0, z1); rim(a1 - w, a1, z0, z1); rim(a0, a1, z1, fz); rim(a0, a1, .08, z0); });
  // the two shelves: a white plate with a dark front edge
  for (const z of FR.shelves) kBox('x', a0 + w, a1 - w, w, d - .06, z - .05, z, (f, p, q, sh) => f === 'top' ? kRgb(q > d - .08 || q < w + .06 || p < a0 + w + .07 || p > a1 - w - .07 ? SHELF_EDGE : Sh) : kRgb(kLit(Sh, sh)), 'tf');   // a dark edge all round its top
  // the lower bin: the drawer's place
  const [b0, b1] = FR.bin;
  if (SET.cajon === 2) {
    // pulled out: a drawer box standing out of the front on the bin's floor, joined to the fridge's foot: its floor, its two sides, its back
    // and its front panel with a dark handle; low, so that the fruit in it shows over its front (the fruit is the sprite layer's)
    const out = DRAWER_OUT, x0 = d - .3, x1 = d + out, s0 = a0 + .2, s1 = a1 - .2, fl = b0 + .06, top = b0 + .3, th = .05;
    const Dr = rampOf(INSIDE_D);
    planeQuad([x0, s0, fl], [x1 - x0, 0, 0], [0, s1 - s0, 0], () => kRgb([168, 180, 192]));                     // its floor (zone r)
    kBox('x', s0, s0 + th, x0, x1, b0, top, (f, p, q, sh) => kRgb(f === 'top' ? WHITE : kLit(INSIDE_D, sh)), 'tfe');   // the far side
    kBox('x', s1 - th, s1, x0, x1, b0, top, (f, p, q, sh) => kRgb(f === 'top' ? WHITE : kLit(WHITE_D, sh)), 'tfe');   // the near side (its outer face lit)
    kBox('x', s0, s1, x1 - th, x1, b0, top, (f, p, q, sh) => { if (f === 'top') return kRgb(WHITE); if (Math.abs(q - (top - .1)) < .035 && Math.abs(p - (s0 + s1) / 2) < .35) return kRgb(HANDLE); if (q < b0 + .03 || q > top - .03) return kRgb(GASKET); return kRgb(kLit(WHITE, sh)); }, 'tfe');   // the front panel
    // the bin's empty mouth behind it, dark
    planeQuad([d - .07, a0 + w, b0], [0, a1 - a0 - 2 * w, 0], [0, 0, b1 - b0], () => kRgb(DARK));
  } else if (SET.cajon === 1) {
    // shut: the drawer's white front across the bin, a dark gap round it and a long dark handle
    kBox('x', a0 + w, a1 - w, w, d - .04, b0, b1, (f, p, q, sh) => {
      if (f === 'top') return kRgb(SHELF);
      if (q > b1 - .05 || q < b0 + .05 || p < a0 + w + .05 || p > a1 - w - .05) return kRgb(DARK);
      if (Math.abs(q - (b1 - .18)) < .04 && Math.abs(p - (a0 + a1) / 2) < .55) return kRgb(HANDLE);
      return kRgb(kLit(WHITE, sh));
    }, 'tf');
  } else {
    // no drawer: the bin's floor and its low glass lip, the inside behind
    kBox('x', a0 + w, a1 - w, w, d - .06, b0, b0 + .06, (f, p, q, sh) => f === 'top' ? kRgb(Sh) : kRgb(kLit(SHELF_EDGE, sh)), 'tf');
  }
}
// the door: a leaf turned about its hinge (FR.d, a1) by an angle (0 shut). Open (DOOR_OPEN, round 2: 150 degrees) it stands out into the
// room at the fridge's side, its inner face (white, the racks) looking at the camera, its handle a bar on its free edge; half open
// (DOOR_HALF, 1 degree) its outer face turned a little, out of the light, the dark inside seen past its top edge
const DOOR_OPEN = g('dopen', 2.62), DOOR_HALF = g('dhalf', .02), DRAWER_OUT = g('dout', .8);
function leafAt(ang) {
  const { a0, a1, d, fz } = FR, len = a1 - a0, hx = d, hy = a1;
  const dx = Math.sin(ang), dy = -Math.cos(ang), th = .1;
  const nx = Math.cos(ang), ny = Math.sin(ang);              // the leaf's outer face's normal (shut: +x)
  const P0 = [hx, hy, .08], E1 = [dx * len, dy * len, 0], E2 = [0, 0, fz - .1];
  const outer = (s, t) => { const q = .08 + (fz - .1) * t; return kRgb(kLit(q < .12 || q > fz - .06 || s > .98 ? GASKET : WHITE, nx + ny < 0 || (ang > 0 && ang < .5))); };
  const inner = (s, t) => { const rack = [.3, .55, .8].some(r => Math.abs(t - r) < .03) && s > .12 && s < .88; return kRgb(s > .95 || s < .05 || t < .03 || t > .97 ? GASKET : rack ? SHELF_EDGE : INSIDE_D); };
  mark('door.outer', () => planeQuad([P0[0] + nx * th, P0[1] + ny * th, P0[2]], E1, E2, outer));
  mark('door.inner', () => planeQuad(P0, E1, E2, inner));
  // the free edge's thickness, and the handle: an upright bar on the outer side at the free edge, standing .1 off it
  const F0 = [P0[0] + E1[0], P0[1] + E1[1], P0[2]];
  planeQuad(F0, [nx * th, ny * th, 0], E2, () => kRgb(GASKET));
  const H0 = [F0[0] + nx * th, F0[1] + ny * th, fz - 1.5];
  mark('door.handle', () => { planeQuad(H0, [nx * .12, ny * .12, 0], [0, 0, 1.1], () => kRgb(HANDLE));
    planeQuad([H0[0] - dx * .06, H0[1] - dy * .06, H0[2]], [nx * .12, ny * .12, 0], [0, 0, 1.1], () => kRgb(HANDLE)); });
  return { dx, dy, len };
}
function doorOpen() { leafAt(DOOR_OPEN); }
function doorHalf() { leafAt(DOOR_HALF); }

/* ---------- the sink and its tap ---------- */
function sink() {
  const { a0, a1, d0, d1 } = SINK, z = K.CZ + .004, St = rampOf([206, 210, 222]);
  part('pila', () => {
    // the basin, seen from above: a steel rim, its far inner wall in shade, its bottom; the dishwater (grey-blue, suds) or the juice (orange)
    // filling it (round 2: larger, and what is in it dark enough to tell from the empty steel at a glance)
    mark('basin', () => planeQuad([a0, d0, z], [a1 - a0, 0, 0], [0, d1 - d0, 0], (s, t) => {
      const ea = s * (a1 - a0), ed = t * (d1 - d0);
      if (ea < .07 || ea > a1 - a0 - .07 || ed < .07 || ed > d1 - d0 - .07) return St[4];
      if (ea < .1 || ed > d1 - d0 - .1) return kRgb([120, 124, 140]);                // the rim's inner lip, dark
      if (SET.pila === 'a') return kRgb(((Math.floor(ea * 14) * 7 + Math.floor(ed * 14) * 3) % 11 === 0) ? [214, 228, 236] : ed < .2 ? [72, 98, 120] : [96, 128, 150]);
      if (SET.pila === 'j') return kRgb(ed < .2 ? [150, 66, 4] : [196, 94, 10]);
      if (ed < .2) return St[1];                                                       // the far inner wall, in shade
      return St[3];
    }));
    // the tap: a pipe up from the counter top at the wall, its spout over the basin's middle
    const ta = (a0 + a1) / 2, Tp = [150, 154, 172];
    kSolid('y', ta - .05, ta + .05, .02, .12, K.CZ, K.CZ + .55, Tp);
    kSolid('y', ta - .05, ta + .05, .02, .42, K.CZ + .49, K.CZ + .57, Tp);
    kSolid('y', ta - .05, ta + .05, .34, .42, K.CZ + .38, K.CZ + .49, Tp);
  });
}

/* ---------- the stool: a square wooden seat on four legs ---------- */
// Drawn after the room is baked (so the floor's occlusion makes no ring round its thin legs): its own silhouette is darkened against the floor
// as shadeEdges does, and each leg casts only a short contact shadow at its foot, on its shadow side (the kit's cocinaShadowFoot)
const stoolFoot = () => at(STOOL.sx, STOOL.sy + STOOL.h * COS * S, 0);
function stool() {
  if (!SET.banco) return;
  const [cx, cy] = stoolFoot(), r = STOOL.r, hh = STOOL.h;
  const before = zb.slice();
  part('banco', () => {
    for (const [ex, ey] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) kSolid('y', cx + ex * (r - .07) - .035, cx + ex * (r - .07) + .035, cy + ey * (r - .07) - .035, cy + ey * (r - .07) + .035, 0, hh - .06, KC.woodD, 'fe');
    kSolid('y', cx - r + .07, cx + r - .07, cy - .02, cy + .02, .22, .28, KC.woodD, 'fe');
    kSolid('y', cx - .02, cx + .02, cy - r + .07, cy + r - .07, .22, .28, KC.woodD, 'fe');
    kSolid('y', cx - r, cx + r, cy - r, cy + r, hh - .06, hh, KC.woodL);
  });
  // its silhouette against the floor (shadeEdges' rule, for its own pixels only)
  const mine = []; for (let i = 0; i < W * H; i++) if (zb[i] !== before[i]) mine.push(i);
  for (const i of mine) { const a = i - W, b = i + W, c = i - 1, e = i + 1; if (zb[a] === groundZ[a] || zb[b] === groundZ[b] || zb[c] === groundZ[c] || zb[e] === groundZ[e]) tint(i, .68, .66, .76); }
  part('banco', () => { for (const [ex, ey] of [[1, -1], [1, 1], [-1, 1]]) cocinaShadowFoot(cx + ex * (r - .07), cy + ey * (r - .07)); });
  applyShadows(groundZ);
}

/* ---------- the floor's dimming (round 2) ----------
   The kit's cocinaOcclusion dims a floor pixel by whatever stands to its left on the screen; the counter's front falls to the right along the
   back wall, so the floor all along its lit foot was dimmed in a dotted fringe. Here the same dimming, by everything but the counter (its own
   shade is on its shadow side, its right end, where the kit's light does not reach) */
const CNTZ = new Float64Array(W * H).fill(NaN);
function occlusion() {
  const offsets = [];
  for (const r of [2, 4]) for (let k = 0; k < 8; k++) { const ox = Math.round(Math.cos(k * Math.PI / 4) * r), oy = Math.round(Math.sin(k * Math.PI / 4) * r * .7); if (ox < 0) offsets.push([ox, oy]); }
  const n = offsets.length;
  for (let iy = 4; iy < H - 4; iy++) for (let ix = 4; ix < W - 4; ix++) {
    const i = iy * W + ix; if (!ground[i] || zb[i] !== groundZ[i]) continue;
    let hits = 0; for (const [ox, oy] of offsets) { const j = (iy + oy) * W + ix + ox; if (zb[j] !== groundZ[j] && zb[j] !== CNTZ[j]) hits++; }
    if (!hits) continue;
    if (hits >= n) tint(i, .56, .54, .72); else if (hits / n > bayerAt(ix, iy)) tint(i, .74, .72, .84);
  }
}

/* ---------- bake one state ---------- */
function buildSet() {
  for (const k of Object.keys(MARKS)) delete MARKS[k];
  const WH0 = K.WH; K.WH = WALL_H;   // round 2: this set's walls are higher than the kit's (the tall window); restored at once after
  try { cocinaBuild({
    XR, YL, windows: [WIN], band: { y: [[0, CA1]] }, occlusion: 'none',   // round 2: the floor's dimming is this set's own (occlusion(), below)
    furnish() {
      if (!GQ.bare) { const b = zb.slice(); part('mostrador', () => cocinaBase('y', 0, CA1, { noEnd: false })); for (let i = 0; i < zb.length; i++) CNTZ[i] = zb[i] !== b[i] ? zb[i] : NaN; sink(); } else CNTZ.fill(NaN)   // g={"bare":1}: the floor without the counter (a check's picture: the fringe at its foot)
      fridge();
    },
    shadows() {
      part('nevera', () => cocinaShadowBlock(FR.d - .05, FR.a0 + .1, FR.d + .05, FR.a1 - .1, .25));
    },
  }); } finally { K.WH = WH0; }
  occlusion();
  stool();
  bakedPix.set(pix); bakedZ.set(zb);
}

/* ---------- for the sheet: every pixel's zone, the surfaces' rows ---------- */
// zone: s the backdrop, w the plaster, t the tile band, o the outside seen through the window, v the window's frame, bars and sill, c the counter's
// top, k its cupboard, p the sink and the tap, n the fridge's body (q its top), u its door, d its inside, e a shelf's or the bin's top, r the drawer
// pulled out, b the stool, f the floor
function zones() {
  const T = PART_TAGS || [], zone = [], outside = [];
  const dOn = (ix, iy, z) => { const g = at(ix + .5, iy + .5, z); return (g[0] + g[1]) / R2 * COS + z * SIN; };
  const back = (ix, iy) => kWallPixel('y', -K.T - K.OUTD, ix, iy).d;
  for (let iy = 0; iy < H; iy++) for (let ix = 0; ix < W; ix++) {
    const i = iy * W + ix, t = T[i], d = bakedZ[i];
    let z = 'f';
    if (d < -1e8) z = 's';
    else if (t === 'pared') { const wp = ix + .5 < OX ? kWallPixel('x', 0, ix, iy) : kWallPixel('y', 0, ix, iy); z = wp.z >= K.BAND0 && wp.z <= K.BAND1 && ix + .5 >= OX && wp.a <= CA1 ? 't' : 'w'; }
    else if (t === 'ventana') z = Math.abs(d - back(ix, iy)) < 1e-3 ? 'o' : 'v';
    else if (t === 'mostrador') z = Math.abs(d - dOn(ix, iy, K.CZ)) < .02 ? 'c' : 'k';
    else if (t === 'pila') z = 'p';
