<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Atkinson+Hyperlegible+Next:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit}
a{color:#EEF3F7}a:hover{color:#EEF3F7}

/* press: 90 ms down, 140 ms back */
.pr{transition:transform 140ms cubic-bezier(.2,0,0,1),filter 140ms cubic-bezier(.2,0,0,1)}
.pr:active{transform:scale(.97);filter:brightness(.9);transition-duration:90ms}

/* the ground darkens for a lesson */
.root{background:#0C1926;transition:background-color 320ms cubic-bezier(.2,0,0,1)}
.root[data-at="story"]{background:#12171D}
.root[data-way="out"]{transition-duration:200ms}

/* the three screens: the old one leaves in 140 ms, the new one comes 100 ms later */
.L{position:absolute;left:0;top:0;width:390px;height:844px;opacity:0;visibility:hidden;transition:opacity 140ms cubic-bezier(.4,0,1,1),visibility 0s linear 140ms}
.L-map{z-index:1}
.L-place,.L-story{z-index:3}
[data-at="map"] .L-map,[data-at="place"] .L-place,[data-at="story"] .L-story{opacity:1;visibility:visible;transition:opacity 220ms cubic-bezier(.2,0,0,1) 100ms,visibility 0s}
[data-way="out"][data-at="map"] .L-map,[data-way="out"][data-at="place"] .L-place{transition:opacity 140ms cubic-bezier(.2,0,0,1) 40ms,visibility 0s}

/* one picture, never cut: its window grows, the picture slides behind it at the same scale */
.win{position:absolute;z-index:2;overflow:hidden;cursor:pointer;transition:left 320ms cubic-bezier(.2,0,0,1),top 320ms cubic-bezier(.2,0,0,1),width 320ms cubic-bezier(.2,0,0,1),height 320ms cubic-bezier(.2,0,0,1),border-radius 320ms cubic-bezier(.2,0,0,1)}
.win img{position:absolute;width:392px;height:432px;image-rendering:pixelated;transition:left 320ms cubic-bezier(.2,0,0,1),top 320ms cubic-bezier(.2,0,0,1)}
[data-way="out"] .win,[data-way="out"] .win img{transition-duration:200ms}
[data-at="map"] .win{left:33px;top:602px;width:72px;height:72px;border-radius:16px}
[data-at="map"] .win img{left:-154px;top:-308px}
[data-at="place"] .win{left:0;top:0;width:390px;height:296px;border-radius:0}
[data-at="place"] .win img{left:-1px;top:-80px}
[data-at="story"] .win{left:0;top:64px;width:390px;height:400px;border-radius:0}
[data-at="story"] .win img{left:-1px;top:-24px}

/* arriving: rows rise 8 px, 30 ms apart; orange lands 80 ms after the last one */
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeOnly{from{opacity:0}to{opacity:1}}
[data-at="map"] .L-map .next{animation:rise 220ms cubic-bezier(.2,0,0,1) 180ms both}
[data-at="place"] .L-place .s0{animation:fadeOnly 140ms cubic-bezier(.2,0,0,1) 200ms both}
[data-at="place"] .L-place .s1{animation:rise 220ms cubic-bezier(.2,0,0,1) 120ms both}
[data-at="place"] .L-place .s2{animation:rise 220ms cubic-bezier(.2,0,0,1) 150ms both}
[data-at="place"] .L-place .s3{animation:rise 220ms cubic-bezier(.2,0,0,1) 180ms both}
[data-at="place"] .L-place .next{animation:rise 220ms cubic-bezier(.2,0,0,1) 260ms both}
[data-at="story"] .L-story .s1{animation:rise 220ms cubic-bezier(.2,0,0,1) 160ms both}
[data-at="story"] .L-story .s2{animation:rise 220ms cubic-bezier(.2,0,0,1) 190ms both}
[data-at="story"] .L-story .s3{animation:rise 220ms cubic-bezier(.2,0,0,1) 220ms both}
[data-at="story"] .L-story .next{animation:rise 220ms cubic-bezier(.2,0,0,1) 300ms both}

/* going back: faster, and nothing rises */
[data-way="out"] .s0,[data-way="out"] .s1,[data-way="out"] .s2,[data-way="out"] .s3,[data-way="out"] .next{animation-name:fadeOnly!important;animation-duration:140ms!important;animation-delay:40ms!important}

/* the tab bar sinks for a lesson and comes back after it */
.tabs{transition:transform 220ms cubic-bezier(.2,0,0,1) 60ms,opacity 140ms cubic-bezier(.2,0,0,1) 60ms}
[data-at="story"] .tabs{transform:translateY(96px);opacity:0;pointer-events:none;transition:transform 200ms cubic-bezier(.4,0,1,1),opacity 200ms cubic-bezier(.4,0,1,1)}

/* text on screen: a switch, 140 ms in place */
.txtb{background:#EEF3F7;color:#12171D;border:1px solid #EEF3F7;transition:background-color 140ms cubic-bezier(.2,0,0,1),color 140ms cubic-bezier(.2,0,0,1),border-color 140ms cubic-bezier(.2,0,0,1)}
[data-txt="0"] .txtb{background:transparent;color:#EEF3F7;border-color:#4A5663}
.lines{transition:opacity 140ms cubic-bezier(.2,0,0,1)}
[data-txt="0"] .lines{opacity:0}

/* reduced motion: every move is a 140 ms fade in place */
@media (prefers-reduced-motion:reduce){
.win,.win img,.pr{transition:none!important}
.tabs{transition:opacity 140ms linear!important;transform:none!important}
.s0,.s1,.s2,.s3,.next{animation-name:fadeOnly!important;animation-duration:140ms!important}
}
</style>
