<helmet>

<style>
body{margin:0}
button{font-family:inherit}
.pr{transition:transform 140ms cubic-bezier(.2,0,0,1),filter 140ms cubic-bezier(.2,0,0,1)}
.pr:active{transform:scale(.97);filter:brightness(.9);transition-duration:90ms}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeOnly{from{opacity:0}to{opacity:1}}

/* the last answer: green, one ring, the last dash fills; then the turn leaves in 140 ms */
.dash{display:block;height:8px;border-radius:4px;background:#37424D;overflow:hidden}
.dash i{display:block;height:8px;border-radius:4px;background:#EEF3F7;transform:scaleX(0);transform-origin:0 50%;transition:transform 220ms cubic-bezier(.4,0,.2,1)}
.dash.on i,[data-seq="1"] .d9 i,[data-seq="2"] .d9 i{transform:scaleX(1)}
.tile{position:relative;display:block;width:300px;height:160px;padding:0;border:0;background:#1B232C;box-shadow:0 0 0 1px #4A5663;transition:box-shadow 140ms cubic-bezier(.2,0,0,1),opacity 220ms cubic-bezier(.2,0,0,1),transform 140ms cubic-bezier(.2,0,0,1)}
.tile:active{transform:scale(.97);transition-duration:90ms}
[data-seq="1"] .tb,[data-seq="2"] .tb{box-shadow:0 0 0 3px #009E73}
[data-seq="1"] .ta,[data-seq="2"] .ta{opacity:.4}
.badge{position:absolute;right:8px;top:8px;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.8);transition:opacity 140ms cubic-bezier(.2,0,0,1),transform 140ms cubic-bezier(.2,0,0,1)}
[data-seq="1"] .badge,[data-seq="2"] .badge{opacity:1;transform:scale(1)}
.tring{position:absolute;left:0;top:0;width:300px;height:160px;box-sizing:border-box;border:2px solid #009E73;opacity:0;pointer-events:none}
[data-seq="1"] .tring{animation:tringOut 480ms cubic-bezier(.2,0,0,1) both}
@keyframes tringOut{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(1.08)}}
.turn,.end{position:absolute;left:0;top:56px;width:390px;height:788px;opacity:0;visibility:hidden;transition:opacity 140ms cubic-bezier(.4,0,1,1),visibility 0s linear 140ms}
[data-seq="0"] .turn,[data-seq="1"] .turn{opacity:1;visibility:visible;transition:none}
[data-seq="2"] .end{opacity:1;visibility:visible;transition:none}
.hx{transition:opacity 140ms cubic-bezier(.4,0,1,1)}
[data-seq="2"] .hx{opacity:0;pointer-events:none}

/* the end: lines rise 8 px, 30 ms apart; words arrive one by one, the first five only */
[data-seq="2"] .e1{animation:rise 220ms cubic-bezier(.2,0,0,1) 160ms both}
[data-seq="2"] .e2{animation:rise 220ms cubic-bezier(.2,0,0,1) 190ms both}
[data-seq="2"] .e3{animation:rise 220ms cubic-bezier(.2,0,0,1) 220ms both}
[data-seq="2"] .e4{animation:rise 220ms cubic-bezier(.2,0,0,1) 420ms both}
[data-seq="2"] .up .wt{animation:rise 220ms cubic-bezier(.2,0,0,1) calc(250ms + min(var(--i),4) * 30ms) both}
[data-seq="2"] .bk .wt{animation:rise 220ms cubic-bezier(.2,0,0,1) 450ms both}

/* what the review changed: each word that moves up fills one more stage, once, 480 ms */
.grow{transform-origin:0 50%}
[data-seq="2"] .grow{animation:stage 480ms cubic-bezier(.2,0,0,1) calc(560ms + min(var(--i),4) * 30ms) both}
@keyframes stage{from{transform:scaleX(var(--from))}to{transform:scaleX(1)}}

/* orange lands last */
[data-seq="2"] .next{animation:rise 220ms cubic-bezier(.2,0,0,1) 760ms both}

@media (prefers-reduced-motion:reduce){
.e1,.e2,.e3,.e4,.wt,.next{animation-name:fadeOnly!important;animation-duration:140ms!important}
.grow,.tring{animation:none!important}
}
</style>

<span style="position: absolute; left: 0; top: 0; width: 300px; height: 160px; overflow: hidden"><img src="/_blob/40d38295cde0422d18f57b9c9700ea0a" alt="" style="position: absolute; left: -42px; top: -130px; width: 392px; height: 432px; image-rendering: pixelated"></span>

</button></div>
</div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
componentWillUnmount() { clearTimeout(this._t); }
renderVals() {
var self = this, seq = (this.state || {}).seq || 0;
return {
seq: String(seq),
// the right answer, the last dash, and 900 ms later the end
pick: function () { if (((self.state || {}).seq || 0) !== 0) return; self.setState({ seq: 1 }); self._t = setTimeout(function () { self.setState({ seq: 2 }); }, 900); },
again: function () { clearTimeout(self._t); self.setState({ seq: 0 }); }
};
}
}
</script>
