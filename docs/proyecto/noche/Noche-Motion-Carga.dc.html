<style>
body{margin:0}
button{font-family:inherit}
.pr{transition:transform 140ms cubic-bezier(.2,0,0,1),filter 140ms cubic-bezier(.2,0,0,1)}
.pr:active{transform:scale(.97);filter:brightness(.9);transition-duration:90ms}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeOnly{from{opacity:0}to{opacity:1}}
.tb{color:#A7B8C8;font-weight:600}
.pill{pointer-events:none}

.t-map{color:#EEF3F7;font-weight:700}
.pill{opacity:0}
/* nothing for the first 300 ms; then three dots and one line. Only the dots move */
.wait,.fail{position:absolute;left:24px;right:24px;top:360px;display:flex;flex-direction:column;align-items:center;opacity:0;visibility:hidden;transition:opacity 140ms cubic-bezier(.4,0,1,1),visibility 0s linear 140ms}
[data-seq="1"] .wait{opacity:1;visibility:visible;transition:opacity 220ms cubic-bezier(.2,0,0,1) 300ms,visibility 0s}
[data-seq="1"] .dots span{animation:dot 900ms ease-in-out infinite}
[data-seq="1"] .dots span:nth-child(2){animation-delay:150ms}
[data-seq="1"] .dots span:nth-child(3){animation-delay:300ms}
@keyframes dot{0%,60%,100%{opacity:.35}30%{opacity:1}}
/* it could not load: the line rises, the one orange button lands after it */
[data-seq="2"] .fail{opacity:1;visibility:visible;transition:none}
[data-seq="2"] .f1{animation:rise 220ms cubic-bezier(.2,0,0,1) 100ms both}
[data-seq="2"] .next{animation:rise 220ms cubic-bezier(.2,0,0,1) 180ms both}
/* it loaded: the map comes up from the ground in 320 ms, the chips and the card rise, the tab bar comes up, orange lands last */
.app{position:absolute;left:0;top:0;width:390px;height:844px;visibility:hidden;pointer-events:none}
[data-seq="3"] .app{visibility:visible}
.map{opacity:0}
[data-seq="3"] .map{opacity:1;transition:opacity 320ms cubic-bezier(.2,0,0,1)}
.a1,.a2,.a3,.play{opacity:0}
[data-seq="3"] .a1{animation:rise 220ms cubic-bezier(.2,0,0,1) 180ms both}
[data-seq="3"] .a2{animation:rise 220ms cubic-bezier(.2,0,0,1) 240ms both}
[data-seq="3"] .a3{animation:rise 220ms cubic-bezier(.2,0,0,1) 210ms both}
.tabs{transform:translateY(96px);opacity:0}
[data-seq="3"] .tabs{transform:translateY(0);opacity:1;transition:transform 320ms cubic-bezier(.2,0,0,1) 160ms,opacity 220ms cubic-bezier(.2,0,0,1) 160ms}
[data-seq="3"] .play{animation:rise 220ms cubic-bezier(.2,0,0,1) 400ms both}
@media (prefers-reduced-motion:reduce){
.dots span{animation:none!important;opacity:1}
.tabs{transform:none!important}
.f1,.next,.a1,.a2,.a3,.play{animation-name:fadeOnly!important;animation-duration:140ms!important}
}
</style>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
componentWillUnmount() { this.clearAll(); }
st() { return this.state || {}; }
later(ms, fn) { var self = this; if (!this._t) this._t = []; this._t.push(setTimeout(function () { fn(self); }, ms)); }
clearAll() { (this._t || []).forEach(function (t) { clearTimeout(t); }); this._t = []; }
componentDidMount() { this.run(true); }
run(fail) {
// the first try fails so the screen for that can be seen; "Try again" loads
this.clearAll();
this.setState({ seq: 1 });
this.later(fail ? 2000 : 1500, function (c) { c.setState({ seq: fail ? 2 : 3 }); });
}
renderVals() {
var self = this, s = this.st();
return {
seq: String(s.seq || 0),
retry: function () { self.run(false); },
start: function () { if ((self.st().seq || 0) === 3) self.run(true); }
};
}
}
</script>
