body{margin:0}
button{font-family:inherit}

/* press: 90 ms down, 140 ms back */
.pr{transition:transform 140ms cubic-bezier(.2,0,0,1),filter 140ms cubic-bezier(.2,0,0,1)}
.pr:active{transform:scale(.97);filter:brightness(.9);transition-duration:90ms}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeOnly{from{opacity:0}to{opacity:1}}

.L-map{position:absolute;left:0;top:0;width:390px;height:844px;overflow:hidden}

/* the camera follows the coquí: it travels for as long as he hops (6 hops, 1.2 s) */
.cam{position:absolute;left:0;top:0;width:512px;height:960px;transform:translate(-122px,-280px)}
[data-seq="3"] .cam,[data-seq="4"] .cam{transform:translate(-61px,-160px);transition:transform 1200ms cubic-bezier(.4,0,.2,1)}

/* the new place gets its colours, the finished stop its flag: one settle, 480 ms */
.mapB{opacity:0}
[data-seq="2"] .mapB,[data-seq="3"] .mapB,[data-seq="4"] .mapB{opacity:1;transition:opacity 480ms cubic-bezier(.2,0,0,1) 100ms}

/* the coquí hops to it: the map's own frames */
.hop{position:absolute;left:224px;top:564px;width:144px;height:220px;background:url(/_blob/7bd9695ca953344cf616fe361c5492f1) 0 0/12816px 220px no-repeat;image-rendering:pixelated;visibility:hidden}
[data-seq="3"] .hop,[data-seq="4"] .hop{visibility:visible;animation:hopStrip 1467ms steps(88) both}
@keyframes hopStrip{from{background-position:0 0}to{background-position:-12672px 0}}

/* "You are here" leaves first; the new place is named while he travels, and the name becomes "You are here" when he lands */
.here{opacity:0;transition:opacity 140ms cubic-bezier(.4,0,1,1)}
[data-seq="0"] .here3,[data-seq="1"] .here3{opacity:1}
[data-seq="4"] .here4{opacity:1;transition:opacity 140ms cubic-bezier(.2,0,0,1) 100ms}
.dest{opacity:0;transition:opacity 140ms cubic-bezier(.4,0,1,1)}
[data-seq="2"] .dest,[data-seq="3"] .dest{opacity:1;animation:rise 220ms cubic-bezier(.2,0,0,1) 240ms both}

/* the story he has just finished: the lesson's ground covers the map and lifts */
.cover{position:absolute;z-index:5;left:0;top:0;width:390px;height:844px;background:#12171D;opacity:0;visibility:hidden;transition:opacity 200ms cubic-bezier(.4,0,1,1),visibility 0s linear 200ms}
[data-seq="1"] .cover{opacity:1;visibility:visible;transition:opacity 320ms cubic-bezier(.2,0,0,1),visibility 0s}

/* when he arrives, the card becomes that place and grows a little: a handle and an arrow say it opens */
.card{height:155px;transition:height 220ms cubic-bezier(.4,0,.2,1),transform 220ms cubic-bezier(.4,0,.2,1)}
[data-seq="4"] .card{height:216px}
.cUp,.cPk{opacity:0;visibility:hidden;transition:opacity 90ms cubic-bezier(.4,0,1,1),visibility 0s linear 90ms}
[data-seq="0"] .cUp,[data-seq="1"] .cUp,[data-seq="2"] .cUp,[data-seq="3"] .cUp,[data-seq="4"] .cPk{opacity:1;visibility:visible;transition:none;animation:rise 220ms cubic-bezier(.2,0,0,1) 60ms both}
[data-seq="4"] .nextP{animation:rise 220ms cubic-bezier(.2,0,0,1) 140ms both}

/* the tab bar is away while the story covers the screen */
.tabs{transition:transform 220ms cubic-bezier(.2,0,0,1) 60ms,opacity 140ms cubic-bezier(.2,0,0,1) 60ms}
[data-seq="1"] .tabs{transform:translateY(96px);opacity:0;transition:transform 200ms cubic-bezier(.4,0,1,1),opacity 200ms cubic-bezier(.4,0,1,1)}

/* reduced motion: he is placed at once, and every move is a 140 ms fade */
@media (prefers-reduced-motion:reduce){
.cam,.pr,.card{transition:none!important}
.tabs{transform:none!important}
.hop{animation-duration:1ms!important}
.dest,.cUp,.cPk,.nextP{animation-name:fadeOnly!important;animation-duration:140ms!important}
}
</style>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
componentWillUnmount() { this.clearAll(); }
later(ms, seq) {
var self = this;
if (!this._t) this._t = [];
this._t.push(setTimeout(function () { self.setState({ seq: seq }); }, ms));
}
clearAll() { (this._t || []).forEach(function (t) { clearTimeout(t); }); this._t = []; }
play() {
var seq = (this.state || {}).seq || 0;
this.clearAll();
if (seq === 4) { this.setState({ seq: 0 }); return; }
if (seq !== 0) return;
this.setState({ seq: 1 });   // the story covers the screen
this.later(900, 2);          // back on the map: "You are here" leaves, the new place gets its colours
this.later(1600, 3);         // he hops there, the camera with him: 1.2 s
this.later(2900, 4);         // he has settled: "You are here", and the card moves on
}
renderVals() {
var self = this;
return { seq: String((this.state || {}).seq || 0), play: function () { self.play(); } };
}
}
</script>
