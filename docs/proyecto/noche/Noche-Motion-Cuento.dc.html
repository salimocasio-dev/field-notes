<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Noche motion: the mic and the answers</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Atkinson+Hyperlegible+Next:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit}

/* press: 90 ms down, 140 ms back */
.pr{transition:transform 140ms cubic-bezier(.2,0,0,1),filter 140ms cubic-bezier(.2,0,0,1)}
.pr:active{transform:scale(.97);filter:brightness(.9);transition-duration:90ms}

/* the frame holds; only the turn changes: old turn out in 140 ms, new rows rise 8 px, 30 ms apart */
.B{position:absolute;left:0;top:64px;width:390px;height:780px;opacity:0;visibility:hidden;transition:opacity 140ms cubic-bezier(.4,0,1,1),visibility 0s linear 140ms}
[data-step="1"] .B1,[data-step="2"] .B2{opacity:1;visibility:visible;transition:opacity 220ms cubic-bezier(.2,0,0,1) 140ms,visibility 0s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeOnly{from{opacity:0}to{opacity:1}}
[data-step="1"] .B1 .s1,[data-step="2"] .B2 .s1{animation:rise 220ms cubic-bezier(.2,0,0,1) 160ms both}
[data-step="1"] .B1 .s2,[data-step="2"] .B2 .s2{animation:rise 220ms cubic-bezier(.2,0,0,1) 190ms both}
[data-step="1"] .B1 .s3,[data-step="2"] .B2 .s3{animation:rise 220ms cubic-bezier(.2,0,0,1) 220ms both}
[data-step="1"] .B1 .next{animation:rise 220ms cubic-bezier(.2,0,0,1) 300ms both}

/* a dash fills when its part is done: 220 ms, travelling */
.dash{display:block;height:8px;border-radius:4px;background:#37424D;overflow:hidden}
.dash i{display:block;height:8px;border-radius:4px;background:#EEF3F7;transform:scaleX(0);transform-origin:0 50%;transition:transform 220ms cubic-bezier(.4,0,.2,1)}
.dash.on i{transform:scaleX(1)}
[data-done="4"] .d4 i,[data-done="5"] .d4 i,[data-done="5"] .d5 i{transform:scaleX(1)}

/* text on screen: a switch, 140 ms in place */
.txtb{background:#EEF3F7;color:#12171D;border:1px solid #EEF3F7;transition:background-color 140ms cubic-bezier(.2,0,0,1),color 140ms cubic-bezier(.2,0,0,1),border-color 140ms cubic-bezier(.2,0,0,1)}
[data-txt="0"] .txtb{background:transparent;color:#EEF3F7;border-color:#4A5663}
.lines{transition:opacity 140ms cubic-bezier(.2,0,0,1)}
[data-txt="0"] .lines{opacity:0}

/* the mic: one disc, six states; colour changes in 140 ms, the halo grows in 220 ms */
.mic{background:#28323C;color:#8C99A6;box-shadow:inset 0 0 0 2px rgba(238,243,247,0),0 0 0 0 rgba(29,58,82,0);transition:background-color 140ms cubic-bezier(.2,0,0,1),color 140ms cubic-bezier(.2,0,0,1),box-shadow 220ms cubic-bezier(.2,0,0,1),transform 140ms cubic-bezier(.2,0,0,1)}
.mic:active{transform:scale(.94);transition-duration:90ms}
[data-mic="ready"] .mic{background:#E69F00;color:#14110F}
[data-mic="listening"] .mic{background:#56B4E9;color:#0C1926;box-shadow:inset 0 0 0 2px rgba(86,180,233,0),0 0 0 8px #1D3A52}
[data-mic="thinking"] .mic{background:#3A2433;color:#CC79A7;box-shadow:inset 0 0 0 2px #CC79A7,0 0 0 0 rgba(29,58,82,0)}
[data-mic="right"] .mic{background:#009E73;color:#14110F}
[data-mic="notyet"] .mic{background:rgba(18,23,29,0);color:#EEF3F7;box-shadow:inset 0 0 0 2px #EEF3F7,0 0 0 0 rgba(29,58,82,0)}

/* what the disc holds changes in place */
.i{position:absolute;left:50%;top:50%;display:flex;transform:translate(-50%,-50%) scale(.8);opacity:0;transition:opacity 140ms cubic-bezier(.2,0,0,1),transform 140ms cubic-bezier(.2,0,0,1)}
[data-mic="they"] .i-mic,[data-mic="ready"] .i-mic,[data-mic="listening"] .i-mic,[data-mic="thinking"] .i-dots,[data-mic="right"] .i-ok,[data-mic="notyet"] .i-again{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* the word under it changes in place */
.w{position:absolute;left:0;right:0;top:0;text-align:center;opacity:0;transition:opacity 140ms cubic-bezier(.2,0,0,1)}
[data-mic="they"] .w-they,[data-mic="ready"] .w-ready,[data-mic="listening"] .w-listening,[data-mic="thinking"] .w-thinking,[data-mic="right"] .w-right,[data-mic="notyet"] .w-notyet{opacity:1}

/* live things loop, and only while they are live: level bars and thinking dots */
.lv{display:flex;align-items:center;gap:4px;height:56px;opacity:0;transition:opacity 140ms cubic-bezier(.2,0,0,1)}
.lv span{width:4px;height:56px;border-radius:2px;background:#56B4E9;transform:scaleY(.15);animation:lvl 640ms ease-in-out infinite alternate;animation-play-state:paused;transition:background-color 140ms cubic-bezier(.2,0,0,1)}
.lv span:nth-child(1){animation-delay:-330ms}
.lv span:nth-child(2){animation-duration:480ms;animation-delay:-150ms}
.lv span:nth-child(3){animation-duration:760ms;animation-delay:-420ms}
.lv span:nth-child(4){animation-duration:560ms;animation-delay:-260ms}
.lv span:nth-child(5){animation-duration:700ms;animation-delay:-610ms}
@keyframes lvl{from{transform:scaleY(.15)}to{transform:scaleY(1)}}
[data-mic="listening"] .lvm,[data-mic="they"] .lvm,[data-play="1"] .lvw{opacity:1}
[data-mic="listening"] .lvm span,[data-mic="they"] .lvm span,[data-play="1"] .lvw span{animation-play-state:running}
[data-mic="they"] .lvm span,.lvw span{background:#CC79A7}
.lvw{height:24px}
.lvw span{height:24px}
[data-mic="thinking"] .i-dots span{animation:dot 900ms ease-in-out infinite}
[data-mic="thinking"] .i-dots span:nth-child(2){animation-delay:150ms}
[data-mic="thinking"] .i-dots span:nth-child(3){animation-delay:300ms}
@keyframes dot{0%,60%,100%{opacity:.35}30%{opacity:1}}

/* right: one ring leaves the disc, once, 480 ms */
.ring{position:absolute;left:0;top:0;width:96px;height:96px;box-sizing:border-box;border-radius:50%;border:2px solid #009E73;opacity:0;pointer-events:none}
[data-mic="right"] .ring{animation:ringOut 480ms cubic-bezier(.2,0,0,1) both}
@keyframes ringOut{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(1.5)}}

/* the line plays again: the arrow turns once */
.spA{animation:spinA 480ms cubic-bezier(.2,0,0,1)}
.spB{animation:spinB 480ms cubic-bezier(.2,0,0,1)}
@keyframes spinA{from{transform:rotate(0deg)}to{transform:rotate(-360deg)}}
@keyframes spinB{from{transform:rotate(0deg)}to{transform:rotate(-360deg)}}

/* a choice: a miss is a white outline; right is green with one ring; the other tile steps back */
.tile{position:relative;display:block;width:300px;height:160px;padding:0;border:0;background:#1B232C;box-shadow:0 0 0 1px #4A5663;transition:box-shadow 140ms cubic-bezier(.2,0,0,1),opacity 220ms cubic-bezier(.2,0,0,1),transform 140ms cubic-bezier(.2,0,0,1)}
.tile:active{transform:scale(.97);transition-duration:90ms}
[data-miss="1"] .ta{box-shadow:0 0 0 3px #EEF3F7}
[data-hit="1"] .tb{box-shadow:0 0 0 3px #009E73}
[data-hit="1"] .ta{opacity:.4}
.badge{position:absolute;right:8px;top:8px;width:28px;height:28px;box-sizing:border-box;border-radius:50%;display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.8);transition:opacity 140ms cubic-bezier(.2,0,0,1),transform 140ms cubic-bezier(.2,0,0,1)}
[data-miss="1"] .ta .badge,[data-hit="1"] .tb .badge{opacity:1;transform:scale(1)}
.tring{position:absolute;left:0;top:0;width:300px;height:160px;box-sizing:border-box;border:2px solid #009E73;opacity:0;pointer-events:none}
[data-hit="1"] .tb .tring{animation:tringOut 480ms cubic-bezier(.2,0,0,1) both}
@keyframes tringOut{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(1.08)}}

/* reduced motion: every move is a 140 ms fade in place; live bars stand still */
@media (prefers-reduced-motion:reduce){
.s1,.s2,.s3,.next{animation-name:fadeOnly!important;animation-duration:140ms!important}
.dash i{transition:none!important}
.lv span,.i-dots span,.spA,.spB,.ring,.tring{animation:none!important}
.lv span{transform:scaleY(.6)!important}
.pr,.mic,.tile,.i,.badge{transition-property:opacity,background-color,color,box-shadow!important}
}
</style>
</helmet>
<div data-step="{{ step }}" data-mic="{{ mic }}" data-done="{{ done }}" data-miss="{{ miss }}" data-hit="{{ hit }}" data-play="{{ play }}" data-txt="{{ txt }}" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #12171D; color: #EEF3F7; font-family: 'Atkinson Hyperlegible Next', Arial, sans-serif">

<header style="height: 64px; box-sizing: border-box; padding: 0 16px 0 8px; display: flex; align-items: center; gap: 8px">
<button type="button" class="pr" onClick="{{ restart }}" aria-label="Close. Here it starts the two turns again." style="width: 48px; height: 48px; padding: 0; border: 0; background: transparent; color: #EEF3F7; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
<div role="img" aria-label="Parts of the lesson" style="flex-grow: 1; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
<span class="dash on"><i></i></span>
<span class="dash on"><i></i></span>
<span class="dash on"><i></i></span>
<span class="dash d4"><i></i></span>
<span class="dash d5"><i></i></span>
<span class="dash"><i></i></span>
<span class="dash"><i></i></span>
</div>
<button type="button" class="txtb" onClick="{{ toggleTxt }}" aria-label="Text on screen" style="margin-left: 8px; width: 56px; height: 48px; padding: 0; border-radius: 24px; font: 700 14px/1 'Atkinson Hyperlegible Next', Arial, sans-serif; letter-spacing: .06em">TXT</button>
</header>

<!-- Turn 1 · say it: the mic goes through its six states -->
<div class="B B1">
<div style="position: relative; height: 400px; overflow: hidden">
<img src="/_blob/d197900360466bcd3fdc5f842352506e" alt="La cocina. La mesa, las sillas y el coquí." style="position: absolute; left: -1px; top: -24px; width: 392px; height: 432px; image-rendering: pixelated">
</div>
<section class="lines" style="box-sizing: border-box; padding: 24px 24px 0">
<div class="s1" style="font: 700 12px/1 'Atkinson Hyperlegible Next', Arial, sans-serif; letter-spacing: .08em; color: #A7B8C8">ABUELA</div>
<p class="s2" style="margin: 8px 0 0; font: 600 28px/36px 'Atkinson Hyperlegible Next', Arial, sans-serif">¿Tienes hambre?</p>
<p class="s3" style="margin: 8px 0 0; font: 500 18px/24px 'Atkinson Hyperlegible Next', Arial, sans-serif; color: #A7B8C8">Dile a Abuela: <strong style="font-weight: 700; color: #EEF3F7">Tengo hambre.</strong></p>
</section>
<div class="next" style="position: absolute; left: 0; right: 0; bottom: 32px; display: flex; flex-direction: column; align-items: center; gap: 16px">
<div style="display: flex; align-items: center; gap: 16px">
<button type="button" class="pr" onClick="{{ again }}" aria-label="Hear it again" style="width: 48px; height: 48px; padding: 0; border-radius: 50%; border: 1px solid #4A5663; background: transparent; color: #EEF3F7; display: flex; align-items: center; justify-content: center"><span class="{{ spinCls }}" style="display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v5h5"/></svg></span></button>
<div class="lv lvm" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
<div style="position: relative; width: 96px; height: 96px">
<span class="ring" aria-hidden="true"></span>
<button type="button" class="mic" onClick="{{ tapMic }}" aria-label="Microphone" style="position: relative; width: 96px; height: 96px; padding: 0; border: 0; border-radius: 50%">
<span class="i i-mic"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span>
<span class="i i-dots" aria-hidden="true" style="gap: 8px"><span style="width: 12px; height: 12px; border-radius: 50%; background: #CC79A7"></span><span style="width: 12px; height: 12px; border-radius: 50%; background: #CC79A7"></span><span style="width: 12px; height: 12px; border-radius: 50%; background: #CC79A7"></span></span>
<span class="i i-ok"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l6 6L20 6"/></svg></span>
<span class="i i-again"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v5h5"/></svg></span>
</button>
</div>
<div class="lv lvm" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
<span aria-hidden="true" style="width: 48px; height: 48px"></span>
</div>
<div aria-live="polite" style="position: relative; width: 200px; height: 14px; font: 700 14px/1 'Atkinson Hyperlegible Next', Arial, sans-serif">
<span class="w w-they" style="color: #CC79A7">Escucha</span>
<span class="w w-ready" style="color: #E69F00">Toca y habla</span>
<span class="w w-listening" style="color: #56B4E9">Te escucho</span>
<span class="w w-thinking" style="color: #CC79A7">Un momento</span>
<span class="w w-right" style="color: #009E73">¡Muy bien!</span>
<span class="w w-notyet" style="color: #EEF3F7">Otra vez</span>
</div>
</div>
</div>

<!-- Turn 2 · which one: a miss, then the right one -->
<div class="B B2">
<div class="s1" style="box-sizing: border-box; height: 136px; padding: 24px 24px 0; display: flex; align-items: flex-start; justify-content: space-between">
<div class="lines">
<div style="font: 700 12px/1 'Atkinson Hyperlegible Next', Arial, sans-serif; letter-spacing: .08em; color: #A7B8C8">ABUELA</div>
<div style="margin-top: 8px; display: flex; align-items: center; gap: 12px"><p style="margin: 0; font: 600 28px/36px 'Atkinson Hyperlegible Next', Arial, sans-serif">la estufa</p><div class="lv lvw" aria-hidden="true"><span></span><span></span><span></span></div></div>
</div>
<button type="button" class="pr" onClick="{{ again2 }}" aria-label="Hear it again" style="flex: none; width: 48px; height: 48px; padding: 0; border-radius: 50%; border: 1px solid #4A5663; background: transparent; color: #EEF3F7; display: flex; align-items: center; justify-content: center"><span class="{{ spinCls2 }}" style="display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v5h5"/></svg></span></button>
</div>
<div class="s2" style="margin: 24px 45px 0">
<button type="button" class="tile ta" onClick="{{ pickA }}" aria-label="Picture 1">
<span style="position: absolute; left: 0; top: 0; width: 300px; height: 160px; overflow: hidden"><img src="/_blob/d197900360466bcd3fdc5f842352506e" alt="" style="position: absolute; left: -52px; top: -110px; width: 392px; height: 432px; image-rendering: pixelated"></span>
<span class="badge" aria-hidden="true" style="background: #12171D; border: 2px solid #EEF3F7; color: #EEF3F7"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></span>
</button>
</div>
<div class="s3" style="margin: 20px 45px 0">
<button type="button" class="tile tb" onClick="{{ pickB }}" aria-label="Picture 2">
<span style="position: absolute; left: 0; top: 0; width: 300px; height: 160px; overflow: hidden"><img src="/_blob/40d38295cde0422d18f57b9c9700ea0a" alt="" style="position: absolute; left: -42px; top: -130px; width: 392px; height: 432px; image-rendering: pixelated"></span>
<span class="tring" aria-hidden="true"></span>
<span class="badge" aria-hidden="true" style="background: #009E73; color: #14110F"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l6 6L20 6"/></svg></span>
</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
componentDidMount() {
this.later(1600, function (c) { if (c.st().mic === undefined) c.setState({ mic: 'ready' }); });
}
componentWillUnmount() { this.clearAll(); }
st() { return this.state || {}; }
later(ms, fn) {
var self = this;
if (!this._t) this._t = [];
this._t.push(setTimeout(function () { fn(self); }, ms));
}
clearAll() {
(this._t || []).forEach(function (t) { clearTimeout(t); });
this._t = [];
}
replay() {
this.clearAll();
this.setState({ mic: 'they', spun: true, spin: !this.st().spin });
this.later(1500, function (c) { c.setState({ mic: 'ready' }); });
}
stop() {
this.clearAll();
this.setState({ mic: 'thinking' });
this.later(900, function (c) {
if (!c.st().tries) {
c.setState({ mic: 'notyet', tries: 1 });
c.later(900, function (c2) { c2.replay(); });
} else {
c.setState({ mic: 'right' });
c.later(600, function (c2) { c2.setState({ done: 4 }); });
c.later(1300, function (c2) { c2.setState({ step: 2 }); });
}
});
}
tapMic() {
var m = this.st().mic || 'they';
if (m === 'ready') {
this.clearAll();
this.setState({ mic: 'listening' });
this.later(2200, function (c) { c.stop(); });
} else if (m === 'listening') {
this.stop();
} else if (m === 'notyet') {
this.replay();
}
}
again() {
var m = this.st().mic || 'they';
if (m === 'ready' || m === 'notyet') this.replay();
}
playWord() {
this.setState({ play: 1, spun2: true, spin2: !this.st().spin2 });
this.later(1300, function (c) { c.setState({ play: 0 }); });
}
pickA() {
if (this.st().hit) return;
this.clearAll();
this.setState({ miss: 1 });
this.playWord();
}
pickB() {
if (this.st().hit) return;
this.clearAll();
this.setState({ hit: 1, play: 0 });
this.later(300, function (c) { c.setState({ done: 5 }); });
this.later(2000, function (c) { c.restart(); });
}
restart() {
this.clearAll();
this.setState({ step: 1, mic: 'they', done: 3, miss: 0, hit: 0, tries: 0, play: 0 });
this.later(1600, function (c) { c.setState({ mic: 'ready' }); });
}
renderVals() {
var self = this;
var s = this.st();
return {
step: String(s.step || 1),
mic: s.mic || 'they',
done: String(s.done || 3),
miss: s.miss ? '1' : '0',
hit: s.hit ? '1' : '0',
play: s.play ? '1' : '0',
txt: s.txt === false ? '0' : '1',
spinCls: s.spun ? (s.spin ? 'spA' : 'spB') : '',
spinCls2: s.spun2 ? (s.spin2 ? 'spA' : 'spB') : '',
tapMic: function () { self.tapMic(); },
again: function () { self.again(); },
again2: function () { if (!self.st().hit) { self.clearAll(); self.playWord(); } },
pickA: function () { self.pickA(); },
pickB: function () { self.pickB(); },
restart: function () { self.restart(); },
toggleTxt: function () { self.setState({ txt: self.st().txt === false }); }
};
}
}
</script>
