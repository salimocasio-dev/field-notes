"use strict";
const $=s=>document.querySelector(s),DAY=864e5,now=()=>Date.now(),sleep=ms=>new Promise(r=>setTimeout(r,ms));
function hash(s){let h=2166136261;for(const c of s){h^=c.codePointAt(0);h=Math.imul(h,16777619)}return (h>>>0).toString(36)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ============ memory: FSRS per item per skill, with a first-days ladder ============ */
const FW=[0.4872,1.4003,3.7145,13.8206,5.1618,1.2298,0.8975,0.031,1.6474,0.1367,1.0461,2.1072,0.0793,0.3246,1.587,0.2272,2.8755];
const DECAY=-0.5,FACTOR=19/81,clampD=d=>Math.min(10,Math.max(1,d)),D0=g=>clampD(FW[4]-(g-3)*FW[5]),LADDER=[1,3];
function retr(st,t=now()){if(!st||!st.last)return 0;const days=Math.max(0,(t-st.last)/DAY);return Math.pow(1+FACTOR*days/st.S,DECAY);}
const dayStart=(t=now())=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime();};
function review(st,g,t=now()){
  let S,D,lapses=st?st.lapses||0:0,reps=st?st.reps||0:0,dn=st?(st.dn==null?LADDER.length+1:st.dn):0,ld=st?st.ld||null:null;
  const d=new Date(t),dkey=d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
  if(g>1&&ld!==dkey){dn++;ld=dkey;}
  if(!st){S=FW[g-1];D=D0(g);}
  else{const r=retr(st,t);D=clampD(FW[7]*D0(3)+(1-FW[7])*(st.D-FW[6]*(g-3)));
    if(g===1){S=FW[11]*Math.pow(st.D,-FW[12])*(Math.pow(st.S+1,FW[13])-1)*Math.exp(FW[14]*(1-r));S=Math.min(S,st.S);lapses++;}
    else S=st.S*(1+Math.exp(FW[8])*(11-st.D)*Math.pow(st.S,-FW[9])*(Math.exp(FW[10]*(1-r))-1)*(g===2?FW[15]:1)*(g===4?FW[16]:1));}
  S=Math.max(0.1,Math.min(S,36500));reps++;
  let days=Math.max(1,Math.round(S));if(g>1&&dn>=1&&dn<=LADDER.length)days=Math.min(days,LADDER[dn-1]);
  const due=g===1?t+10*6e4:dayStart(t)+days*DAY+3*36e5;
  return {S:+S.toFixed(4),D:+D.toFixed(4),last:t,due,reps,lapses,dn,ld};
}
const whenBack=st=>{if(!st)return "";const d=Math.round((dayStart(st.due)-dayStart())/DAY);return d<=0?"today":d===1?"tomorrow":"in "+d+" days";};

      try{const s=await Promise.race([this.doc.get(),new Promise((_,rj)=>setTimeout(()=>rj(0),10000))]);if(s.exists)this.st=JSON.parse(JSON.stringify(s.data()));this.mode="cloud";}catch(e){}}

  queue:[],running:0,
  prefetch(list){if(!this.on())return;list.forEach(x=>{const k=this.key(x[0],VOX[x[1]]);if(!this.mem.has(k)&&!this.queue.some(q=>q[2]===k))this.queue.push([x[0],x[1],k]);});this.pump();},
  pump(){while(this.running<3&&this.queue.length&&this.on()){const x=this.queue.shift();this.running++;this.url(x[0],x[1]).catch(e=>{this.failed++;}).finally(()=>{this.running--;this.pump();});}}

const Player={el:null,un:false,rej:null,
  init(){this.el=new Audio();this.el.preload="auto";},
  unlock(){if(this.un||!this.el)return;this.un=true;try{this.el.src=SILENT;const p=this.el.play();p&&p.catch(()=>{this.un=false;});}catch(e){this.un=false;}},
  play(url){return new Promise((res,rej)=>{const a=this.el;this.stop();this.rej=rej;
    a.onended=()=>{this.rej=null;res();};a.onerror=()=>{this.rej=null;res();};a.src=url;
    const p=a.play();if(p)p.catch(()=>{this.rej=null;res();});});},

const Voice={seq:0,synth:("speechSynthesis" in window)?window.speechSynthesis:null,
  stop(){this.seq++;Player.stop();try{this.synth&&this.synth.cancel();}catch(e){}},
  // returns "ok", "stopped" or "fail" and never throws
  async say(text,who){this.stop();const my=this.seq;
    if(Eleven.on()){try{const wait=!Eleven.mem.has(Eleven.key(text,VOX[who]||VOX.male));if(wait)vst(1);let u;try{u=await Eleven.url(text,who);}finally{if(wait)vst(-1);}

let AC=null;

/* ============ ears: Claude's speech-to-text, where the browser offers it ============ */
const nrm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim();

const ART=["la","el","los","las","un","una"];
// did what was heard contain the line? Forgiving on purpose: a learner's accent and the recogniser both blur short words.
function saidIt(heard,targets){const h=nrm(heard).split(" ").filter(Boolean);if(!h.length)return false;
  return targets.some(T=>{const t=nrm(T).split(" ").filter(w=>w&&ART.indexOf(w)<0);return t.length>0&&t.every(w=>h.some(x=>lev(x,w)<=(w.length<=4?0:w.length<=6?1:2)));});}
const Ear={d:null,on:false,cur:null,err:null,
  async init(){try{if(window.claude&&claude.use)this.d=await claude.use("dictation");}catch(e){}
    if(this.d){this.d.onPartial(e=>this.part(e.text));this.d.onFinal(e=>this.fin(e.text));
      this.d.onState(e=>{this.on=e.state==="listening";if(e.state==="idle"&&this.cur)this.cur.res({ok:false,why:"micoff",heard:""});});}},
  // has to be called straight from a tap
  begin(){if(!this.d)return Promise.resolve(false);if(this.on)return Promise.resolve(true);
    return this.d.start({language:"es"}).then(()=>{this.on=true;this.err=null;return true;}).catch(e=>{this.err=(e&&e.code)||"error";return false;});},
  end(){if(this.d&&this.on)this.d.stop().catch(()=>{});},
  show(t){const e=$("#heard");if(e)e.textContent=t?"heard: "+t:" ";},
  // accept(text) answers true (that's it), false (clearly wrong) or null (keep listening). Words that arrive before arm are ignored: that's the app's own voice.

function micTest(){const out=$("#micout");if(!out)return;
  if(!Ear.d){out.textContent="This browser can't hear you. Listening works in Chrome, not in Safari or the Claude app.";return;}
  let heard="";out.textContent="Listening for 6 seconds. Say: hola, ¿cómo estás?";
  const u1=Ear.d.onPartial(e=>{if($("#micout"))$("#micout").textContent="Hearing: "+(heard+e.text).trim();}),u2=Ear.d.onFinal(e=>{heard+=e.text;if($("#micout"))$("#micout").textContent="Heard: "+heard.trim();});
  const end=t=>{u1();u2();if($("#micout"))$("#micout").textContent=t;};
  Ear.d.start({language:"es"}).then(()=>{setTimeout(()=>{Ear.d.stop().then(()=>end(heard.trim()?"Heard: "+heard.trim():"I heard nothing. Try again, closer to the phone."));},6000);})
    .catch(e=>{const c=e&&e.code;end(c==="unavailable"?"Spanish listening isn't offered in this browser.":c==="not_granted"?"The microphone is blocked for this page.":c==="dismissed"?"You closed the question. Tap Mic test again.":"The microphone didn't start ("+(c||"error")+").");});}

class Buf{
  constructor(w,h){this.w=w;this.h=h;this.cv=document.createElement("canvas");this.cv.width=w;this.cv.height=h;this.cx=this.cv.getContext("2d");this.im=this.cx.createImageData(w,h);this.d=this.im.data;}
  px(x,y,c){x=Math.floor(x);y=Math.floor(y);if(x<0||y<0||x>=this.w||y>=this.h)return;const v=rgb(c),i=(y*this.w+x)*4,d=this.d;d[i]=v[0];d[i+1]=v[1];d[i+2]=v[2];d[i+3]=255;}
  has(x,y){return x>=0&&y>=0&&x<this.w&&y<this.h&&this.d[(y*this.w+x)*4+3]>0;}
  rect(x,y,w,h,c){x=Math.round(x);y=Math.round(y);for(let j=0;j<h;j++)for(let i=0;i<w;i++)this.px(x+i,y+j,c);}
  ell(cx,cy,rx,ry,r){const n=r.length;for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++)for(let x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++){
      const nx=(x+.5-cx)/rx,ny=(y+.5-cy)/ry,dd=nx*nx+ny*ny;if(dd>1)continue;if(n===1){this.px(x,y,r[0]);continue;}
      const v=(-nx*.5-ny*.62+Math.sqrt(1-dd)*.6)*.8+.22,i=Math.floor(Math.max(0,Math.min(.999,v))*(n-1)+bay(x,y));this.px(x,y,r[Math.max(0,Math.min(n-1,i))]);}}
  grad(x,y,w,h,r,hz){const n=r.length;for(let j=0;j<h;j++)for(let i=0;i<w;i++){const t=hz?i/w:j/h;this.px(x+i,y+j,r[Math.min(n-1,Math.floor(Math.min(.999,t)*(n-1)+bay(x+i,y+j)))]);}}
  cap(x0,y0,x1,y1,rad,r){const n=Math.max(1,Math.ceil(Math.hypot(x1-x0,y1-y0)));for(let i=0;i<=n;i++)this.ell(x0+(x1-x0)*i/n,y0+(y1-y0)*i/n,rad,rad,r);}
  line(x0,y0,x1,y1,c){const n=Math.max(1,Math.ceil(Math.max(Math.abs(x1-x0),Math.abs(y1-y0))));for(let i=0;i<=n;i++)this.px(Math.round(x0+(x1-x0)*i/n),Math.round(y0+(y1-y0)*i/n),c);}
  frame(x,y,w,h,c){this.rect(x,y,w,1,c);this.rect(x,y+h-1,w,1,c);this.rect(x,y,1,h,c);this.rect(x+w-1,y,1,h,c);}
  outline(c){const a=[];for(let y=0;y<this.h;y++)for(let x=0;x<this.w;x++)if(!this.has(x,y)&&(this.has(x-1,y)||this.has(x+1,y)||this.has(x,y-1)||this.has(x,y+1)))a.push(x,y);for(let i=0;i<a.length;i+=2)this.px(a[i],a[i+1],c||OUT);return this;}
  done(){this.cx.putImageData(this.im,0,0);return this.cv;}
}

  vars(id){const P=this.plan(id),m=P.m,here=k=>ITEMS[k].home===m.scene,
      line=k=>"- "+wordOf(k)+" ("+ITEMS[k].en+") | picture: "+(here(k)?k+" = "+PICD[k]:"none")+" | "+(here(k)&&canTouch(k)?"touch":"say")+" | step "+stepOf(k)+(peek(k).x===0?" | NEW":isDue(k)?" | DUE":"");
    return {place:m.name,scene:SCENED[m.scene],words:P.all.map(line).join("\n"),opening:OPEN[id][1],minutes:String(CALL_MIN)};},
  start(id){this.id=id;this.m=MISSIONS[id];this.world={};this.P=this.plan(id);this.conv=null;this.last="";this.over=false;this.t0=0;this.ask=null;this.picTurn=null;this.listening=false;this.closing=0;this.tapWait=false;
    this.exp={};this.hit={};this.miss={};this.said={};this.lat=[];this.shell("Before you call");this.set(this.m.scene,this.wide(),null);
    this.panel(`<h3>${this.m.name} with Danny · ${CALL_MIN} minutes</h3><div class="mut">Danny talks and the picture follows him.</div><div class="mut"><b>«Toca…»</b> means touch it in the picture.</div><div class="mut">He may ask <b>sí o no</b>, or <b>«¿… o …?»</b> Answer out loud.</div><div class="mut">Say any word you like, any time. Lost? Tap <b>I'm stuck</b>.</div><div class="row"><button class="btn go" id="dial">Start the call</button><button class="btn sm" id="bk2">Back</button></div>`);
    on("dial",()=>this.dial());on("bk2",()=>{this.over=true;showMap();});},
  async dial(){this.label("Calling Danny…");this.panel(`<div class="mut">Calling Danny…</div>`);this.pic(OPEN[this.id][0]);
    const back=t=>{this.over=true;this.panel(`<h3>Couldn't reach Danny</h3><div class="mut">${t}</div><div class="row"><button class="btn go" id="mp">Back to the map</button></div>`);on("mp",showMap);};
    if(!window.ELConv)return back("The voice part of the page didn't load. Check your connection and reload.");
    try{this.conv=await window.ELConv.startSession({agentId:AGENT,connectionType:"webrtc",dynamicVariables:this.vars(this.id),
        clientTools:{show_picture:p=>{this.pic(p&&p.picture);return "shown";}},
        onConnect:()=>this.live(),onDisconnect:d=>{if(d&&d.message&&!this.err)this.err=String(d.message);this.finish();},onError:e=>{this.err=String((e&&e.message)||e||"");},
        onMessage:m=>this.msg(m),onModeChange:m=>this.mode(m&&m.mode)});}
    catch(e){back(String((e&&e.message)||e||"The call didn't start.")+" If you blocked the microphone, allow it for this page and try again.");}},
  live(){this.t0=now();this.label("Live with Danny");
    this.panel(`<div class="row" style="margin-top:0"><span class="mic" id="dot"></span><div style="flex:1"><div class="say" style="font-size:17px" id="who">Danny is talking</div><div class="mut" id="hint">&nbsp;</div></div></div><div class="mut" id="heard">&nbsp;</div><div id="tx" style="min-height:22px"></div><div class="row"><button class="btn" id="stk">I'm stuck</button><button class="btn sm no" id="endb">End</button></div>`);
    on("endb",()=>this.end());
    on("stk",()=>{const t=$("#tx");if(t)t.innerHTML=this.last?`<div class="mut">Danny said: <b>${this.last}</b></div>`:"";this.send("(ayuda)");});
    this.tm1=setTimeout(()=>{this.closing=1;this.send("(fin)");},CALL_MIN*6e4);this.tm2=setTimeout(()=>this.end(),CALL_MIN*6e4+25000);},
  send(t){try{if(this.conv)this.conv.sendUserMessage(t);}catch(e){}},
  mode(m){const you=m==="listening";this.listening=you;const w=$("#who"),d=$("#dot");if(w)w.textContent=you?"Your turn":"Danny is talking";if(d)d.style.background=you?"var(--red)":"#8698BC";
    if(!you)return;this.picTurn=null;if(this.ask&&!this.ask.t0){this.ask.t0=now();this.arm();}if(this.closing===2)setTimeout(()=>this.end(),900);},
  // Danny asked for a touch: take the pointer away, show the whole scene, start the clock
  arm(){this.set(this.m.scene,this.wide(),null);this.put("hint","Touch it in the picture");},
  msg(m){const who=m&&(m.source||m.role),text=m&&(m.message||m.text);if(!text)return;
    if(who==="user"){if(/^\s*[(.]/.test(text))return;this.put("heard","heard: "+text);this.P.all.forEach(k=>{if(saidIt(text,[ITEMS[k].es].concat(ITEMS[k].alt||[])))this.said[k]=1;});return;}
    this.last=text;this.tapWait=false;const t=$("#tx");if(t)t.innerHTML="";if(this.closing===1)this.closing=2;
    const n=" "+nrm(text)+" ",ups=[],dk=dayKey();
    this.P.all.forEach(k=>{if(n.indexOf(" "+coreOf(k)+" ")<0)return;const w=Wd(k),s0=stepOf(k);w.x++;if(w.ld!==dk){w.d++;w.ld=dk;}this.exp[k]=(this.exp[k]||0)+1;const s1=stepOf(k);if(s1!==s0)ups.push("PASO: «"+wordOf(k)+"» is now step "+s1+".");});
    if(ups.length)try{this.conv.sendContextualUpdate(ups.join(" "));}catch(e){}
    this.ask=null;this.put("hint"," ");const i=n.lastIndexOf(" toca ");if(i<0)return;const rest=n.slice(i+5);
    const c=this.P.active.filter(k=>canTouch(k)).map(k=>[rest.indexOf(" "+coreOf(k)+" "),k]).filter(a=>a[0]>=0).sort((a,b)=>a[0]-b[0])[0];if(!c)return;
    const k=c[1];if(k==="abuela")this.world.ab=1;if(k==="jugo"){this.world.ab=1;this.world.cup=1;}
    this.ask={k,t0:this.listening?now():null,cold:this.picTurn!==k};if(this.ask.cold||this.listening)this.arm();},
  tap(p){if(this.over||!this.conv||!this.t0||this.tapWait)return;if(this.zoom){if(this.ask)this.arm();return;}
    const sc=SC[this.scene],st=this.st,vis=k=>this.scene!=="casa"||(k==="abuela"?!!st.ab:k==="jugo"?st.cup==="ab":true);
    const hit=sc.hot.map(h=>h[0]).find(k=>{if(!vis(k))return false;const b=sc.boxOf(st,k);return b&&p.x>=b[0]-3&&p.x<=b[0]+b[2]+3&&p.y>=b[1]-3&&p.y<=b[1]+b[3]+3;});if(!hit)return;
    const a=this.ask;if(a){const lat=a.t0?now()-a.t0:0,ok=hit===a.k;if(ok){if(a.cold)this.hit[a.k]=Math.min(this.hit[a.k]==null?1e9:this.hit[a.k],lat);}else this.miss[a.k]=1;this.lat.push({k:a.k,ok,lat,cold:a.cold});this.ask=null;}
    this.tapWait=true;setTimeout(()=>{this.tapWait=false;},6000);this.set(this.m.scene,Object.assign({},this.wide(),{glow:hit}),null);this.put("hint"," ");this.put("heard","touched: "+wordOf(hit));this.send("(toca: "+wordOf(hit)+")");},
  end(){if(this.over){showMap();return;}try{if(this.conv)this.conv.endSession();}catch(e){}setTimeout(()=>this.finish(),1500);},
  finish(){if(this.over)return;this.over=true;clearTimeout(this.tm1);clearTimeout(this.tm2);const secs=this.t0?Math.round((now()-this.t0)/1000):0,m=this.m;
    if(secs<6){this.label("No answer");this.panel(`<h3>Danny didn't pick up</h3><div class="mut">The call was dropped before it started. That is not your phone or your mic. The usual cause is that the ElevenLabs voice credits for the month have run out.${this.err?" ("+this.err+")":""}</div><div class="row"><button class="btn go" id="mp">Back to the map</button></div>`);on("mp",showMap);return;}
    const dk=dayKey(),next=d=>dayStart()+d*DAY+3*36e5,got=[],heard=[],again=[];
    Object.keys(this.exp).forEach(k=>{const w=Wd(k),ok=(this.hit[k]!=null&&this.hit[k]<=FAST)||this.said[k];
      if(ok){if(w.adv!==dk&&(w.lvl===0||w.due<=now())){w.lvl=Math.min(w.lvl+1,INT.length-1);w.adv=dk;w.due=next(INT[w.lvl]);}got.push(wordOf(k));}
      else if(this.miss[k]){w.lvl=Math.max(0,w.lvl-1);w.due=next(1);again.push(wordOf(k));}
      else{if(!w.due||w.lvl===0)w.due=next(1);heard.push(wordOf(k));}});
    Store.st.log=(Store.st.log||[]).concat([{t:now(),id:this.id,secs,lat:this.lat}]).slice(-30);
    const prev=Store.st.done[this.id];Store.st.done[this.id]={n:(prev?prev.n:0)+1,t:now()};Store.save();
    this.label("Done");this.set(m.scene,Object.assign({},this.wide(),{stars:1}),null);
    this.panel(`<h3>${m.name} · ${Math.max(1,Math.round(secs/60))} min with Danny</h3>`+(got.length?`<div class="mut"><b>You got:</b> ${got.join(", ")}</div>`:"")+(heard.length?`<div class="mut"><b>Heard:</b> ${heard.join(", ")}</div>`:"")+(again.length?`<div class="mut"><b>Back tomorrow:</b> ${again.join(", ")}</div>`:"")+`<div class="mut" style="margin-top:6px">A word you get comes back after 1 day, then 3, 7 and 14. A word you miss comes back tomorrow.</div><div class="row"><button class="btn go" id="mp">Back to the map</button></div>`);
    on("mp",()=>{App.sel=null;showMap();});}
};

/* ============ boot ============ */
(async function(){app.innerHTML=`<div class="hud"><span>COQUÍ</span></div><div class="pan"><div class="mut">Loading your world…</div></div>`;
  Player.init();document.addEventListener("pointerdown",()=>Player.unlock(),true);
  await Promise.all([Store.init(),Eleven.init(),Ear.init()]);
  setInterval(()=>{App.f++;if(App.draw&&$("#cv"))App.draw(App.f);},150);
  window.Coqui={Store,Mission,ITEMS,MISSIONS,SC,App,dueList,showMap,Eleven,mem,stepOf,Wd,peek,isDue};
  showMap();})();
</script></body></html>
